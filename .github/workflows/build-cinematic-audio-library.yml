name: Build cinematic audio library index

on:
  workflow_dispatch:
  push:
    branches:
      - codex/samurai-cinematic-audio-v1
    paths:
      - "audio-library/README.md"
      - "audio-library/SOURCES.json"
      - "audio-library/SOUND_DESIGN_STANDARD.md"
      - "tools/audio/**"
      - ".github/workflows/build-cinematic-audio-library.yml"

permissions:
  contents: write

concurrency:
  group: cinematic-audio-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg for audio probing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Test fail-closed rights, source matching and Meta attribution
        run: |
          python -m unittest discover -s tools/audio -p "test_*.py" -v
          python tests/audio/test_audio_preview_bundle.py
          python tests/audio/test_meta_open_sound_preview.py

      - name: Download and inventory existing Build 76 audio archives
        run: |
          python tools/audio/build_audio_library_index.py \
            --download-dir "$RUNNER_TEMP/nolane-audio-library" \
            --output build/audio-catalog.json \
            --report build/AUDIO-LIBRARY-REPORT.md

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("build/audio-catalog.json").read_text())
          assert catalog["archive_count"] == 6, catalog["archive_count"]
          assert catalog["audio_asset_count"] > 0, "No audio files discovered"
          assert catalog["policy"]["human_audition_required"] is True
          assert all(not x["approved_for_final_mix"] for x in catalog["assets"])
          print("Validated", catalog["audio_asset_count"], "audio entries")
          print("Rights", catalog["rights_status_counts"])
          PY

      - name: Extract and validate CC0/Public Domain listening bank
        run: |
          set -euo pipefail
          python tools/audio/build_audio_preview_bundle.py \
            --catalog build/audio-catalog.json \
            --download-dir "$RUNNER_TEMP/nolane-audio-library" \
            --output-dir build/audio-preview-bank
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("build/audio-preview-bank/preview-catalog.json").read_text())
          assert catalog["summary"]["playable_audio_files"] > 0
          assert catalog["summary"]["human_auditioned"] == 0
          assert catalog["summary"]["approved_for_final_mix"] == 0
          assert (Path("build/audio-preview-bank") / "AUDIO_PREVIEW_BANK.html").is_file()
          print(json.dumps(catalog["summary"], indent=2))
          PY

      - name: Build verified Meta Open Sound preview bank
        run: |
          set -euo pipefail
          python -m py_compile tools/audio/build_meta_open_sound_preview.py
          python tools/audio/build_meta_open_sound_preview.py \
            --download-dir "$RUNNER_TEMP/meta-open-sound" \
            --output-dir build/audio-preview-bank/meta-open-sound
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/audio-preview-bank/meta-open-sound")
          catalog = json.loads((root / "meta-preview-catalog.json").read_text())
          summary = catalog["summary"]
          assert summary["files"] == 1583, summary
          assert summary["cc0_files"] == 1075, summary
          assert summary["cc_by_files"] == 508, summary
          assert summary["human_auditioned"] == 0
          assert (root / "META_AUDIO_PREVIEW_BANK.html").is_file()
          assert (root / "ATTRIBUTION.md").is_file()
          assert all(not item["auditioned_by_human"] for item in catalog["assets"])
          assert all(not item["approved_for_final_mix"] for item in catalog["assets"])
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish pinned Meta Open Sound source packs as a permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          META_AUDIO_RELEASE_TAG: nolane-historical-audio-library-v0.1.0
        run: |
          set -euo pipefail
          mkdir -p dist/meta-open-sound-release
          cp "$RUNNER_TEMP/meta-open-sound/"*.zip dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/ATTRIBUTION.md dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/meta-preview-catalog.json dist/meta-open-sound-release/meta-source-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog_path = Path("dist/meta-open-sound-release/meta-source-catalog.json")
          catalog = json.loads(catalog_path.read_text())
          base = "https://github.com/" + __import__("os").environ["GITHUB_REPOSITORY"] + "/releases/download/nolane-historical-audio-library-v0.1.0/"
          mirrored_wav_masters = {"meta-open-sound-oculus-audio-pack-wav.zip"}
          for item in catalog["assets"]:
              item.pop("preview_path", None)
              item["archive_download_url"] = base + item["archive_name"]
              master_name = item.get("wav_master_archive_name")
              if master_name:
                  item["wav_master_download_url"] = (
                      base + master_name if master_name in mirrored_wav_masters
                      else item.get("wav_master_source_url")
                  )
              item["preview_bank"] = "Download the separate GitHub Actions preview-bank artifact for local playable previews."
          catalog["purpose"] = "Source index for the four OGG ZIPs in this release; not itself a playable-media folder."
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          cp build/audio-preview-bank/meta-open-sound/README.md dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/"oculus-attribution.txt" dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/"oculus-license.txt" dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/"meta-piano-license.txt" dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/"meta-nylon-guitar-license.txt" dist/meta-open-sound-release/
          cp build/audio-preview-bank/meta-open-sound/"meta-steel-guitar-license.txt" dist/meta-open-sound-release/
          cat > dist/meta-open-sound-release/RELEASE-NOTES.md <<'EOF'
          # Nolane historical audio library — Meta Open Sound add-on

          Pinned source revision: facebookincubator/Meta-open-sound@251c0be57d5d1b3242b91f53e0cde62ab1cb42d9.

          - Oculus Audio Pack 1: 508 OGG previews / 289 distinct sounds / CC BY 4.0. Retain the exact attribution in ATTRIBUTION.md.
          - Meta Piano: 352 OGG multisamples / CC0 1.0.
          - Meta Nylon Guitar: 348 OGG multisamples / CC0 1.0.
          - Meta Steel Guitar: 375 OGG multisamples / CC0 1.0.

          The 1,583 OGG files are preview/selection media, not a set of mastered tracks. Matching high-quality WAV masters and exact source terms are listed in audio-library/SOURCES.json. No sample is marked human-auditioned or approved for a final mix by automation.
          EOF
          test "$(find dist/meta-open-sound-release -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          if ! gh release view "${META_AUDIO_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${META_AUDIO_RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Nolane Historical Audio Library v0.1.0 — Meta Open Sound" \
              --notes-file dist/meta-open-sound-release/RELEASE-NOTES.md
          fi
          gh release upload "${META_AUDIO_RELEASE_TAG}" dist/meta-open-sound-release/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${META_AUDIO_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url,assets

      - name: Upload offline playable audio bank
        uses: actions/upload-artifact@v7
        with:
          name: nolane-audio-preview-bank-${{ github.run_number }}
          path: build/audio-preview-bank/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload searchable catalog and report
        uses: actions/upload-artifact@v7
        with:
          name: nolane-cinematic-audio-catalog-${{ github.run_number }}
          path: |
            build/audio-catalog.json
            build/AUDIO-LIBRARY-REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish generated metadata index to the production branch
        if: github.ref == 'refs/heads/codex/samurai-cinematic-audio-v1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            mkdir -p audio-library/generated
            cp build/audio-catalog.json audio-library/generated/audio-catalog.json
            cp build/AUDIO-LIBRARY-REPORT.md audio-library/generated/AUDIO-LIBRARY-REPORT.md
            cp build/audio-preview-bank/preview-catalog.json audio-library/generated/preview-catalog.json
            cp build/audio-preview-bank/meta-open-sound/meta-preview-catalog.json audio-library/generated/meta-preview-catalog.json
            python -m json.tool audio-library/generated/audio-catalog.json > /dev/null
            python -m json.tool audio-library/generated/preview-catalog.json > /dev/null
            python -m json.tool audio-library/generated/meta-preview-catalog.json > /dev/null
            python -c 'import json; from pathlib import Path; base=json.loads(Path("audio-library/generated/preview-catalog.json").read_text()); meta=json.loads(Path("audio-library/generated/meta-preview-catalog.json").read_text()); inventory=json.loads(Path("audio-library/generated/audio-catalog.json").read_text()); count=int(base["summary"]["playable_audio_files"]); assert 0 < count <= int(inventory["audio_asset_count"]), (count, inventory["audio_asset_count"]); assert all(x.get("probe_status") == "ok" for x in base["assets"]); assert len(meta["assets"]) == 1583; assert meta["summary"]["files"] == 1583; assert meta["summary"]["cc0_files"] == 1075; assert meta["summary"]["cc_by_files"] == 508; assert meta["summary"]["human_auditioned"] == 0; assert meta["summary"]["approved_for_final_mix"] == 0; assert all(x.get("source_wav_file") and x.get("wav_master_download_url") and len(x.get("wav_master_sha256", "")) == 64 for x in meta["assets"]); print("Published indexes:", base["summary"], meta["summary"])'
            git add audio-library/generated/audio-catalog.json audio-library/generated/AUDIO-LIBRARY-REPORT.md audio-library/generated/preview-catalog.json audio-library/generated/meta-preview-catalog.json
            if git diff --cached --quiet; then
              echo "Audio catalog is already up to date."
              exit 0
            fi
            git commit -m "Publish generated cinematic audio catalog"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Remote branch moved during publication; rebasing the report onto the latest branch (attempt ${attempt})."
          done
          echo "Could not publish metadata after three attempts; downloadable artifacts remain available."
          exit 1
