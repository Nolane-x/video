# Constantinople 3D proof workflow. Exact 240fps output is frame-count gated.
name: Constantinople · hybrid cinematic 3D · 240fps master

on:
  push:
    branches:
      - 'cinematic/constantinople-hybrid-240fps'
    paths:
      - 'tools/blender/render_constantinople_bombardment.py'
      - '.github/workflows/constantinople-hybrid-240fps.yml'
  workflow_dispatch:
    inputs:
      reuse_keyframe_run_id:
        description: "Optional completed run ID containing exact four-shard 30fps keyframes; leave blank to render Blender again."
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  # Keep each source revision isolated; superseding commits must not queue behind stale FFmpeg work.
  group: constantinople-hybrid-240fps-\${{ github.ref }}-\${{ github.sha }}
  cancel-in-progress: false

env:
  VOICE_RUN_ID: "42448341267"
  VOICE_START: "220.760"
  CLIP_DURATION: "39.140"
  KEYFRAME_FPS: "30"
  KEYFRAME_STRIDE: "8"
  EXPECTED_KEYFRAMES: "1176"
  REUSE_KEYFRAME_RUN_ID: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-keyframes-43654882377]') && '43654882377' || (github.event_name == 'workflow_dispatch' && inputs.reuse_keyframe_run_id || '') }}

jobs:
  preflight:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-keyframes-43654882377]')) && !(github.event_name == 'workflow_dispatch' && inputs.reuse_keyframe_run_id != '') }}
    name: Validate workflow, narration and Blender scene
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Lint hybrid workflow before spending render time
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color .github/workflows/constantinople-hybrid-240fps.yml

      - name: Install Blender and FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libxkbcommon0 libsm6
          blender --version | head -n 2
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -filters | grep -w minterpolate

      - name: Download and verify source narration provenance
        uses: actions/download-artifact@v4
        with:
          name: video-voice-assets-42448341267
          path: voice-assets
          run-id: 42448341267
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify narration SHA, format, watermark and exact excerpt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("voice-assets")
          m=json.loads((p/"manifest.json").read_text(encoding="utf-8"))
          a=m["audio"]
          digest=hashlib.sha256((p/"narration.wav").read_bytes()).hexdigest()
          assert digest==a["sha256"], "VoiceStudio SHA-256 mismatch"
          assert a["sample_rate"]==48000 and a["channels"]==1 and a["subtype"]=="PCM_24"
          assert a["watermark"]["status"]=="verified" and a["checks"]=="passed"
          print("Verified VoiceStudio narration:",m["voice_id"],a["duration_seconds"],digest)
          PY
          ffmpeg -hide_banner -v error -y -ss "$VOICE_START" -i voice-assets/narration.wav \
            -t "$CLIP_DURATION" -ar 48000 -ac 2 -c:a pcm_s24le out-voice.wav

      - name: Compile scene and smoke-test a full-resolution 3D frame
        shell: bash
        env:
          BLENDER_EEVEE_SAMPLES: "4"
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/render_constantinople_bombardment.py
          mkdir -p out
          BLENDER_SMOKE_ONLY=1 SMOKE_OUTPUT="$PWD/out/constantinople-smoke.png" \
            blender -b --python tools/blender/render_constantinople_bombardment.py 2>&1 | tee out/blender-smoke.log
          test -s out/constantinople-smoke.png
          grep "STATIC MESH JOIN" out/blender-smoke.log
          grep "CONSTANTINOPLE ONE-FRAME SMOKE FINISHED" out/blender-smoke.log

      - name: Preserve Blender preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-blender-preflight-${{ github.run_id }}
          path: |
            out/constantinople-smoke.png
            out/blender-smoke.log
          if-no-files-found: error
          retention-days: 2

  render-keyframe-shards:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-keyframes-43654882377]')) && !(github.event_name == 'workflow_dispatch' && inputs.reuse_keyframe_run_id != '') }}
    name: Render 30fps Blender keyframes shard ${{ matrix.shard }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: "0"
            start_index: "1"
            end_index: "294"
          - shard: "1"
            start_index: "295"
            end_index: "588"
          - shard: "2"
            start_index: "589"
            end_index: "882"
          - shard: "3"
            start_index: "883"
            end_index: "1176"
    steps:
      - uses: actions/checkout@v7

      - name: Install Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxkbcommon0 libsm6
          blender --version | head -n 2

      - name: Render this exact global keyframe index range
        shell: bash
        env:
          BLENDER_KEYFRAME_EXPORT: "1"
          BLENDER_KEYFRAME_STRIDE: "8"
          BLENDER_KEYFRAME_START_INDEX: ${{ matrix.start_index }}
          BLENDER_KEYFRAME_END_INDEX: ${{ matrix.end_index }}
          BLENDER_EEVEE_SAMPLES: "4"
          BLENDER_RESOLUTION_PERCENTAGE: "80"
          BLENDER_KEYFRAME_DIR: "${{ github.workspace }}/out/keyframes"
          SHARD_START_INDEX: ${{ matrix.start_index }}
          SHARD_END_INDEX: ${{ matrix.end_index }}
        run: |
          set -euo pipefail
          mkdir -p out/keyframes
          blender -b --python tools/blender/render_constantinople_bombardment.py 2>&1 \
            | tee "out/blender-keyframes-${{ matrix.shard }}.log"
          python - <<'PY'
          import os
          from pathlib import Path
          start=int(os.environ["SHARD_START_INDEX"])
          end=int(os.environ["SHARD_END_INDEX"])
          root=Path("out/keyframes")
          expected=[f"frame_{i:05d}.jpg" for i in range(start,end+1)]
          actual=sorted(p.name for p in root.glob("frame_*.jpg"))
          assert actual==expected,(start,end,len(actual),actual[:3],actual[-3:])
          print("SHARD KEYFRAME PASS:",start,"to",end,"count",len(actual))
          PY
          grep "CONSTANTINOPLE KEYFRAME EXPORT FINISHED" \
            "out/blender-keyframes-${{ matrix.shard }}.log"

      - name: Upload this shard's globally numbered keyframes
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-keyframes-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            out/keyframes/frame_*.jpg
            out/blender-keyframes-${{ matrix.shard }}.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  assemble-hybrid-proof:
    if: ${{ always() && (needs.preflight.result == 'success' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-keyframes-43654882377]')) || (github.event_name == 'workflow_dispatch' && inputs.reuse_keyframe_run_id != '')) && (needs.render-keyframe-shards.result == 'success' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reuse-keyframes-43654882377]')) || (github.event_name == 'workflow_dispatch' && inputs.reuse_keyframe_run_id != '')) }}
    name: Assemble 240fps proof, mix audio and run strict media QA
    needs:
      - preflight
      - render-keyframe-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -filters | grep -w minterpolate

      - name: Download Blender one-frame preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: constantinople-blender-preflight-${{ env.REUSE_KEYFRAME_RUN_ID != '' && env.REUSE_KEYFRAME_RUN_ID || github.run_id }}
          path: out/preflight
          repository: Nolane-x/video
          run-id: ${{ env.REUSE_KEYFRAME_RUN_ID != '' && env.REUSE_KEYFRAME_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all four keyframe shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: constantinople-keyframes-*-${{ env.REUSE_KEYFRAME_RUN_ID != '' && env.REUSE_KEYFRAME_RUN_ID || github.run_id }}
          path: out/keyframe-shards
          merge-multiple: true
          repository: Nolane-x/video
          run-id: ${{ env.REUSE_KEYFRAME_RUN_ID != '' && env.REUSE_KEYFRAME_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reassemble and validate the exact global keyframe sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/keyframes out/review media
          test -s out/preflight/blender-smoke.log
          cp out/preflight/blender-smoke.log out/blender-smoke.log
          test -d out/keyframe-shards/keyframes
          mv out/keyframe-shards/keyframes/frame_*.jpg out/keyframes/
          cat out/keyframe-shards/blender-keyframes-*.log > out/blender-keyframes.log
          python - <<'PY'
          from pathlib import Path
          root=Path("out/keyframes")
          expected=[f"frame_{i:05d}.jpg" for i in range(1,1177)]
          actual=sorted(p.name for p in root.glob("frame_*.jpg"))
          assert actual==expected,("keyframe sequence is incomplete or duplicated",len(actual),actual[:5],actual[-5:])
          print("GLOBAL KEYFRAME SEQUENCE PASS:",len(actual),"frames, indices 1..1176")
          PY
          ffmpeg -hide_banner -v error -y -framerate "$KEYFRAME_FPS" \
            -start_number 1 -i "out/keyframes/frame_%05d.jpg" \
            -frames:v 1176 -f null -
          sha256sum out/keyframes/frame_*.jpg > out/keyframe-sha256.txt

      - name: Download and verify VoiceStudio narration
        uses: actions/download-artifact@v4
        with:
          name: video-voice-assets-42448341267
          path: voice-assets
          run-id: 42448341267
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the exact narration passage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("voice-assets")
          m=json.loads((p/"manifest.json").read_text(encoding="utf-8"))
          a=m["audio"]
          digest=hashlib.sha256((p/"narration.wav").read_bytes()).hexdigest()
          assert digest==a["sha256"],"VoiceStudio SHA-256 mismatch"
          assert a["sample_rate"]==48000 and a["channels"]==1 and a["subtype"]=="PCM_24"
          assert a["watermark"]["status"]=="verified" and a["checks"]=="passed"
          print("Verified VoiceStudio narration:",m["voice_id"],a["duration_seconds"],digest)
          PY
          ffmpeg -hide_banner -v error -y -ss "$VOICE_START" -i voice-assets/narration.wav \
            -t "$CLIP_DURATION" -ar 48000 -ac 2 -c:a pcm_s24le out-voice.wav

      - name: Acquire recorded CC0 score and cannon effects
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/Eye%20of%20the%20Storm.wav" -o media/score.wav
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/cannon_fire_1.ogg" -o media/cannon_fire.ogg
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/cannon_hit_wall_no_splash.ogg" -o media/cannon_impact.ogg
          for f in media/*; do ffmpeg -hide_banner -v error -i "$f" -f null -; done
          sha256sum media/* | tee media/SHA256SUMS.txt

      - name: Interpolate four frame-exact CFR 240fps picture shards in parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/interpolation
          python - <<'PY'
          from pathlib import Path

          source = Path("out/keyframes")
          specs = (
              (0, 1, 296),
              (1, 295, 590),
              (2, 589, 884),
              (3, 883, 1176),
          )
          for index, first, last in specs:
              target = Path("out/interpolation") / f"chunk-{index}"
              target.mkdir(parents=True, exist_ok=True)
              for local_index, global_index in enumerate(range(first, last + 1), start=1):
                  original = source / f"frame_{global_index:05d}.jpg"
                  if not original.is_file():
                      raise FileNotFoundError(original)
                  (target / f"frame_{local_index:05d}.jpg").symlink_to(original.resolve())
              print(f"Prepared interpolation shard {index}: global keyframes {first}..{last}")
          PY

          render_shard() {
            local index="$1"
            local expected="$2"
            local trim_filter="$3"
            local input="out/interpolation/chunk-\${index}/frame_%05d.jpg"
            local output="out/interpolation/part-\${index}.mp4"
            ffmpeg -hide_banner -v error -y \
              -filter_threads 1 -threads 1 \
              -framerate "$KEYFRAME_FPS" -start_number 1 -i "$input" \
              -vf "minterpolate=fps=240:mi_mode=mci:mc_mode=obmc:me_mode=bilat:me=hexbs:search_param=16:vsbmc=0,scale=1920:1080:flags=lanczos,\${trim_filter}" \
              -frames:v "$expected" -an -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p \
              -r 240 -fps_mode cfr -video_track_timescale 240000 "$output"
            test -s "$output"
          }

          pids=()
          render_shard 0 2353 "trim=end_frame=2353,setpts=PTS-STARTPTS" &
          pids+=("$!")
          render_shard 1 2352 "trim=start_frame=1:end_frame=2353,setpts=PTS-STARTPTS" &
          pids+=("$!")
          render_shard 2 2352 "trim=start_frame=1:end_frame=2353,setpts=PTS-STARTPTS" &
          pids+=("$!")
          render_shard 3 2337 "trim=start_frame=1:end_frame=2337,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop=1,trim=end_frame=2337" &
          pids+=("$!")

          failed=0
          for pid in "\${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "At least one 240fps interpolation shard failed."
            exit 1
          fi

          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          expected = (2353, 2352, 2352, 2337)
          for index, count in enumerate(expected):
              path = Path("out/interpolation") / f"part-{index}.mp4"
              meta = json.loads(subprocess.run([
                  "ffprobe", "-v", "error", "-count_frames", "-select_streams", "v:0",
                  "-show_streams", "-of", "json", str(path)
              ], check=True, capture_output=True, text=True).stdout)
              stream = meta["streams"][0]
              actual = int(stream.get("nb_read_frames") or stream.get("nb_frames") or 0)
              assert actual == count, (index, actual, count, stream)
              assert stream["r_frame_rate"] == "240/1", (index, stream)
              assert stream["avg_frame_rate"] == "240/1", (index, stream)
              assert (int(stream["width"]), int(stream["height"])) == (1920, 1080), (index, stream)
              assert stream["pix_fmt"] == "yuv420p", (index, stream)
              print(f"Interpolation shard {index}: PASS — {actual} CFR 240fps frames")
          PY

          {
            for index in 0 1 2 3; do
              printf "file '%s/out/interpolation/part-%s.mp4'\n" "$PWD" "$index"
            done
          } > "$RUNNER_TEMP/hybrid-parts.txt"

          ffmpeg -hide_banner -v error -y -f concat -safe 0 \
            -i "$RUNNER_TEMP/hybrid-parts.txt" -c copy -movflags +faststart \
            out/picture-only-240fps.mp4

          ffprobe -v error -count_frames -select_streams v:0 -show_streams -show_format \
            -of json out/picture-only-240fps.mp4 > out/picture-only-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          probe = json.loads(Path("out/picture-only-probe.json").read_text(encoding="utf-8"))
          stream = probe["streams"][0]
          frames = int(stream.get("nb_read_frames") or stream.get("nb_frames") or 0)
          duration = float(probe["format"]["duration"])
          assert frames == 9394, (frames, stream)
          assert stream["r_frame_rate"] == "240/1" and stream["avg_frame_rate"] == "240/1", stream
          assert (int(stream["width"]), int(stream["height"])) == (1920, 1080), stream
          assert stream["pix_fmt"] == "yuv420p", stream
          assert abs(duration - 9394 / 240) <= 0.01, duration
          print("PARALLEL INTERPOLATION PASS:", frames, "frames; CFR 240fps;", duration, "seconds")
          PY
          test -s out/picture-only-240fps.mp4

      - name: Mix narration, score and frame-synchronized cannon effects
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -v error -y -i out-voice.wav -stream_loop -1 -i media/score.wav \
            -i media/cannon_fire.ogg -i media/cannon_impact.ogg \
            -filter_complex \
            "[1:a]atrim=0:39.140,asetpts=N/SR/TB,volume=0.14[score]; \
             [2:a]adelay=18750|18750,volume=0.75,highpass=f=90,lowpass=f=9000[fire]; \
             [3:a]adelay=26250|26250,volume=0.85,highpass=f=55,lowpass=f=6500[impact]; \
             [0:a]volume=1.0[voice]; \
             [voice][score][fire][impact]amix=inputs=4:duration=first:dropout_transition=0, \
             loudnorm=I=-16:TP=-1.5:LRA=11[out]" \
            -map "[out]" -t 39.140 -ar 48000 -ac 2 -c:a aac -b:a 256k out-audio.m4a
          ffmpeg -hide_banner -v error -y -i out/picture-only-240fps.mp4 -i out-audio.m4a \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy \
            -movflags +faststart constantinople-hybrid-240fps.mp4

      - name: Export subtitles and run strict media QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("voice-assets/captions.srt").read_text(encoding="utf-8-sig")
          offset=220.760
          def sec(v):
              h,m,s=v.split(":"); q,ms=s.split(",")
              return int(h)*3600+int(m)*60+int(q)+int(ms)/1000
          def stamp(v):
              v=max(0,v); h=int(v//3600); m=int(v%3600//60); s=int(v%60); ms=round((v-int(v))*1000)
              if ms==1000: s+=1; ms=0
              return f"{h:02}:{m:02}:{s:02},{ms:03}"
          out=[]; counter=0
          for block in src.strip().split("\n\n"):
              lines=block.splitlines()
              if len(lines)<3 or " --> " not in lines[1]: continue
              a,b=map(sec,lines[1].split(" --> "))
              if b<=offset or a>=offset+39.140: continue
              counter+=1
              out.extend([str(counter),f"{stamp(max(0,a-offset))} --> {stamp(min(offset+39.140,b)-offset)}",*lines[2:],""])
          assert counter>0,"No narration caption cues intersect the clip."
          Path("captions.srt").write_text("\n".join(out),encoding="utf-8")
          Path("RECONSTRUCTION-NOTES.txt").write_text(
            "Illustrative 3D reconstruction of a 15th-century Ottoman bombard and the Theodosian walls.\n"
            "Not a verified replica of Orban's exact cannon; not archival footage.\n"
            "Narration excerpt: 00:03:40.760–00:04:19.900. Captions are separate.\n"
            "Picture is 30fps rendered 3D keyframes motion-compensated to CFR 240fps.\n"
            "CC0 modern score and recorded cannon candidates require human audition.\n",encoding="utf-8")
          PY
          ffprobe -v error -count_frames -show_streams -show_format -of json \
            constantinople-hybrid-240fps.mp4 > out/metadata.json
          python - <<'PY'
          import json,subprocess
          p="constantinople-hybrid-240fps.mp4"
          j=json.load(open("out/metadata.json"))
          v=next(x for x in j["streams"] if x["codec_type"]=="video")
          a=next(x for x in j["streams"] if x["codec_type"]=="audio")
          assert (v["width"],v["height"])==(1920,1080),v
          assert v["r_frame_rate"]=="240/1" and v["avg_frame_rate"]=="240/1",v
          frames=int(v.get("nb_read_frames",0))
          assert frames==9394,(frames,v)
          assert a["sample_rate"]=="48000" and a["channels"]==2,a
          d=float(j["format"]["duration"]); assert abs(d-39.14)<=0.03,d
          subprocess.run(["ffmpeg","-hide_banner","-v","error","-i",p,"-f","null","-"],check=True)
          sample=subprocess.run([
            "ffmpeg","-hide_banner","-v","error","-i",p,
            "-vf","select='not(mod(n,4))',scale=96:54,format=gray",
            "-frames:v","180","-f","framemd5","-"
          ],check=True,capture_output=True,text=True)
          hashes=[x.split(",")[-1].strip() for x in sample.stdout.splitlines()
                  if x and not x.startswith("#")]
          unique=len(set(hashes))
          assert len(hashes)>=170 and unique>=150,(len(hashes),unique)
          print("TECHNICAL PASS:",v["width"],"x",v["height"],v["avg_frame_rate"],frames,
                "frames",d,"sec; unique 60fps samples",unique,"/",len(hashes))
          PY

      - name: Build contact sheet and provenance report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/review
          ffmpeg -hide_banner -v error -y -i constantinople-hybrid-240fps.mp4 \
            -vf "fps=1/2,scale=480:-1,tile=4x5" -frames:v 1 out/review/contact-sheet.jpg
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          meta=json.load(open("out/metadata.json"))
          v=next(x for x in meta["streams"] if x["codec_type"]=="video")
          a=next(x for x in meta["streams"] if x["codec_type"]=="audio")
          voice=json.loads(Path("voice-assets/manifest.json").read_text())
          report={
           "status":"RENDERED_HYBRID_240FPS_PROOF_PENDING_HUMAN_REVIEW",
           "project":"53 Days to the End of an Empire",
           "sequence":"The great bombard — crew preparation, loading, recoil, flight, wall impact and repair",
           "classification":"illustrative 3D historical reconstruction; not archival footage",
           "engine":"Blender Eevee + FFmpeg motion-compensated interpolation",
           "dimensions":[v["width"],v["height"]],"output_fps":v["r_frame_rate"],
           "average_fps":v["avg_frame_rate"],"decoded_frames":int(v["nb_read_frames"]),
           "source_3d_keyframe_fps":30,"interpolated_to_240fps":True,
