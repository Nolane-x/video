name: Constantinople · hybrid cinematic 3D · 240fps master

on:
  push:
    branches:
      - 'cinematic/constantinople-hybrid-240fps'
    paths:
      - 'tools/blender/render_constantinople_bombardment.py'
      - '.github/workflows/constantinople-hybrid-240fps.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: constantinople-hybrid-240fps
  cancel-in-progress: false

jobs:
  hybrid-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VOICE_RUN_ID: "42448341267"
      VOICE_START: "220.760"
      CLIP_DURATION: "39.140"
      KEYFRAME_FPS: "60"
      KEYFRAME_STRIDE: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Lint the hybrid workflow before starting Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color .github/workflows/constantinople-hybrid-240fps.yml

      - name: Install Blender and FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libxkbcommon0 libsm6
          blender --version | head -n 2
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -filters | grep -w minterpolate

      - name: Download verified VoiceStudio narration
        uses: actions/download-artifact@v4
        with:
          name: video-voice-assets-42448341267
          path: voice-assets
          run-id: 42448341267
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify narration provenance and prepare exact excerpt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("voice-assets")
          m=json.loads((p/"manifest.json").read_text(encoding="utf-8"))
          a=m["audio"]
          digest=hashlib.sha256((p/"narration.wav").read_bytes()).hexdigest()
          assert digest==a["sha256"], "VoiceStudio SHA-256 mismatch"
          assert a["sample_rate"]==48000 and a["channels"]==1 and a["subtype"]=="PCM_24"
          assert a["watermark"]["status"]=="verified" and a["checks"]=="passed"
          print("Verified VoiceStudio narration:",m["voice_id"],a["duration_seconds"],digest)
          PY
          ffmpeg -hide_banner -v error -y -ss "$VOICE_START" -i voice-assets/narration.wav \
            -t "$CLIP_DURATION" -ar 48000 -ac 2 -c:a pcm_s24le out-voice.wav

      - name: Acquire recorded CC0 score and cannon effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/Eye%20of%20the%20Storm.wav" -o media/score.wav
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/cannon_fire_1.ogg" -o media/cannon_fire.ogg
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://opengameart.org/sites/default/files/cannon_hit_wall_no_splash.ogg" -o media/cannon_impact.ogg
          for f in media/*; do ffmpeg -hide_banner -v error -i "$f" -f null -; done
          sha256sum media/* | tee media/SHA256SUMS.txt

      - name: Compile scene and smoke-test optimized 3D render
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/render_constantinople_bombardment.py
          mkdir -p out
          BLENDER_SMOKE_ONLY=1 SMOKE_OUTPUT="$PWD/out/constantinople-smoke.png" \
            blender -b --python tools/blender/render_constantinople_bombardment.py 2>&1 | tee out/blender-smoke.log
          test -s out/constantinople-smoke.png
          grep "STATIC MESH JOIN" out/blender-smoke.log

      - name: Render evaluated 3D keyframes at 30fps
        shell: bash
        env:
          BLENDER_KEYFRAME_EXPORT: "1"
          BLENDER_KEYFRAME_STRIDE: "4"
          BLENDER_KEYFRAME_DIR: "${{ github.workspace }}/out/keyframes"
        run: |
          set -euo pipefail
          mkdir -p out/keyframes
          blender -b --python tools/blender/render_constantinople_bombardment.py 2>&1 | tee out/blender-keyframes.log
          count=$(find out/keyframes -maxdepth 1 -type f -name 'frame_*.jpg' | wc -l)
          echo "Rendered 3D keyframes: $count"
          test "$count" -ge 2348
          grep "CONSTANTINOPLE KEYFRAME EXPORT FINISHED" out/blender-keyframes.log

      - name: Interpolate smooth 1080p CFR 240fps picture master
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -v error -y \
            -framerate "$KEYFRAME_FPS" -start_number 1 -i "out/keyframes/frame_%05d.jpg" \
            -vf "minterpolate=fps=240:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1,trim=duration=$CLIP_DURATION,setpts=PTS-STARTPTS" \
            -frames:v 9394 -an -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p \
            -r 240 -fps_mode cfr -movflags +faststart out/picture-only-240fps.mp4
          test -s out/picture-only-240fps.mp4

      - name: Mix narration, licensed score and synchronized cannon effects
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -v error -y -i out-voice.wav -stream_loop -1 -i media/score.wav \
            -i media/cannon_fire.ogg -i media/cannon_impact.ogg \
            -filter_complex \
            "[1:a]atrim=0:39.140,asetpts=N/SR/TB,volume=0.14[score]; \
             [2:a]adelay=19000|19000,volume=0.75,highpass=f=90,lowpass=f=9000[fire]; \
             [3:a]adelay=25300|25300,volume=0.85,highpass=f=55,lowpass=f=6500[impact]; \
             [0:a]volume=1.0[voice]; \
             [voice][score][fire][impact]amix=inputs=4:duration=first:dropout_transition=0, \
             loudnorm=I=-16:TP=-1.5:LRA=11[out]" \
            -map "[out]" -t 39.140 -ar 48000 -ac 2 -c:a aac -b:a 256k out-audio.m4a
          ffmpeg -hide_banner -v error -y -i out/picture-only-240fps.mp4 -i out-audio.m4a \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy -t 39.140 \
            -movflags +faststart constantinople-hybrid-240fps.mp4

      - name: Export subtitles and run strict media QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("voice-assets/captions.srt").read_text(encoding="utf-8-sig")
          offset=220.760
          def sec(v):
              h,m,s=v.split(":"); q,ms=s.split(",")
              return int(h)*3600+int(m)*60+int(q)+int(ms)/1000
          def stamp(v):
              v=max(0,v); h=int(v//3600); m=int(v%3600//60); s=int(v%60); ms=round((v-int(v))*1000)
              if ms==1000: s+=1; ms=0
              return f"{h:02}:{m:02}:{s:02},{ms:03}"
          out=[]; counter=0
          for block in src.strip().split("\n\n"):
              lines=block.splitlines()
              if len(lines)<3 or " --> " not in lines[1]: continue
              a,b=map(sec,lines[1].split(" --> "))
              if b<=offset or a>=offset+39.140: continue
              counter+=1
              out.extend([str(counter),f"{stamp(max(0,a-offset))} --> {stamp(min(offset+39.140,b)-offset)}",*lines[2:],""])
          Path("captions.srt").write_text("\n".join(out),encoding="utf-8")
          Path("RECONSTRUCTION-NOTES.txt").write_text(
            "Illustrative 3D reconstruction of a 15th-century Ottoman bombard and the Theodosian walls.\\n"
            "Not a verified replica of Orban's exact cannon; not archival footage.\\n"
            "Narration excerpt: 00:03:40.760–00:04:19.900. Captions are separate.\\n"
            "Picture is 60fps rendered 3D keyframes motion-compensated to CFR 240fps.\\n"
            "CC0 modern score and recorded cannon candidates require human audition.\\n",encoding="utf-8")
          PY
          ffprobe -v error -count_frames -show_streams -show_format -of json \
            constantinople-hybrid-240fps.mp4 > out/metadata.json
          python - <<'PY'
          import json,subprocess
          p="constantinople-hybrid-240fps.mp4"
          j=json.load(open("out/metadata.json"))
          v=next(x for x in j["streams"] if x["codec_type"]=="video")
          a=next(x for x in j["streams"] if x["codec_type"]=="audio")
          assert (v["width"],v["height"])==(1920,1080),v
          assert v["r_frame_rate"]=="240/1" and v["avg_frame_rate"]=="240/1",v
          frames=int(v.get("nb_read_frames",0))
          assert frames==9394,(frames,v)
          assert a["sample_rate"]=="48000" and a["channels"]==2,a
          d=float(j["format"]["duration"]); assert abs(d-39.14)<=0.03,d
          subprocess.run(["ffmpeg","-hide_banner","-v","error","-i",p,"-f","null","-"],check=True)
          sample=subprocess.run([
            "ffmpeg","-hide_banner","-v","error","-i",p,
            "-vf","select='not(mod(n,4))',scale=96:54,format=gray",
            "-frames:v","180","-f","framemd5","-"
          ],check=True,capture_output=True,text=True)
          hashes=[x.split(",")[-1].strip() for x in sample.stdout.splitlines()
                  if x and not x.startswith("#")]
          unique=len(set(hashes))
          assert len(hashes)>=170 and unique>=150,(len(hashes),unique)
          print("TECHNICAL PASS:",v["width"],"x",v["height"],v["avg_frame_rate"],frames,
                "frames",d,"sec; unique 60fps samples",unique,"/",len(hashes))
          PY

      - name: Build contact sheet and provenance report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/review
          ffmpeg -hide_banner -v error -y -i constantinople-hybrid-240fps.mp4 \
            -vf "fps=1/2,scale=480:-1,tile=4x5" -frames:v 1 out/review/contact-sheet.jpg
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          meta=json.load(open("out/metadata.json"))
          v=next(x for x in meta["streams"] if x["codec_type"]=="video")
          a=next(x for x in meta["streams"] if x["codec_type"]=="audio")
          voice=json.loads(Path("voice-assets/manifest.json").read_text())
          report={
           "status":"RENDERED_HYBRID_240FPS_PROOF_PENDING_HUMAN_REVIEW",
           "project":"53 Days to the End of an Empire",
           "sequence":"The great bombard — crew preparation, loading, recoil, flight, wall impact and repair",
           "classification":"illustrative 3D historical reconstruction; not archival footage",
           "engine":"Blender Eevee + FFmpeg motion-compensated interpolation",
           "dimensions":[v["width"],v["height"]],"output_fps":v["r_frame_rate"],
           "average_fps":v["avg_frame_rate"],"decoded_frames":int(v["nb_read_frames"]),
           "source_3d_keyframe_fps":60,"interpolated_to_240fps":True,
           "duration_seconds":float(meta["format"]["duration"]),
           "video_codec":v["codec_name"],"audio_codec":a["codec_name"],
           "audio_sample_rate":a["sample_rate"],"audio_channels":a["channels"],
           "narration":{"voice_id":voice["voice_id"],"source_sha256":voice["audio"]["sha256"],
             "source_time_start":220.760,"excerpt_duration":39.140},
           "audio_assets":[
             {"name":"Eye of the Storm","url":"https://opengameart.org/content/eye-of-the-storm-0","license":"CC0-1.0","sha256":sha("media/score.wav"),"human_auditioned":False},
             {"name":"Cannon fire 1","url":"https://opengameart.org/content/battle-at-sea","license":"CC0-1.0","sha256":sha("media/cannon_fire.ogg"),"human_auditioned":False},
             {"name":"Cannon impact","url":"https://opengameart.org/content/battle-at-sea","license":"CC0-1.0","sha256":sha("media/cannon_impact.ogg"),"human_auditioned":False}],
           "limitations":["Generic large-bombard design, not a verified replica of Orban's exact gun.",
             "Optical-flow frames may require visual review around fast debris and cuts.",
             "CC0 score and effects are modern candidate recordings; human audition remains required.",
             "This is a 39-second proof, not the complete film."],
           "sha256_video":sha(p)}
          Path("out/review/manifest.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
          cp constantinople-hybrid-240fps.mp4 captions.srt RECONSTRUCTION-NOTES.txt out/review/
          cp out/metadata.json out/blender-smoke.log out/blender-keyframes.log out/review/
          (cd out/review && sha256sum * > SHA256SUMS.txt)

      - name: Upload hybrid 240fps proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-hybrid-240fps-proof-${{ github.run_id }}
          path: out/review/
          if-no-files-found: error
          retention-days: 30
