name: Render Blender style study

on:
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
      - ".github/workflows/render-blender-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libxkbcommon0 libsm6
      - name: Render a 5-second H2 style study
        run: |
          mkdir -p out/blender
          BLENDER_OUTPUT="$PWD/out/blender/h2-style-study.mp4" blender -b --python tools/blender/render_h2_stage.py
      - name: Validate Blender output
        run: |
          test -s out/blender/h2-style-study.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type,width,height,r_frame_rate -of json out/blender/h2-style-study.mp4 | tee out/blender/metadata.json
      - name: Upload Blender preview
        uses: actions/upload-artifact@v7
        with:
          name: h2-blender-style-study
          path: |
            out/blender/h2-style-study.mp4
            out/blender/metadata.json
          if-no-files-found: error
          retention-days: 7
