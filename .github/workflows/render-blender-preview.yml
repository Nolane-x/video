name: Render Blender style study

on:
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Render a 5-second H2 style study
        run: |
          mkdir -p out/blender
          BLENDER_OUTPUT="$PWD/out/blender/h2-style-study.mp4" blender -b --python tools/blender/render_h2_stage.py
      - name: Upload Blender preview
        uses: actions/upload-artifact@v4
        with:
          name: h2-blender-style-study
          path: out/blender/h2-style-study.mp4
          if-no-files-found: error
          retention-days: 7
