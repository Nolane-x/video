name: Build cross-genre video asset library

on:
  push:
    branches: [main]
    paths:
      - ".github/ASSET_LIBRARY_BUILD_REQUEST"
  workflow_dispatch:

permissions:
  contents: write

# Serialize separate library builds, but fan out the independent source jobs inside one build.
concurrency:
  group: video-asset-library-distributed-v4
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create draft release for this distributed build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.create.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create a unique draft Release before the source jobs start
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="video-asset-library-build-${GITHUB_RUN_ID}"
          gh release create "${release_tag}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Nolane Video Asset Library build ${GITHUB_RUN_NUMBER} — collecting source shards" \
            --notes "This is a draft while independent source jobs download, rights-screen, checksum, split and upload their own volumes. It is published only after the global index and release assets pass verification."
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build-source-shards:
    name: Build source shard — ${{ matrix.lane }}
    permissions:
      contents: write
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        lane:
          - originals
          - kenney
          - kenney-splash
          - polyhaven
          - ambientcg
          - lazytextures
          - poly-pizza
          - met
          - smithsonian
          - rijksmuseum
          - nasa
          - nasa-svs
          - eso
          - loc
          - wikimedia
          - wikimedia-svg
          - wikimedia-av
          - usgs
          - noaa
          - opengameart
          - google-fonts
          - openmoji
          - internet-archive
          - openverse
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg for generated loops and ESO silent footage
        if: matrix.lane == 'originals' || matrix.lane == 'eso'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Compile the sharded downloader and shared source modules
        run: |
          python -m py_compile tools/video/build_asset_library.py
          python -m py_compile tools/video/build_asset_library_shard.py
          python -m py_compile tools/video/nasa_svs_importer.py
          python -m py_compile tools/video/eso_video_importer.py
          python -m py_compile tools/video/finalize_asset_library_release.py
          python -m py_compile tools/video/package_asset_bundles.py

      - name: Download, verify, split and upload this source shard
        env:
          GH_TOKEN: ${{ github.token }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          POLY_PIZZA_API_KEY: ${{ secrets.POLY_PIZZA_API_KEY }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          python tools/video/build_asset_library_shard.py \
            --lane "${SOURCE_LANE}" \
            --output-dir dist/video-assets \
            --release-tag "${RELEASE_TAG}"

  finalize-and-publish:
    name: Merge manifests, verify every upload and publish the library
    permissions:
      contents: write
    needs: [prepare-release, build-source-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download only the small shard manifests from the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/shard-manifests
          gh release download "${RELEASE_TAG}" \
            --pattern "asset-shard--*.json" \
            --dir dist/shard-manifests
          count=$(find dist/shard-manifests -maxdepth 1 -type f -name 'asset-shard--*.json' | wc -l)
          expected=$(python - <<'PY'
          import sys
          sys.path.insert(0, "tools/video")
          import build_asset_library_shard
          print(1 + len(build_asset_library_shard.SOURCE_LANES))
          PY
          )
          echo "Expected source manifests: ${expected}; downloaded: ${count}"
          test "${count}" -eq "${expected}"

      - name: Merge catalog and verify remote Release assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/video/finalize_asset_library_release.py \
            --manifest-dir dist/shard-manifests \
            --output-dir dist/final \
            --repository "${REPOSITORY}" \
            --release-tag "${RELEASE_TAG}"
