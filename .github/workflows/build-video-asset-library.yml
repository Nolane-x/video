name: Build cross-genre video asset library

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-video-asset-library.yml"
      - "tools/video/build_asset_library.py"
      - "tools/video/test_asset_library_sources.py"
      - "tools/video/generate_sfx_library.py"
      - "video-library/assets/sources.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: video-asset-library
  cancel-in-progress: true

jobs:
  build:
    name: Build, validate and publish CC0-safe assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg for original motion-loop rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Compile asset builder before any network downloads
        run: python -m py_compile tools/video/build_asset_library.py

      - name: Run offline source-rights and asset-family regression tests
        run: python tools/video/test_asset_library_sources.py

      - name: Build vector originals and download licensed resources
        run: python tools/video/build_asset_library.py dist/video-assets
        env:
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}

      - name: Validate index, checksums, archive and original asset counts
        run: |
          python - <<'PY'
          import json
          import hashlib
          import re
          import zipfile
          from pathlib import Path

          root = Path("dist/video-assets/video-asset-library")
          index_path = root / "ASSET_INDEX.json"
          sums_path = root / "SHA256SUMS.txt"
          archive = Path("dist/video-assets/video-asset-library.zip")
          summary_path = Path("dist/video-assets/VIDEO_ASSET_LIBRARY_BUILD.txt"

          )
          assert root.is_dir(), "Library folder missing"
          assert index_path.is_file() and sums_path.is_file(), "Index or checksum ledger missing"
          assert archive.is_file() and archive.stat().st_size > 1024, "ZIP is missing/too small"
          catalog_path = root / "ASSET_CATALOG.html"
          assert catalog_path.is_file(), "Offline searchable catalog missing"
          catalog_html = catalog_path.read_text(encoding="utf-8")
          assert "<video controls" in catalog_html, "Video previews are missing from the offline catalog"
          assert "<audio controls" in catalog_html, "Audio previews are missing from the offline catalog"
          assert summary_path.is_file(), "Build summary missing"

          index = json.loads(index_path.read_text(encoding="utf-8"))
          expected = index["summary"]
          assert expected["original_backgrounds"] >= 90
          assert expected["original_overlays"] >= 75
          assert expected["original_icons"] >= 125
          assert expected["original_textures"] >= 55, "Original surface texture library is incomplete"
          assert expected["original_illustrations"] >= 105, "Original editorial illustration library is incomplete"
          assert expected["original_infographics"] >= 50
          assert expected["original_sfx"] >= 175, "Procedural sound-effect bank is incomplete"
          assert expected["original_motion_loops"] == 24, "Original motion-loop library is incomplete"
          motion_items = [a for a in index["assets"] if a.get("type") == "original-procedural-video-loop"]
          assert len(motion_items) == expected["original_motion_loops"]
          for clip in motion_items:
              assert clip.get("license") == "CC0-1.0" and clip.get("redistributable") is True
              assert clip.get("width") == 1280 and clip.get("height") == 720
              assert 5.8 <= clip.get("duration_seconds", 0) <= 6.2
              assert len(clip.get("sha256", "")) == 64 and clip.get("size_bytes", 0) > 1024
          eligible_license_labels = {"cc0", "cc01.0", "creativecommonszero", "publicdomain", "publicdomainmark", "publicdomainus", "publicdomainunitedstates"}
          assert "wikimedia_svgs_downloaded" in expected, "Wikimedia SVG count is missing"
          svg_items = [a for a in index["assets"] if a.get("type") == "wikimedia-cc0-svg"]
          assert len(svg_items) == expected["wikimedia_svgs_downloaded"]
          for vector in svg_items:
              normalized = re.sub(r"[\s\-®()]+", "", str(vector.get("license") or "").lower())
              assert normalized in eligible_license_labels, f"Unexpected Wikimedia SVG license: {vector.get('license')}"
              assert vector.get("license_verified_from_item_metadata") is True
              assert vector.get("sanitized_svg") is True and vector.get("redistributable") is True
              assert vector.get("source_page", "").startswith("https://commons.wikimedia.org/")
              assert vector.get("source_file_url", "").startswith("https://upload.wikimedia.org/")
              assert len(vector.get("sha256", "")) == 64 and vector.get("size_bytes", 0) > 100
              svg_text = (root / vector["path"]).read_text(encoding="utf-8", errors="replace").lower()
              assert "<script" not in svg_text and "javascript:" not in svg_text
              assert not re.search(r"\son[a-z]+\s*=", svg_text), "SVG event handler survived sanitization"
              assert not re.search(r"\s(?:href|src)\s*=\s*['\"](?:https?:|//|data:)", svg_text), "External SVG resource survived sanitization"
          assert "wikimedia_videos_downloaded" in expected, "Wikimedia video count is missing"
          assert "wikimedia_audio_downloaded" in expected, "Wikimedia audio count is missing"
          wikimedia_video_items = [a for a in index["assets"] if a.get("type") == "wikimedia-cc0-video"]
          wikimedia_audio_items = [a for a in index["assets"] if a.get("type") == "wikimedia-cc0-audio"]
          assert len(wikimedia_video_items) == expected["wikimedia_videos_downloaded"]
          assert len(wikimedia_audio_items) == expected["wikimedia_audio_downloaded"]
          for media in wikimedia_video_items + wikimedia_audio_items:
              normalized = re.sub(r"[\s\-®()]+", "", str(media.get("license") or "").lower())
              assert normalized in eligible_license_labels, f"Unexpected Wikimedia media license: {media.get('license')}"
              assert media.get("license_verified_from_item_metadata") is True
              assert media.get("redistributable") is True
              assert media.get("source_page", "").startswith("https://commons.wikimedia.org/")
              assert media.get("source_file_url", "").startswith("https://upload.wikimedia.org/")
              assert len(media.get("sha256", "")) == 64
              assert media.get("size_bytes", 0) >= 2048

          assert "ambientcg_packages_downloaded" in expected, "ambientCG package count is missing"
          assert "ambientcg_files_downloaded" in expected, "ambientCG file count is missing"
          ambientcg_report = index.get("ambientcg_downloads")
          assert isinstance(ambientcg_report, list), "ambientCG source report is missing"
          ambientcg_downloaded = [row for row in ambientcg_report if row.get("status") == "downloaded"]
          ambientcg_assets = [asset for asset in index["assets"] if asset.get("type") == "ambientcg-asset-file"]
          assert len(ambientcg_downloaded) == expected["ambientcg_packages_downloaded"]
          assert len(ambientcg_assets) == expected["ambientcg_files_downloaded"]
          assert expected["ambientcg_packages_downloaded"] <= 30, "ambientCG search ceiling exceeded"
          for row in ambientcg_downloaded:
              assert row.get("source_page", "").startswith("https://ambientcg.com/a/")
              assert row.get("license") == "CC0-1.0"
              assert len(row.get("archive_sha256", "")) == 64
              assert row.get("extracted_files", 0) > 0 and row.get("unpacked_bytes", 0) > 0
          for asset in ambientcg_assets:
              assert asset.get("license") == "CC0-1.0" and asset.get("redistributable") is True
              assert asset.get("license_verified_from_provider_collection_terms") is True
              assert asset.get("source_page", "").startswith("https://ambientcg.com/a/")
              assert asset.get("source_file_url", "").startswith("https://ambientcg.com/get?file=")
              assert asset.get("path", "").startswith("third-party/ambientcg/")
              assert len(asset.get("sha256", "")) == 64 and asset.get("size_bytes", 0) > 0
              assert asset.get("download_archive_sha256", "") in {row.get("archive_sha256") for row in ambientcg_downloaded}

          assert "usgs_images_downloaded" in expected and "usgs_videos_downloaded" in expected and "usgs_audio_downloaded" in expected
          usgs_report = index.get("usgs_gallery_downloads")
          assert isinstance(usgs_report, list), "USGS Gallery source report is missing"
          usgs_downloaded = [row for row in usgs_report if row.get("status") == "downloaded"]
          usgs_assets = [asset for asset in index["assets"] if str(asset.get("type", "")).startswith("usgs-public-domain-")]
          assert len(usgs_downloaded) == expected["usgs_images_downloaded"] + expected["usgs_videos_downloaded"] + expected["usgs_audio_downloaded"]
          assert len(usgs_assets) == len(usgs_downloaded)
          assert expected["usgs_images_downloaded"] <= 24 and expected["usgs_videos_downloaded"] <= 8 and expected["usgs_audio_downloaded"] <= 8
          for asset in usgs_assets:
              media_type = asset.get("type", "").removeprefix("usgs-public-domain-")
              assert media_type in {"image", "video", "audio"}
              assert asset.get("rights_statement", "").strip().rstrip(".").casefold() == "public domain"
              assert asset.get("license_verified_from_item_page") is True and asset.get("redistributable") is True
              assert asset.get("license") == "Public Domain (item-level USGS Sources/Usage label)"
              listing_kind = "audio" if media_type == "audio" else media_type + "s"
              assert asset.get("source_page", "").startswith("https://www.usgs.gov/media/" + listing_kind + "/")
              assert len(asset.get("sha256", "")) == 64 and asset.get("size_bytes", 0) >= 2048
              direct = asset.get("source_file_url", "")
              if media_type == "video":
                  assert direct.startswith("https://usgs-ocapsv2-public-input-media.s3.us-west-2.amazonaws.com/") and "/media/video/" in direct
              else:
                  assert direct.startswith("https://d9-wret.s3.us-west-2.amazonaws.com/") and "/media/" + listing_kind + "/" in direct
          assert "opengameart_items_downloaded" in expected and "opengameart_files_downloaded" in expected
          opengameart_report = index.get("opengameart_downloads")
          assert isinstance(opengameart_report, list), "OpenGameArt report is missing"
          opengameart_downloaded = [row for row in opengameart_report if row.get("status") == "downloaded"]
          opengameart_assets = [asset for asset in index["assets"] if str(asset.get("type", "")).startswith("opengameart-cc0-")]
          assert len(opengameart_downloaded) == expected["opengameart_items_downloaded"]
          assert len(opengameart_assets) == expected["opengameart_files_downloaded"]
          assert expected["opengameart_items_downloaded"] <= sum([6, 6, 5, 5, 5]), "OpenGameArt search ceilings exceeded"
          caps = {"2d": 6, "3d": 6, "textures": 5, "sfx": 5, "music": 5}
          for category, cap in caps.items():
              assert sum(row.get("status") == "downloaded" and row.get("asset_category") == category for row in opengameart_report) <= cap
          for asset in opengameart_assets:
              assert asset.get("license") == "CC0-1.0" and asset.get("redistributable") is True
              assert asset.get("license_verified_from_item_page") is True
              assert asset.get("license_url") == "https://creativecommons.org/publicdomain/zero/1.0/"
              assert asset.get("source_page", "").startswith("https://opengameart.org/content/")
              assert asset.get("source_file_url", "").startswith("https://opengameart.org/sites/default/files/")
              assert asset.get("path", "").startswith("third-party/opengameart/")
              assert len(asset.get("sha256", "")) == 64 and asset.get("size_bytes", 0) > 0
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split("  ", 1)
              target = root / rel
              assert target.is_file(), f"Checksum target missing: {rel}"
              h = hashlib.sha256(target.read_bytes()).hexdigest()
              assert h == digest, f"Checksum mismatch: {rel}"

          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None, "Asset ZIP integrity test failed"
              names = zf.namelist()
              assert any(p.endswith("ASSET_INDEX.json") for p in names)
              assert any(p.endswith("ASSET_CATALOG.html") for p in names), "Offline catalog missing from archive"
              assert any(p.endswith("SOURCES_AND_LICENSES.md") for p in names)
              assert any(p.endswith("SHA256SUMS.txt") for p in names)

          print(json.dumps({
              "summary": expected,
              "archive_bytes": archive.stat().st_size,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "checksummed_entries": len(sums_path.read_text(encoding="utf-8").splitlines()),
          }, indent=2))
          PY

      - name: Publish versioned downloadable library
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-asset-library-build-${{ github.run_number }}
          name: Video Asset Library Build ${{ github.run_number }}
          fail_on_unmatched_files: true
          files: |
            dist/video-assets/video-asset-library.zip
            dist/video-assets/VIDEO_ASSET_LIBRARY_BUILD.txt
          body: |
            Automated cross-genre video resources for Nolane Video Studio.

            The package includes 93+ original CC0 vector backgrounds, 80+ overlays, 140+ icon SVGs, 112 editorial illustrations, 55 infographic templates, 58 tileable textures, 24 ffprobe-verified motion loops and 196 original procedural WAV cues; Poly Haven HDRIs/models/PBR textures; Met Open Access and verified Wikimedia CC0/Public Domain images; NASA-center media screened under NASA Media Usage Guidelines (not CC0); and Library of Congress images only when item-level rights statements explicitly support use. Rijksmuseum and Smithsonian artwork is included only when the exact item/media rights metadata permits it; Smithsonian media requires CC0 at both record and media level. Item-level source, usage notes and SHA-256 data are included.

            Some external providers can be unreachable or change their API; the build index records successful, failed and skipped downloads. "Free to use" sources with limits on raw-file redistribution are documented as source-only and are not mirrored into this archive.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload index and license report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: video-asset-library-reports-${{ github.run_number }}
          path: |
            dist/video-assets/VIDEO_ASSET_LIBRARY_BUILD.txt
            dist/video-assets/video-asset-library/ASSET_INDEX.json
            dist/video-assets/video-asset-library/SOURCES_AND_LICENSES.md
            dist/video-assets/video-asset-library/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
