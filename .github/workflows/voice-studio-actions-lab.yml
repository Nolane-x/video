name: Voice Studio Actions CPU lab

on:
  workflow_dispatch:
    inputs:
      quality_steps:
        description: "KorvaTTS inference steps (32 = highest released preset)"
        type: choice
        options: ["32"]
        default: "32"
        required: true
  push:
    branches:
      - feat/voice-studio-integration
    paths:
      - "integrations/voice-studio/actions_voice_lab.py"
      - "integrations/voice-studio/providers/korva.py"
      - "integrations/voice-studio/provider_voice_benchmark.py"
      - "integrations/voice-studio/voice_quality.py"
      - "integrations/voice-studio/examples/actions-benchmark-suite.json"
      - "integrations/voice-studio/tests/test_actions_voice_lab.py"
      - ".github/workflows/voice-studio-actions-lab.yml"
  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: read

concurrency:
  group: voice-studio-actions-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-voice-lab:
    name: Render 10 Vietnamese voices × 4 scripts (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout voice pipeline
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned KorvaTTS CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "korvatts==0.1.3"
          python - <<'PY'
          from importlib.metadata import version
          import onnxruntime
          import numpy
          assert version("korvatts") == "0.1.3"
          print("korvatts:", version("korvatts"))
          print("onnxruntime:", onnxruntime.__version__)
          print("numpy:", numpy.__version__)
          PY
      - name: Resolve immutable model snapshot revision
        id: model
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from huggingface_hub import model_info
          info = model_info("dogenthq/KorvaTTS")
          revision = str(info.sha or "")
          if not re.fullmatch(r"[0-9a-f]{40,64}", revision):
              raise SystemExit(f"Invalid Hugging Face model revision: {revision!r}")
          print(f"revision={revision}")
          print(f"Model snapshot pinned: {revision}", file=__import__("sys").stderr)
          PY
      - name: Restore exact model snapshot cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf-cache/hub
          key: ${{ runner.os }}-korvatts-0.1.3-${{ steps.model.outputs.revision }}
      - name: Install audio diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
      - name: Validate the suite without downloading raw recordings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          suite = json.loads(Path("integrations/voice-studio/examples/actions-benchmark-suite.json").read_text(encoding="utf-8"))
          assert suite["language"] == "vi"
          assert len(suite["cases"]) == 4
          assert len({item["id"] for item in suite["cases"]}) == 4
          print("Vietnamese scenarios:", ", ".join(item["id"] for item in suite["cases"]))
          print("Only ONNX graphs and voice_styles are requested; raw_voices and samples are excluded.")
          PY
      - name: Render all presets and run audio QA
        run: |
          python integrations/voice-studio/actions_voice_lab.py \
            --suite integrations/voice-studio/examples/actions-benchmark-suite.json \
            --output out/actions-voice-lab \
            --model-revision "${{ steps.model.outputs.revision }}" \
            --steps "${{ inputs.quality_steps || '32' }}" \
            --threads 4
      - name: Add QA summary to the Actions run
        if: always()
        run: |
          if [ -f out/actions-voice-lab/SUMMARY.md ]; then
            cat out/actions-voice-lab/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No complete voice-lab summary was produced. Inspect the failed step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload WAV files, blind listening pages and QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nolane-voice-actions-lab-${{ github.run_number }}
          path: |
            out/actions-voice-lab/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
