name: Inspect the existing asset library for Constantinople 3D props

on:
  push:
    branches:
      - 'cinematic/constantinople-hybrid-240fps'
    paths:
      - '.github/workflows/inspect-constantinople-3d-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the verified Build 76 index and relevant source shards through the release API
        shell: bash
        run: |
          set -euo pipefail
          download_asset() {
            local asset_id="$1"
            local output="$2"
            curl --fail --location --http1.1 \
              --connect-timeout 35 --max-time 480 \
              --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Nolane-x/video/releases/assets/$asset_id" \
              -o "$output"
            test -s "$output"
          }
          mkdir -p /tmp/asset-index
          download_asset 694948370 /tmp/asset-index/ASSET_INDEX.json
          download_asset 694948367 /tmp/asset-index/ASSET_BUNDLES.json
          download_asset 694852001 /tmp/asset-index/polyhaven.json
          download_asset 694860990 /tmp/asset-index/ambientcg.json
          download_asset 694880591 /tmp/asset-index/opengameart.json
          download_asset 694850831 /tmp/asset-index/kenney.json
          ls -lh /tmp/asset-index

      - name: Search model metadata for siege-era props and environments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re
          from pathlib import Path

          root=Path("/tmp/asset-index")
          terms=re.compile(r"cannon|bombard|siege|medieval|castle|fortress|fortification|wall|tower|ship|boat|galley|sail|soldier|warrior|armor|armour|weapon|sword|spear|shield|arrow|catapult|trebuchet|crossbow|helmet|horse|ox|wagon|cart|tent|torch|barrel|wooden|stone|brick|ruin|church|byzant|ottoman|roman|ancient",re.I)
          exts=(".blend",".glb",".gltf",".fbx",".obj",".abc",".usd",".usdz")
          candidates=[]
          files=list(root.glob("*.json"))
          for f in files:
              try: data=json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  print("Skipping unreadable JSON",f,e); continue
              def walk(node,trail="$"):
                  if isinstance(node,dict):
                      strings=[(str(k),v) for k,v in node.items() if isinstance(v,(str,int,float))]
                      blob=" ".join(f"{k}={v}" for k,v in strings)
                      has_model=any(str(v).lower().split("?")[0].endswith(exts) for _,v in strings)
                      matched=bool(terms.search(blob))
                      if has_model and matched:
                          candidates.append({"source_shard":f.name,"json_path":trail,"record":node})
                      for k,v in node.items(): walk(v,trail+"."+str(k))
                  elif isinstance(node,list):
                      for i,v in enumerate(node): walk(v,trail+f"[{i}]")
              walk(data)
          report={
            "source_release":"video-asset-library-build-41184526545",
            "files_scanned":[{"name":p.name,"bytes":p.stat().st_size} for p in files],
            "candidate_model_records":len(candidates),
            "candidates":candidates[:500],
            "selection_note":"Discovery only. Before importing any file, verify exact item source, license, archive path, dependency set and SHA-256. Keyword matching is not period-authenticity approval."
          }
          Path("out/constantinople-3d-asset-candidates.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Model candidates:",len(candidates))
          for row in candidates[:160]:
              print(json.dumps(row["record"],ensure_ascii=False)[:1800])
          PY

      - name: Upload filtered asset discovery report
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-3d-asset-candidates-${{ github.run_id }}
          path: out/constantinople-3d-asset-candidates.json
          if-no-files-found: error
          retention-days: 30
