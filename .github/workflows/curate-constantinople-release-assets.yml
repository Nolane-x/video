name: Constantinople - targeted release asset scout

on:
  push:
    branches:
      - cinematic/constantinople-assets
    paths:
      - 'tools/video/curate_constantinople_release_assets.py'
      - '.github/workflows/curate-constantinople-release-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constantinople-asset-scout
  cancel-in-progress: false

jobs:
  scout:
    name: Search Build 76 catalog without extracting all 66 volumes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download only the authoritative Build 76 metadata index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p constantinople-asset-scout
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            'https://github.com/Nolane-x/video/releases/download/video-asset-library-build-41184526545/ASSET_INDEX.json' \
            -o "$RUNNER_TEMP/ASSET_INDEX.json"
          test "$(stat -c %s "$RUNNER_TEMP/ASSET_INDEX.json")" -gt 70000000
          sha256sum "$RUNNER_TEMP/ASSET_INDEX.json" | tee constantinople-asset-scout/index.sha256
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20             'https://github.com/Nolane-x/video/releases/download/video-asset-library-build-41184526545/CUMULATIVE_ASSET_DOWNLOADS.json'             -o "$RUNNER_TEMP/CUMULATIVE_ASSET_DOWNLOADS.json"
          test "$(stat -c %s "$RUNNER_TEMP/CUMULATIVE_ASSET_DOWNLOADS.json")" -gt 70000000
          sha256sum "$RUNNER_TEMP/CUMULATIVE_ASSET_DOWNLOADS.json" | tee constantinople-asset-scout/download-map.sha256
      - name: Filter Byzantine, Ottoman, siege and museum-object candidates
        run: |
          python tools/video/curate_constantinople_release_assets.py \
            --index "$RUNNER_TEMP/ASSET_INDEX.json" \
            --output constantinople-asset-scout/ASSET-SHORTLIST.md \
            --max-candidates 400
      - name: Resolve exact resource paths to release ZIP volume metadata
        run: |
          python tools/video/lookup_constantinople_asset_volumes.py             --map "$RUNNER_TEMP/CUMULATIVE_ASSET_DOWNLOADS.json"             --output constantinople-asset-scout/VOLUME-LOOKUP.json
      - name: Verify and inspect the Poly Haven 3D-texture volume
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/Nolane-x/video/releases/download/video-asset-library-build-41184526545/video-assets-polyhaven-3d-textures-001.zip'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$URL" -o "$RUNNER_TEMP/polyhaven-textures.zip"
          test "$(stat -c %s "$RUNNER_TEMP/polyhaven-textures.zip")" -eq 347196184
          echo 'd62df29fb0d64267dea746b6dfa8fb6d2ae14eff60d2db1c7dcff74d6d444b14  '"$RUNNER_TEMP/polyhaven-textures.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile, json
          from pathlib import Path
          zpath=Path(__import__("os").environ["RUNNER_TEMP"])/"polyhaven-textures.zip"
          roots={}
          interesting=("stone","brick","masonry","limestone","granite","wall","plaster","concrete","rock","castle")
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              for name in names:
                  parts=name.split("/")
                  if len(parts)>=5 and parts[1]=="polyhaven" and parts[2]=="textures":
                      group=parts[3]
                      row=roots.setdefault(group,{"files":[],"bytes":0})
                      row["files"].append(name)
                      info=z.getinfo(name)
                      row["bytes"]+=info.file_size
          selected=[]
          for group,row in sorted(roots.items()):
              low=group.casefold()
              if any(term in low for term in interesting):
                  selected.append({"texture_set":group,"files":len(row["files"]),"uncompressed_bytes":row["bytes"],"sample_paths":row["files"][:20]})
          out=Path("constantinople-asset-scout")/"POLYHAVEN-MATERIAL-CANDIDATES.json"
          out.write_text(json.dumps({"archive":"video-assets-polyhaven-3d-textures-001.zip","archive_bytes":zpath.stat().st_size,"entry_count":len(names),"texture_set_count":len(roots),"selected":selected},indent=2)+"\\n",encoding="utf-8")
          md=Path("constantinople-asset-scout")/"POLYHAVEN-MATERIAL-CANDIDATES.md"
          lines=["# Poly Haven material groups","",f"Archive entries: {len(names)}",f"Texture sets: {len(roots)}",""]
          for x in selected:
              lines.append(f"## {x['texture_set']}")
              lines.append(f"- Files: {x['files']}; uncompressed bytes: {x['uncompressed_bytes']:,}")
              for p in x["sample_paths"]: lines.append(f"- {p}")
              lines.append("")
          md.write_text("\\n".join(lines)+"\\n",encoding="utf-8")
          print("POLYHAVEN_TEXTURE_SETS",len(roots),"MATCHES",len(selected))
          for x in selected: print(x["texture_set"],x["files"],x["uncompressed_bytes"])
          PY
      - name: Record acquisition boundary and checksum the report
        shell: bash
        run: |
          set -euo pipefail
          cat > constantinople-asset-scout/README.md <<'EOF'
          This report is a metadata-only scout over the existing Build 76 Release index.
          It does not fetch or extract any of the 66 large ZIP volumes. No candidate
          is automatically approved; exact source, item-level rights, SHA-256 and
          visual relevance must be reviewed before the asset is selected for the film.
          EOF
          (cd constantinople-asset-scout && sha256sum * > SHA256SUMS.txt)
      - name: Upload the candidate shortlist and provenance
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-build76-asset-scout
          path: constantinople-asset-scout/
          if-no-files-found: error
          retention-days: 30
