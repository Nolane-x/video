name: Build historical audio library

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-audio-library-build
  cancel-in-progress: false

jobs:
  catalog-and-package:
    name: Download, verify and index recorded audio
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Download pinned Build 76 audio volumes and source manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: video-asset-library-build-41184526545
        run: |
          set -euo pipefail
          mkdir -p dist/downloads dist/manifests dist/historical-audio-library
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "video-assets-opengameart-audio-001.zip" --dir dist/downloads
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "video-assets-usgs-audio-001.zip" --dir dist/downloads
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "video-assets-nasa-audio-001.zip" --dir dist/downloads
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "video-assets-wikimedia-audio-001.zip" --dir dist/downloads
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "video-assets-kenney-audio-001.zip" --dir dist/downloads
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "asset-shard--opengameart.json" --dir dist/manifests
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "asset-shard--usgs.json" --dir dist/manifests
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "asset-shard--nasa.json" --dir dist/manifests
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "asset-shard--wikimedia.json" --dir dist/manifests
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "asset-shard--kenney.json" --dir dist/manifests

          cat > dist/release.sha256 <<'EOF'
          b43bbac5ae7dc505dfd512ea714505c3ac5f210ec83a6f6aa09a94595fc031db  dist/downloads/video-assets-opengameart-audio-001.zip
          1f70a2ac8fcb6af2f242cb46db29829a8d70756bd1f0cb016da8332e3403ce87  dist/downloads/video-assets-usgs-audio-001.zip
          0a44be52ef4728c8b22f3516c6e616f276e263f9caa713e5f9ef618340d791a6  dist/downloads/video-assets-nasa-audio-001.zip
          49e66b9855cd5184b902164d93180a32af52d01349dcd09dd57b0b8312a7fe00  dist/downloads/video-assets-wikimedia-audio-001.zip
          c83444e0628af5af4452045f5346785275330196bf415cd37e9d4ed05edd23e2  dist/downloads/video-assets-kenney-audio-001.zip
          2e963c60914519db098d907de01617105b8e093681e5c914cf53044c4de0d441  dist/manifests/asset-shard--opengameart.json
          ed52f4a7ee13cdecd374771ff93c862306dcda902d2b2c9b09b4730aa9f5a4f4  dist/manifests/asset-shard--usgs.json
          4ebfc929f5e0ff00d2b59f9f57ed0788b05e028f2116b69a6b9f1c24eb12cfc8  dist/manifests/asset-shard--nasa.json
          920c407297af3ac99c015c5dc036cac4b905a0e352267056cdd56a209b36f9ce  dist/manifests/asset-shard--wikimedia.json
          6facad4131e09feaa63b0f299fd042218b0985da34666b7c87d0cafad88dcb09  dist/manifests/asset-shard--kenney.json
          EOF
          sha256sum --check dist/release.sha256

      - name: Build searchable offline catalog and preview-ready media tree
        run: |
          set -euo pipefail
          python -m py_compile tools/audio/build_historical_audio_catalog.py
          python tests/audio/test_historical_audio_catalog.py
          python tools/audio/build_historical_audio_catalog.py \
            --archive-dir dist/downloads \
            --manifest-dir dist/manifests \
            --output-dir dist/historical-audio-library
          test -s dist/historical-audio-library/audio-catalog.json
          test -s dist/historical-audio-library/ASSET_CATALOG.html
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("dist/historical-audio-library/audio-catalog.json").read_text())
          assert report["summary"]["catalogued_audio_files"] > 0, report["summary"]
          assert report["summary"]["human_auditioned"] == 0
          assert all(item["audition_status"] == "not_auditioned" for item in report["assets"])
          print(json.dumps(report["summary"], indent=2))
          PY

      - name: Upload searchable offline audio library
        uses: actions/upload-artifact@v4
        with:
          name: historical-audio-library-${{ github.run_id }}
          path: dist/historical-audio-library/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
