name: Package Nolane Video Command Center plugin overlay

on:
  workflow_dispatch:
  push:
    branches:
      - codex/samurai-cinematic-audio-v1
    paths:
      - "integrations/nolane-video-command-center-overlay/**"
      - ".github/workflows/package-nolane-video-plugin-overlay.yml"

permissions:
  contents: read

concurrency:
  group: nolane-video-plugin-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate plugin manifest and overlay structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("integrations/nolane-video-command-center-overlay")
          manifest = json.loads((root / "plugin.json").read_text())
          assert manifest["name"] == "nolane-video-command-center"
          assert manifest["version"] == "1.0.3"
          required = [
              "README.md",
              "SKILL-CATALOG.md",
              "skills/video-command-center/SKILL.md",
              "skills/historical-cinematic-documentary-director/SKILL.md",
              "skills/historical-military-animation-director/SKILL.md",
              "skills/audio-postproduction-engineer/SKILL.md",
              "skills/scene-detection-researcher/SKILL.md",
              "skills/video-cinematic-director/SKILL.md",
              "skills/illustrated-history-animation-director/SKILL.md",
              "skills/historical-audio-library-curator/SKILL.md",
              "skills/audio-postproduction-engineer/SKILL.md",
              "references/ILLUSTRATED_HISTORY_MOTION_SYSTEM.md",
              "references/HISTORICAL_FOLEY_COVERAGE_AUDIT.md",
              "references/CANNAE_45S_AUDIO_CUE_PLAN.json",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          assert not missing, missing
          catalog = (root / "SKILL-CATALOG.md").read_text()
          assert "33 internal skills" in catalog
          assert "illustrated-history-animation-director" in catalog
          assert "historical-audio-library-curator" in catalog
          assert "1.0.3" in catalog
          assert "search_audio_resources.py" in (root / "skills/historical-audio-library-curator/SKILL.md").read_text()
          curator = (root / "skills/historical-audio-library-curator/SKILL.md").read_text()
          assert "source_wav_file" in curator
          assert "acquire-meta-open-sound-wav-master.yml" in curator
          assert "never upload Sonniss raw archives" in curator
          assert "--direct-only" in curator
          audio = (root / "skills/audio-postproduction-engineer/SKILL.md").read_text()
          assert "meta-preview-catalog.json" in audio
          assert "validate_foley_review_decisions.py" in audio
          assert "oga_eye_of_the_storm" in (root / "references/CANNAE_45S_AUDIO_CUE_PLAN.json").read_text()
          assert "v0.4.0" in curator
          assert "13563804097" in (root / "references/CANNAE_45S_AUDIO_CUE_PLAN.json").read_text()
          cue_plan = (root / "references/CANNAE_45S_AUDIO_CUE_PLAN.json").read_text()
          assert "oga_park_ambience_river" in cue_plan and "oga_park_ambience_wind" in cue_plan
          assert "oga_vistula_river_waves" in cue_plan and "commons_howling_wind_building" in cue_plan
          cue_plan = (root / "references/CANNAE_45S_AUDIO_CUE_PLAN.json").read_text()
          assert "oga_park_ambience_river" in cue_plan and "oga_park_ambience_wind" in cue_plan
          assert "oga_vistula_river_waves" in cue_plan and "commons_howling_wind_building" in cue_plan
          assert "BUILT_VALIDATED_GITHUB_RELEASE_PUBLISHED" in (root / "references/CANNAE_45S_AUDIO_CUE_PLAN.json").read_text()
          assert "build-illustrated-history-foley-library.yml" in audio
          motion = (root / "references/ILLUSTRATED_HISTORY_MOTION_SYSTEM.md").read_text()
          assert "Five independent motion channels" in motion
          assert "museum" in motion.lower() and "legacy" in motion.lower()
          audit = (root / "references/HISTORICAL_FOLEY_COVERAGE_AUDIT.md").read_text()
          assert "hoofbeats" in audit and "cavalry" in audit
          assert "source_wav_file" in curator
          assert "acquire-meta-open-sound-wav-master.yml" in curator
          assert "never upload Sonniss raw archives" in curator
          assert "build-illustrated-history-foley-library.yml" in curator
          assert "foley-v0.3.0" in curator
          assert "validate_foley_review_decisions.py" in curator
          print("Plugin overlay validated:", manifest["version"])
          
          PY

      - name: Prepare plugin-root directory
        run: |
          set -euo pipefail
          mkdir -p dist/plugin-root
          cp -a integrations/nolane-video-command-center-overlay/. dist/plugin-root/
          test -s dist/plugin-root/plugin.json
          test -s dist/plugin-root/skills/illustrated-history-animation-director/SKILL.md
          test -s dist/plugin-root/references/ILLUSTRATED_HISTORY_MOTION_SYSTEM.md
          find dist/plugin-root -type f | sort | head -80

      - name: Upload plugin-root directory as a direct artifact
        uses: actions/upload-artifact@v7
        with:
          name: nolane-video-command-center-plugin-1.0.3
          path: dist/plugin-root/
          if-no-files-found: error
          retention-days: 14
