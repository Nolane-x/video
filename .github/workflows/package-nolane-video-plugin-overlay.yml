name: Package Nolane Video Command Center plugin overlay

on:
  workflow_dispatch:
  push:
    branches:
      - codex/samurai-cinematic-audio-v1
    paths:
      - "integrations/nolane-video-command-center-overlay/**"
      - ".github/workflows/package-nolane-video-plugin-overlay.yml"

permissions:
  contents: read

concurrency:
  group: nolane-video-plugin-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate plugin manifest and overlay structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("integrations/nolane-video-command-center-overlay")
          manifest = json.loads((root / "plugin.json").read_text())
          assert manifest["name"] == "nolane-video-command-center"
          assert manifest["version"] == "0.9.2"
          required = [
              "README.md",
              "SKILL-CATALOG.md",
              "skills/video-command-center/SKILL.md",
              "skills/historical-cinematic-documentary-director/SKILL.md",
              "skills/historical-military-animation-director/SKILL.md",
              "skills/audio-postproduction-engineer/SKILL.md",
              "skills/scene-detection-researcher/SKILL.md",
              "skills/video-cinematic-director/SKILL.md",
              "skills/illustrated-history-animation-director/SKILL.md",
              "skills/historical-audio-library-curator/SKILL.md",
              "references/ILLUSTRATED_HISTORY_MOTION_SYSTEM.md",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          assert not missing, missing
          catalog = (root / "SKILL-CATALOG.md").read_text()
          assert "33 internal skills" in catalog
          assert "illustrated-history-animation-director" in catalog
          assert "historical-audio-library-curator" in catalog
          motion = (root / "references/ILLUSTRATED_HISTORY_MOTION_SYSTEM.md").read_text()
          assert "Five independent motion channels" in motion
          print("Plugin overlay validated:", manifest["version"])
          
          PY

      - name: Prepare plugin-root directory
        run: |
          set -euo pipefail
          mkdir -p dist/plugin-root
          cp -a integrations/nolane-video-command-center-overlay/. dist/plugin-root/
          test -s dist/plugin-root/plugin.json
          test -s dist/plugin-root/skills/illustrated-history-animation-director/SKILL.md
          test -s dist/plugin-root/references/ILLUSTRATED_HISTORY_MOTION_SYSTEM.md
          find dist/plugin-root -type f | sort | head -80

      - name: Upload plugin-root directory as a direct artifact
        uses: actions/upload-artifact@v7
        with:
          name: nolane-video-command-center-plugin-0.9.2
          path: dist/plugin-root/
          if-no-files-found: error
          retention-days: 14
