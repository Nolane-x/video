name: Test VoiceStudio voice-over adapter

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/video/align_voicestudio_voiceover.py"
      - "tests/test_voicestudio_voiceover_alignment.py"
      - ".github/workflows/render-voicestudio-voiceover.yml"
      - ".github/workflows/test-voicestudio-voiceover.yml"
  push:
    branches: [main]
    paths:
      - "tools/video/align_voicestudio_voiceover.py"
      - "tests/test_voicestudio_voiceover_alignment.py"
      - ".github/workflows/render-voicestudio-voiceover.yml"
      - ".github/workflows/test-voicestudio-voiceover.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile adapter and run word-alignment contract tests
        run: |
          python -m py_compile tools/video/align_voicestudio_voiceover.py
          python tests/test_voicestudio_voiceover_alignment.py

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Validate VoiceStudio and video GitHub Actions workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/render-voicestudio-voiceover.yml \
            .github/workflows/test-voicestudio-voiceover.yml
