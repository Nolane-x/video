name: Render — Nếu Bạn Có Thể Dừng Thời Gian Trong 10 Giây

on:
  push:
    branches:
      - 'film/time-stop-10s-*'
    paths:
      - "video-projects/time-stop-10s/scripts/**"
      - "video-projects/time-stop-10s/scenes/**"
      - ".github/workflows/render-time-stop-10s.yml"
      - ".github/workflows/enable-time-stop-native-60fps.txt"
      - "integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: time-stop-10s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-narration:
    name: Build per-shot Vietnamese narration request
    runs-on: ubuntu-24.04
    outputs:
      job_json: ${{ steps.voice-job.outputs.job_json }}
    steps:
      - name: Checkout film branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select target render FPS
        run: |
          set -euo pipefail
          if [ -f .github/workflows/enable-time-stop-native-60fps.txt ] && grep -qx 'native-60fps' .github/workflows/enable-time-stop-native-60fps.txt; then
            echo "TARGET_FPS=60" >> "$GITHUB_ENV"
          else
            echo "TARGET_FPS=30" >> "$GITHUB_ENV"
          fi
      - name: Build H2 storyboard and VoiceStudio job payload
        id: voice-job
        run: |
          set -euo pipefail
          python video-projects/time-stop-10s/scripts/build_story.py --project-dir /tmp/time-stop-voice-story --fps "$TARGET_FPS"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          story = json.loads(Path("/tmp/time-stop-voice-story/story/shots.json").read_text(encoding="utf-8"))
          segments = []
          for shot in story["shots"]:
              text = str(shot.get("line", "")).strip()
              if not text:
                  raise SystemExit(f"Empty narration at {shot['id']}")
              segments.append({"id": shot["id"], "text": text, "pause_ms_after": 0})
          assert len(segments) == 84
          payload = {
              "schema_version": 1,
              "job_id": "time-stop-10s-vi",
              "title": "Nếu Bạn Có Thể Dừng Thời Gian Trong 10 Giây",
              "language": "vi",
              "engine": "vieneu",
              "voice_id": "vi-vieneu-v3turbo-adam-bua-87e364",
              "segments": segments,
          }
          encoded = json.dumps(payload, ensure_ascii=False, separators=(",", ":"))
          print("job_json<<VOICE_JOB")
          print(encoded)
          print("VOICE_JOB")
          import sys
          print(f"Prepared {len(segments)} Vietnamese narration segments / {sum(len(s['text']) for s in segments)} characters", file=sys.stderr)
          PY

  voiceover:
    name: Render and verify Vietnamese narration with VoiceStudio
    needs: prepare-narration
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      HF_HOME: /tmp/time-stop-hf-home
      HF_HUB_CACHE: /tmp/time-stop-hf-home/hub
      AUDIOSEAL_CACHE_DIR: /tmp/time-stop-audioseal
      TORCH_HOME: /tmp/time-stop-torch
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      VOICE_JOB_JSON: ${{ needs.prepare-narration.outputs.job_json }}
    steps:
      - name: Check out the video production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check out VoiceStudio's pinned TTS and watermark implementation
        uses: actions/checkout@v4
        with:
          repository: Nolane-x/VoiceStudio
          ref: main
          path: voice-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU inference and audio dependencies without system packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26" \
            "soundfile>=0.12.1" \
            "audioseal>=0.1.3" \
            "vieneu==3.8.3" \
            "huggingface_hub>=1.7" \
            "hf-xet>=1.1" \
            "jsonschema>=4.25,<5" \
            "imageio-ffmpeg>=0.6.0"
      - name: Resolve the bundled FFmpeg binary
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$FFMPEG"
          ln -sf "$FFMPEG" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$FFMPEG" -hide_banner -filters 2>/dev/null | grep -q loudnorm
          ffmpeg -version | head -n 1
      - name: Render, master, watermark and verify Vietnamese voice
        working-directory: voice-source
        run: |
          set -euo pipefail
          python scripts/render_video_voice.py --output "$GITHUB_WORKSPACE/voiceover-assets"
          test -s "$GITHUB_WORKSPACE/voiceover-assets/narration.wav"
          test -s "$GITHUB_WORKSPACE/voiceover-assets/manifest.json"
          test -s "$GITHUB_WORKSPACE/voiceover-assets/captions.srt"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "voiceover-assets"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          audio = manifest["audio"]
          assert manifest["language"] == "vi" and manifest["engine"] == "vieneu"
          assert manifest["segment_count"] == 84 and len(manifest["segments"]) == 84
          assert audio["sample_rate"] == 48000 and audio["channels"] == 1
          assert audio["subtype"] == "PCM_24" and audio["checks"] == "passed"
          assert audio["watermark"]["status"] == "verified"
          digest = hashlib.sha256((root / "narration.wav").read_bytes()).hexdigest()
          assert digest == audio["sha256"]
          print(f"VOICE PASS: {manifest['segment_count']} segments, {audio['duration_seconds']:.2f}s, AudioSeal verified")
          PY
      - name: Upload verified VoiceStudio narration
        uses: actions/upload-artifact@v4
        with:
          name: video-voice-assets-${{ github.run_id }}
          path: voiceover-assets/
          if-no-files-found: error
          retention-days: 14

  render-film:
    needs: voiceover
    name: H2 Canvas render, sound mix and QA
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Select target render FPS
        run: |
          set -euo pipefail
          if [ -f .github/workflows/enable-time-stop-native-60fps.txt ] && grep -qx 'native-60fps' .github/workflows/enable-time-stop-native-60fps.txt; then
            echo "OUTPUT_FPS=60" >> "$GITHUB_ENV"
          else
            echo "OUTPUT_FPS=30" >> "$GITHUB_ENV"
          fi

      - name: Download verified VoiceStudio narration artifact
        uses: actions/download-artifact@v4
        with:
          name: video-voice-assets-${{ github.run_id }}
          path: voiceover-assets

      - name: Set up Node and Python
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Ensure FFmpeg and ffprobe are available
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Verify render toolchain
        run: |
          set -euo pipefail
          node --version
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E '(^|[[:space:]])libx264([[:space:]]|$)'

      - name: Install H2 Canvas and audio dependencies
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          python -m pip install numpy scipy soundfile pyloudnorm
          python audio/build_audio.py

      - name: Resolve Chromium for H2
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "Using runner browser: $CHROME"
            echo "H2_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          else
            echo "No system Chrome found; installing the pinned Playwright Chromium."
            npx playwright install --with-deps chromium
          fi

      - name: Build original 84-shot storyboard
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          python ../../../../../video-projects/time-stop-10s/scripts/build_story.py \
            --project-dir projects/time-stop-10s --fps "$OUTPUT_FPS"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("projects/time-stop-10s")
          cfg = json.loads((p / "config.json").read_text(encoding="utf-8"))
          story = json.loads((p / "story/shots.json").read_text(encoding="utf-8"))
          shots = story["shots"]
          target_fps = int(os.environ["OUTPUT_FPS"])
          assert cfg["fps"] == target_fps and cfg["resolution"] == "1080p"
          assert len(shots) == 84 and story["duration"] == 378.0
          assert story["fps"] == target_fps and len(story["music"]) == 7
          assert story["production"]["paid_video_services"] is False
          assert story["production"]["time_freeze_fx_count"] == 26
          assert shots[0]["start"] == 0 and shots[-1]["end"] == 378.0
          last = 0
          for shot in shots:
              assert abs(shot["start"] - last) < 1e-6, f"Timeline gap at {shot['id']}"
              assert abs((shot["end"] - shot["start"]) - 4.5) < 1e-6
              assert shot["tpl"] == "scene"
              last = shot["end"]
          print(f"STORY PASS: {len(shots)} shots, {story['duration']}s, {target_fps}fps, {int(story['duration']*target_fps)} frames")
          PY

      - name: Place Vietnamese voice-over on the 84-shot timeline
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          python ../../../../../video-projects/time-stop-10s/scripts/place_voiceover.py \
            --project projects/time-stop-10s \
            --artifact-dir ../../../../../voiceover-assets
          test -s projects/time-stop-10s/timeline/voice.wav
          test -s projects/time-stop-10s/out/captions.srt
          test -s projects/time-stop-10s/out/voice-placement.json

      - name: Install 3D rescue and key-sequence scene modules
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          mkdir -p projects/time-stop-10s/scenes/shots
          cp ../../../../../video-projects/time-stop-10s/scenes/shots/time-stop-3d.js projects/time-stop-10s/scenes/shots/time-stop-3d.js
          cp ../../../../../video-projects/time-stop-10s/scenes/shots/time-stop-key-sequences-3d.js projects/time-stop-10s/scenes/shots/time-stop-key-sequences-3d.js
          grep -q "reg('s063'" projects/time-stop-10s/scenes/shots/time-stop-3d.js
          grep -q "reg('s072'" projects/time-stop-10s/scenes/shots/time-stop-3d.js
          grep -q "kitchenIds" projects/time-stop-10s/scenes/shots/time-stop-key-sequences-3d.js
          grep -q "courtIds" projects/time-stop-10s/scenes/shots/time-stop-key-sequences-3d.js
          grep -q "hallwayIds" projects/time-stop-10s/scenes/shots/time-stop-key-sequences-3d.js
          node --check projects/time-stop-10s/scenes/shots/time-stop-3d.js
          node --check projects/time-stop-10s/scenes/shots/time-stop-key-sequences-3d.js

      - name: Scan all H2 shots for renderer and template errors
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        timeout-minutes: 30
        run: |
          set -euo pipefail
          node render.mjs --project projects/time-stop-10s --check --scale 0.25

      - name: Render full contact sheets for visual review
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        timeout-minutes: 25
        run: |
          set -euo pipefail
          node render.mjs --project projects/time-stop-10s --sheet --scale 0.5 --at 0.45

      - name: Render a 30-second motion preview
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        timeout-minutes: 20
        run: |
          set -euo pipefail
          node render.mjs --project projects/time-stop-10s --from 0 --to 30 --scale 0.5 --workers 2 --crf 20

      - name: Render the complete 1080p native-FPS silent master
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        timeout-minutes: 150
        run: |
          set -euo pipefail
          node render.mjs --project projects/time-stop-10s --workers 2 --crf 19

      - name: Mix original procedural music and sound design
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python tools/mix.py --project projects/time-stop-10s
          test -s projects/time-stop-10s/out/time-stop-10s.mp4

      - name: Package master, preview, contact sheets and QA
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        timeout-minutes: 15
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/dist/time-stop-10s"
          PROJECT="projects/time-stop-10s"
          MASTER="$PROJECT/out/time-stop-10s.mp4"
          mkdir -p "$ROOT/contact-sheets" "$ROOT/story" "$ROOT/voiceover" "$ROOT/subtitles"
          cp "$MASTER" "$ROOT/time-stop-10s-master.mp4"
          cp "$PROJECT/story/shots.json" "$ROOT/story/"
          cp "$PROJECT/story/shot-plan.json" "$ROOT/story/"
          cp "$PROJECT/story/bible.md" "$ROOT/story/"
          cp "$PROJECT/01-PHIM-time-stop-10s.txt" "$ROOT/story/"
          cp "$PROJECT/out/voice-placement.json" "$ROOT/"
          cp "$PROJECT/out/captions.srt" "$ROOT/subtitles/time-stop-10s.srt"
          cp "$PROJECT/out/captions.vtt" "$ROOT/subtitles/time-stop-10s.vtt"
          cp "$GITHUB_WORKSPACE/voiceover-assets/narration.wav" "$ROOT/voiceover/"
          cp "$GITHUB_WORKSPACE/voiceover-assets/manifest.json" "$ROOT/voiceover/"
          cp "$GITHUB_WORKSPACE/voiceover-assets/transcript.txt" "$ROOT/voiceover/"
          cp "$GITHUB_WORKSPACE/voiceover-assets/build-summary.txt" "$ROOT/voiceover/"
          if compgen -G "$PROJECT/build/sheets/*.jpg" > /dev/null; then
            cp "$PROJECT"/build/sheets/*.jpg "$ROOT/contact-sheets/"
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -i "$MASTER" -t 30 -c:v libx264 -preset veryfast -crf 22 \
            -c:a aac -b:a 160k -movflags +faststart "$ROOT/time-stop-10s-preview-30s.mp4"
          ffprobe -v error -count_frames -show_streams -show_format -of json "$MASTER" > "$ROOT/ffprobe.json"
          ffmpeg -hide_banner -nostats -i "$MASTER" -af ebur128=peak=true -f null - \
            2> "$ROOT/ebur128.log"
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "dist/time-stop-10s"
          meta = json.loads((root / "ffprobe.json").read_text())
          target_fps = int(os.environ["OUTPUT_FPS"])
          streams = meta.get("streams", [])
          video = [s for s in streams if s.get("codec_type") == "video"]
          audio = [s for s in streams if s.get("codec_type") == "audio"]
          failures = []
          def check(condition, message):
              if not condition:
                  failures.append(str(message))
          if not video:
              failures.append("Master MP4 has no video stream")
          if not audio:
              failures.append("Master MP4 has no audio stream")
          if not video or not audio:
              report = {"status": "technical-fail", "visual_approval": False, "qa_failures": failures}
          (root / "qa-report.json").write_text(json.dumps(report, indent=2) + "\n")
              print(json.dumps(report, indent=2))
              raise SystemExit(1)
          v, a = video[0], audio[0]
          duration = float(meta["format"]["duration"])
          width, height = int(v.get("width", 0)), int(v.get("height", 0))
          frames = int(v.get("nb_read_frames", v.get("nb_frames", 0)))
          check((width, height) == (1920, 1080), f"resolution={(width, height)}; expected 1920x1080")
          check(v.get("r_frame_rate") == f"{target_fps}/1", f"fps={v.get('r_frame_rate')}; expected {target_fps}/1")
          check(frames == round(duration * target_fps), f"decoded frames={frames}, duration={duration}, fps={target_fps}")
          check(abs(duration - 378.0) < 0.20, f"duration={duration}; expected 378 seconds")
          check(a.get("codec_name") == "aac", f"audio codec={a.get('codec_name')}; expected AAC")
          check(a.get("sample_rate") == "48000", f"audio sample rate={a.get('sample_rate')}; expected 48000")
          check(int(a.get("channels", 0)) == 2, f"audio channels={a.get('channels')}; expected stereo")
          log = (root / "ebur128.log").read_text(errors="replace")
          m_i = re.findall(r"^\s*I:\s*(-?[0-9]+(?:\.[0-9]+)?)\s*LUFS\s*$", log, re.M)
          m_p = re.findall(r"^\s*Peak:\s*(-?[0-9]+(?:\.[0-9]+)?)\s*dBFS\s*$", log, re.M)
          integrated = float(m_i[-1]) if m_i else None
          peak = float(m_p[-1]) if m_p else None
          check(integrated is not None, "Missing integrated loudness measurement")
          if integrated is not None:
              check(-15.0 <= integrated <= -13.0, f"integrated loudness={integrated} LUFS; required -15 to -13 LUFS")
          check(peak is not None, "Missing EBU peak measurement")
          if peak is not None:
              check(peak <= -1.0, f"EBU peak={peak} dBFS; maximum allowed -1.0 dBFS")
          voice = {}
          voice_manifest = {}
          try:
              voice = json.loads((root / "voice-placement.json").read_text(encoding="utf-8"))
              voice_manifest = json.loads((root / "voiceover/manifest.json").read_text(encoding="utf-8"))
          except Exception as exc:
              failures.append(f"Could not read narration placement/manifest: {exc}")
          check(voice.get("status") == "passed", f"voice placement status={voice.get('status')}")
          check(voice.get("placed_segments") == 84, f"voice segments={voice.get('placed_segments')}; expected 84")
          check(voice.get("language") == "vi", f"voice language={voice.get('language')}; expected vi")
          check(voice.get("engine") == "vieneu", f"voice engine={voice.get('engine')}; expected vieneu")
          watermark = voice_manifest.get("audio", {}).get("watermark", {}).get("status")
          check(watermark == "verified", f"narration watermark={watermark}; expected verified")
          report = {
              "status": "technical-pass" if not failures else "technical-fail",
              "duration_seconds": duration,
              "fps": v.get("r_frame_rate"),
              "frames": frames,
              "frame_generation": "native H2 render at configured FPS",
              "resolution": [width, height],
              "video_codec": v.get("codec_name"),
              "audio_codec": a.get("codec_name"),
              "audio_sample_rate": a.get("sample_rate"),
              "audio_channels": int(a.get("channels", 0)),
              "integrated_lufs": integrated,
              "peak_dbfs": peak,
              "audio_gates": {"integrated_lufs": [-15.0, -13.0], "peak_dbfs_max": -1.0},
              "story_shots": 84,
              "freeze_fx_shots": 26,
              "narration_language": voice.get("language"),
              "narration_engine": voice.get("engine"),
              "narration_voice_id": voice.get("voice_id"),
              "narration_segments": voice.get("placed_segments"),
              "narration_watermark": watermark,
              "voiceover_timeline": "shot-synced" if voice.get("status") == "passed" else "failed",
              "qa_failures": failures,
              "visual_approval": False,
              "note": "Technical validation only; inspect the full contact sheets and motion proofs before artistic approval."
          }
          (root / "qa-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if failures:
              raise SystemExit(f"Technical QA failed with {len(failures)} issue(s); see qa-report.json")
          PY
          (cd "$ROOT" && sha256sum *.mp4 *.json *.log story/* voiceover/* subtitles/* contact-sheets/* > SHA256SUMS.txt)
          cd "$GITHUB_WORKSPACE"
          zip -qr dist/time-stop-10s-review.zip dist/time-stop-10s

      - name: Upload diagnostic package when technical QA fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: time-stop-10s-diagnostic-${{ github.run_number }}
          path: dist/time-stop-10s/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload film candidate and review package
        uses: actions/upload-artifact@v4
        with:
          name: time-stop-10s-h2-${{ github.run_number }}
          path: |
            dist/time-stop-10s/time-stop-10s-master.mp4
            dist/time-stop-10s/time-stop-10s-preview-30s.mp4
            dist/time-stop-10s-review.zip
            dist/time-stop-10s/qa-report.json
            dist/time-stop-10s/voice-placement.json
            dist/time-stop-10s/voiceover/
            dist/time-stop-10s/subtitles/
            dist/time-stop-10s/contact-sheets/
          if-no-files-found: error
          retention-days: 30
