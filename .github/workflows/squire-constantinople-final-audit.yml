name: Squire · Constantinople 1453 · Current master human-review package

on:
  push:
    branches:
      - squire/constantinople-1453-redesign
    paths:
      - .github/workflows/squire-constantinople-final-audit.yml
      - .github/workflows/test-squire-constantinople.yml
      - tools/video/build_squire_review_pack.py
      - tests/test_squire_review_pack.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: squire-constantinople-current-master-review
  cancel-in-progress: false

jobs:
  resolve-master:
    name: Resolve the newest verified master on this source branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Find the newest successful, source-compatible 240fps master
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = "squire/constantinople-1453-redesign";
            const workflowPath = ".github/workflows/squire-constantinople-segmented-master.yml";
            const allowedPostMasterChanges = new Set([
              ".github/workflows/squire-constantinople-final-audit.yml",
              ".github/workflows/test-squire-constantinople.yml",
              "tools/video/build_squire_review_pack.py",
              "tests/test_squire_review_pack.py"
            ]);
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 414750781,
              branch: branchName,
              status: "completed",
              per_page: 100
            });

            for (const source of result.data.workflow_runs) {
              if (source.conclusion !== "success" ||
                  source.head_branch !== branchName ||
                  source.path !== workflowPath ||
                  !source.head_sha) continue;

              const comparison = await github.request(
                "GET /repos/{owner}/{repo}/compare/{base}...{head}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: source.head_sha,
                  head: context.sha
                }
              );
              if (comparison.data.too_large ||
                  !["ahead", "identical"].includes(comparison.data.status)) continue;

              const changed = (comparison.data.files || []).map(file => file.filename);
              const unsafe = changed.filter(path => !allowedPostMasterChanges.has(path));
              if (unsafe.length) {
                core.info("Skipping master run " + source.id + "; render-affecting files changed afterward: " + unsafe.join(", "));
                continue;
              }

              const [jobsResponse, artifactsResponse] = await Promise.all([
                github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: source.id,
                  per_page: 100
                }),
                github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: source.id,
                  per_page: 100
                })
              ]);

              const assembly = jobsResponse.data.jobs.find(
                job => job.name === "Join segments, mix soundtrack and run strict master QA"
              );
              if (!assembly || assembly.conclusion !== "success") continue;
              const steps = new Map((assembly.steps || []).map(step => [step.name, step.conclusion]));
              const requiredSteps = [
                "Run strict long-form 240fps technical QA",
                "Attach Blender insert provenance to the master QA report",
                "Assemble complete delivery package",
                "Upload complete verified 16-minute 1080p native 240fps master"
              ];
              if (requiredSteps.some(name => steps.get(name) !== "success")) continue;

              const expectedName = "squire-constantinople-1453-redesign-240fps-" + source.id;
              const artifact = artifactsResponse.data.artifacts.find(item =>
                item.name === expectedName && !item.expired && item.size_in_bytes >= 1000000000
              );
              if (!artifact) continue;

              core.info("Selected verified master run " + source.id + ", artifact " + artifact.id + ", " + artifact.size_in_bytes + " bytes, source " + source.head_sha + ".");
              core.setOutput("run_id", String(source.id));
              core.setOutput("artifact_id", String(artifact.id));
              core.setOutput("artifact_name", artifact.name);
              core.setOutput("source_sha", source.head_sha);
              return;
            }

            core.setFailed("No unexpired, successful, source-compatible 240fps master artifact passed the required QA and upload gates.");

  build-review-pack:
    name: Build full-length review proxy, complete audio and dense shot contact sheets
    needs: resolve-master
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download the exact verified master artifact selected above
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-master.outputs.artifact_name }}
          path: source
          run-id: ${{ needs.resolve-master.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg and timestamp overlay font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Verify master provenance and build full-length human-review package
        shell: bash
        run: |
          set -euo pipefail
          python tools/video/build_squire_review_pack.py \
            --source source \
            --output review \
            --run-id '${{ needs.resolve-master.outputs.run_id }}' \
            --artifact-id '${{ needs.resolve-master.outputs.artifact_id }}' \
            --artifact-name '${{ needs.resolve-master.outputs.artifact_name }}' \
            --source-sha '${{ needs.resolve-master.outputs.source_sha }}'
          du -sh review
          test -s review/FULL-FILM-REVIEW-720p30.mp4
          test -s review/FULL-AUDIO-REVIEW.mp3
          test -s review/SHOT-INDEX.csv
          test -s review/REVIEW-LOG-TEMPLATE.csv
          test -s review/AUDIT-README.json
          test -s review/SHA256SUMS-REVIEW.txt

      - name: Upload review package without recompressing encoded media
        uses: actions/upload-artifact@v4
        with:
          name: squire-constantinople-human-review-${{ needs.resolve-master.outputs.run_id }}
          path: review/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
