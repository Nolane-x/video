name: Constantinople · CC0 siege-engine cut-in · native 240fps

on:
  push:
    branches:
      - cinematic/constantinople-asset-cutin-v1
    paths:
      - 'tools/blender/render_constantinople_asset_cutin_v1.py'
      - 'tools/video/extract_constantinople_asset_cutin_v1.py'
      - '.github/workflows/constantinople-asset-cutin-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: constantinople-asset-cutin-v1
  cancel-in-progress: false

jobs:
  prepare:
    name: Download, hash-check and extract exact CC0 siege assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download the Build 76 OpenGameArt and Poly Haven ZIP volumes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            'https://github.com/Nolane-x/video/releases/download/video-asset-library-build-41184526545/video-assets-opengameart-3d-textures-001.zip' \
            -o downloads/opengameart-3d-textures-001.zip
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            'https://github.com/Nolane-x/video/releases/download/video-asset-library-build-41184526545/video-assets-polyhaven-3d-textures-001.zip' \
            -o downloads/polyhaven-3d-textures-001.zip
          test "$(stat -c %s downloads/opengameart-3d-textures-001.zip)" -eq 994179162
          test "$(stat -c %s downloads/polyhaven-3d-textures-001.zip)" -eq 347196184
          echo 'e8bd2ffc95fd2dfe647276c9d4d026e1ba5f24c65d08ebb87729cbb78da7ac1e  downloads/opengameart-3d-textures-001.zip' | sha256sum -c -
          echo '1573a65d9698375dbfd9bead9b8a551848a99f8cdba9dfd2b16c892319b5f7ef  downloads/polyhaven-3d-textures-001.zip' | sha256sum -c -

      - name: Download the already verified CC0-derived rigged crew model
        uses: actions/download-artifact@v4
        with:
          name: constantinople-crew-pbr-v4-character-43439300571
          path: character
          repository: Nolane-x/video
          run-id: '43439300571'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract only the four siege props and two required PBR maps
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/video/extract_constantinople_asset_cutin_v1.py
          python tools/video/extract_constantinople_asset_cutin_v1.py \
            --downloads downloads \
            --character character \
            --out cutin-assets
          test -s cutin-assets/models/siege-tower.glb
          test -s cutin-assets/models/siege-ram.glb
          test -s cutin-assets/models/siege-trebuchet.glb
          test -s cutin-assets/textures/castle_brick_02_red_diff_1k.jpg
          test -s cutin-assets/textures/castle_brick_02_red_nor_gl_1k.jpg
          test -s cutin-assets/character/ottoman-artillery-crew-cc0.glb
          (cd cutin-assets && sha256sum -c <(sha256sum models/* textures/* character/*.glb))

      - name: Upload the minimal verified CC0 asset subset for smoke and rendering
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-asset-cutin-v1-assets-${{ github.run_id }}
          path: cutin-assets/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  smoke:
    name: Render a full-resolution Blender scene with the imported siege tower
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Blender and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-numpy libegl1 libgl1 libxkbcommon0 libsm6
          blender --version | head -n 2
      - uses: actions/download-artifact@v4
        with:
          name: constantinople-asset-cutin-v1-assets-${{ github.run_id }}
          path: cutin-assets
      - name: Compile and render one 1080p full-resolution smoke frame
        env:
          CUTIN_ASSETS: cutin-assets
          BLENDER_FRAME_START: '1'
          BLENDER_FRAME_END: '1'
          BLENDER_SMOKE_ONLY: '1'
          BLENDER_SMOKE_FRAME: '960'
          SMOKE_OUTPUT: out/asset-cutin-smoke.png
          BLENDER_OUTPUT: out/asset-cutin-smoke.mp4
          BLENDER_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile tools/blender/render_constantinople_asset_cutin_v1.py
          blender --background --threads 2 --python tools/blender/render_constantinople_asset_cutin_v1.py 2>&1 | tee out/smoke.log
          test -s out/asset-cutin-smoke.png
          test -s out/asset-cutin-smoke.scene.json
          python - <<'PY'
          import json
          m=json.load(open("out/asset-cutin-smoke.scene.json",encoding="utf-8"))
          assert m["fps"]==240 and m["resolution"]==[1920,1080],m
          assert m["assets"]["siege_tower"]["license"]=="CC0-1.0 Kenney Castle Kit",m
          assert m["assets"]["castle_brick_diffuse"]["license"]=="CC0-1.0 Poly Haven",m
          assert len(m["crew"])==4 and all(x["action"] for x in m["crew"]),m
          print("SIEGE ENGINE SMOKE PASS",m["crew"])
          PY
      - name: Upload full-resolution smoke frame and import report
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-asset-cutin-v1-smoke-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  render:
    name: Render native 240fps frames ${{ matrix.id }} (${{ matrix.start }}–${{ matrix.end }})
    needs: [prepare, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { id: "01", start: 1, end: 480 }
          - { id: "02", start: 481, end: 960 }
          - { id: "03", start: 961, end: 1440 }
          - { id: "04", start: 1441, end: 1920 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-numpy libegl1 libgl1 libxkbcommon0 libsm6
      - uses: actions/download-artifact@v4
        with:
          name: constantinople-asset-cutin-v1-assets-${{ github.run_id }}
          path: cutin-assets
      - name: Render one disjoint 2-second frame range at native 240fps
        env:
          CUTIN_ASSETS: cutin-assets
          FRAME_START: ${{ matrix.start }}
          FRAME_END: ${{ matrix.end }}
          CHUNK_ID: ${{ matrix.id }}
          BLENDER_THREADS: '3'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile tools/blender/render_constantinople_asset_cutin_v1.py
          BLENDER_FRAME_START="$FRAME_START" \
          BLENDER_FRAME_END="$FRAME_END" \
          BLENDER_OUTPUT="$PWD/out/asset-cut-in-$CHUNK_ID.mp4" \
          blender --background --threads 3 --python tools/blender/render_constantinople_asset_cutin_v1.py 2>&1 | tee "out/render-$CHUNK_ID.log"
          test -s "out/asset-cut-in-$CHUNK_ID.mp4"
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,avg_frame_rate,nb_read_frames \
            -of json "out/asset-cut-in-$CHUNK_ID.mp4" > "out/asset-cut-in-$CHUNK_ID.json"
          CHUNK_ID="$CHUNK_ID" FRAME_START="$FRAME_START" FRAME_END="$FRAME_END" \
          python - <<'PY'
          import json,os
          v=json.load(open(f"out/asset-cut-in-{os.environ['CHUNK_ID']}.json"))["streams"][0]
          expected=int(os.environ["FRAME_END"])-int(os.environ["FRAME_START"])+1
          assert (v["width"],v["height"])==(1920,1080),v
          assert v["r_frame_rate"]=="240/1" and v["avg_frame_rate"]=="240/1",v
          assert int(v["nb_read_frames"])==expected==480,v
          print("ASSET CUT-IN CHUNK PASS",os.environ["CHUNK_ID"],v)
          PY
          cp cutin-assets/CUTIN-ASSET-MANIFEST.json "out/asset-cut-in-$CHUNK_ID-assets.json"
      - uses: actions/upload-artifact@v4
        with:
          name: constantinople-asset-cutin-v1-shard-${{ matrix.id }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and QA the 8-second 1920x1080 native-240fps siege-engine cut-in
    needs: [render, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and checksum utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download all four rendered shards and smoke evidence
        uses: actions/download-artifact@v4
        with:
          pattern: constantinople-asset-cutin-v1-shard-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Verify exact frame coverage and concatenate without re-encoding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("shards")
          concat=[];total=0
          for i in range(1,5):
              name=f"{i:02d}"
              p=root/f"asset-cut-in-{name}.mp4"
              meta=json.loads((root/f"asset-cut-in-{name}.json").read_text())
              v=meta["streams"][0]
              assert p.is_file() and p.stat().st_size>100_000,p
              assert (v["width"],v["height"])==(1920,1080),v
              assert v["r_frame_rate"]=="240/1" and v["avg_frame_rate"]=="240/1",v
              assert int(v["nb_read_frames"])==480,v
              total+=480;concat.append(f"file '{p.resolve().as_posix()}'")
          assert total==1920,total
          Path("concat.txt").write_text("\n".join(concat)+"\n")
          print("NO GAPS / OVERLAPS",total)
          PY
          ffmpeg -hide_banner -v error -y -f concat -safe 0 -i concat.txt \
            -map 0:v:0 -c:v copy -movflags +faststart constantinople-siege-engine-asset-cutin-240fps.mp4
      - name: Create 30fps review proxy and contact sheet
        run: |
          set -euo pipefail
          mkdir -p review
          ffmpeg -hide_banner -v error -y -i constantinople-siege-engine-asset-cutin-240fps.mp4 \
            -vf "fps=30,scale=960:540" -an -c:v libx264 -preset veryfast -crf 22 \
            review/review-proxy-30fps-960x540.mp4
          ffmpeg -hide_banner -v error -y -i constantinople-siege-engine-asset-cutin-240fps.mp4 \
            -vf "fps=1,scale=480:-1,tile=4x2" -frames:v 1 review/contact-sheet.jpg
          cp shards/asset-cut-in-01-assets.json review/CUTIN-ASSET-MANIFEST.json
          cp shards/render-01.log review/render-01.log
          cat > review/ART-DIRECTION-NOTES.md <<'EOF'
          # Constantinople 1453 — asset-library siege-engine cut-in

          - The Kenney Castle Kit siege tower, siege ram and trebuchet are generic CC0 props.
          - They are illustrative assets, not authenticated Ottoman/Byzantine equipment from 1453.
          - Poly Haven Castle Brick 02 Red is used as a CC0 PBR wall texture.
          - Four CC0-derived 53-bone crew performers are reused from the independently verified character artifact.
          - This is an 8-second silent visual insert proof, not the full film master.
          - Human review of proportions, movement, visual fit and historical framing is required before insertion into the film.
          EOF
          ffprobe -v error -count_frames -show_streams -show_format -of json \
            constantinople-siege-engine-asset-cutin-240fps.mp4 > review/metadata.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("constantinople-siege-engine-asset-cutin-240fps.mp4")
          j=json.loads(Path("review/metadata.json").read_text())
          v=next(s for s in j["streams"] if s["codec_type"]=="video")
          assert (v["width"],v["height"])==(1920,1080),v
          assert v["r_frame_rate"]=="240/1" and v["avg_frame_rate"]=="240/1",v
          assert int(v["nb_read_frames"])==1920,v
          assert 7.99<=float(j["format"]["duration"])<=8.02,j["format"]
          Path("review/QA-REPORT.json").write_text(json.dumps({
            "status":"TECHNICAL_PASS_PENDING_HUMAN_VISUAL_REVIEW",
            "resolution":[v["width"],v["height"]],"fps":v["r_frame_rate"],
            "frames":int(v["nb_read_frames"]),"duration_seconds":float(j["format"]["duration"]),
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size,
            "contains_audio":any(s["codec_type"]=="audio" for s in j["streams"]),
            "limitations":["Illustrative CC0 Castle Kit siege props, not an authenticated 1453 reconstruction.",
                           "This 8-second B-roll proof is not yet inserted into the 15:57 film.",
                           "Human visual review and style-match approval are pending."]
          },indent=2)+"\n")
          PY
          cp constantinople-siege-engine-asset-cutin-240fps.mp4 review/
          (cd review && sha256sum * > SHA256SUMS.txt)
      - name: Upload the 8-second siege-engine review bundle
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-siege-engine-asset-cutin-240fps-${{ github.run_id }}
          path: review/
          if-no-files-found: error
          retention-days: 30
