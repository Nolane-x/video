name: Render and QA H2 source-v3 shoe-tying candidate

on:
  push:
    branches: [main]
    paths:
      - "video-library/one-more-scroll/h2-source-v3-render-request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2-source-v3-candidate-render
  cancel-in-progress: false

jobs:
  render-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and persistent production state
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip unzip

      - name: Validate approved preview request and pinned patch revision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path("video-library/one-more-scroll/h2-source-v3-render-request.json").read_text())
          assert request.get("status") == "preview_passed_ready_for_full_render", "Focused shoe-tying preview has not been approved for full render."
          assert request.get("preview_workflow_run_id") == "40280228327", "Unexpected preview run; review the latest approved preview before rendering."
          assert request.get("patch_commit") == "05a2027cebdc83cedc1002992198d9404f253647", "Source-v3 patch revision mismatch."
          assert request.get("canonical_master_must_remain_unchanged") is True
          print("Source-v3 render request approved and pinned to the previewed patch.")
          PY
          git diff --exit-code 05a2027cebdc83cedc1002992198d9404f253647 -- tools/video/patch_h2_shoelace_scene.py

      - name: Download and checksum-verify immutable source-v2 base for source-v3 patch
        run: |
          set -euo pipefail
          SOURCE="one-more-scroll-h2-source-v2-scene-fixes.zip"
          URL="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("video-library/one-more-scroll/h2-source-release.json").read_text())
          assert manifest.get("status")=="uploaded_to_github_release_and_checksum_verified", "H2 source release is not verified/published."
          item=next(x for x in manifest["assets"] if x["filename"]=="one-more-scroll-h2-source-v2-scene-fixes.zip")
          assert item["sha256"]=="b8db965db214bf0e37b307d3fe1aa663c55f29ee753fd9103a5972b5fe633014"
          print(item["release_asset_url"])
          PY
          )"
          mkdir -p /tmp/h2-source-v3 /tmp/h2-review-v3/payload
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 900 --output "/tmp/$SOURCE" "$URL"
          test "$(stat -c %s "/tmp/$SOURCE")" = "115856962"
          test "$(sha256sum "/tmp/$SOURCE" | cut -d ' ' -f1)" = "b8db965db214bf0e37b307d3fe1aa663c55f29ee753fd9103a5972b5fe633014"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path("/tmp/one-more-scroll-h2-source-v2-scene-fixes.zip")
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f"Corrupt source-v2 ZIP member: {bad}")
              names=set(z.namelist())
              required={"render.mjs","engine/core.js","engine/rig.js","packs/dem/sets.js","projects/one-more-scroll-h2/story/shots.json","projects/one-more-scroll-h2/config.json"}
              if not required.issubset(names): raise SystemExit(f"Missing source files: {sorted(required-names)}")
              # Prevent unsafe archive entries from writing outside the working folder.
              for name in names:
                  if name.startswith("/") or ".." in Path(name).parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
              z.extractall("/tmp/h2-source-v3")
          print("Source-v2 archive verified and extracted.")
          PY

      - name: Apply deterministic source-v3 shoe-tying patch
        run: |
          set -euo pipefail
          python tools/video/patch_h2_shoelace_scene.py /tmp/h2-source-v3 \
            --report /tmp/h2-review-v3/payload/source-v3-patch-report.json
          node --check /tmp/h2-source-v3/packs/dem/bean.js
          python -m json.tool /tmp/h2-source-v3/projects/one-more-scroll-h2/story/shots.json >/dev/null
          cat /tmp/h2-review-v3/payload/source-v3-patch-report.json

      - name: Install project and Chromium dependencies
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audio.txt

      - name: Validate JSON, JavaScript and Python sources
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          node --check render.mjs
          node --check engine/core.js
          node --check engine/player.js
          node --check packs/dem/sets.js
          node --check packs/dem/templates.js
          node --check packs/dem/pack.js
          find engine packs tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json
          from pathlib import Path
          story=json.loads(Path("projects/one-more-scroll-h2/story/shots.json").read_text())
          config=json.loads(Path("projects/one-more-scroll-h2/config.json").read_text())
          assert story.get("duration")==155, "Unexpected story duration"
          assert len(story.get("shots",[]))==31, "Expected exactly 31 shots"
          assert config.get("resolution")=="1080p" and config.get("fps")==24
          print("JSON/story validation passed: 31 shots, 155s, 1080p/24.")
          PY
          find engine packs tools -type f -name '*.py' -print0 | xargs -0 -n1 python -m py_compile

      - name: Run H2 browser smoke check across the source-v3 timeline
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          node render.mjs --project projects/one-more-scroll-h2 --check --scale 0.25 --gl swiftshader 2>&1 | tee /tmp/h2-review-v3/h2-browser-check.log
          if grep -E "LOI:|THIEU [1-9]|LOI NAP FILE CANH" /tmp/h2-review-v3/h2-browser-check.log; then
            echo "Browser smoke check logged missing scenes or render errors."
            exit 1
          fi

      - name: Generate source-v3 contact sheets
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          node render.mjs --project projects/one-more-scroll-h2 --sheet --scale 0.5 --at 0.5 --gl swiftshader 2>&1 | tee /tmp/h2-review-v3/h2-contact-sheet.log
          test -s projects/one-more-scroll-h2/build/sheets/sheet_01.jpg
          test -s projects/one-more-scroll-h2/build/sheets/sheet_02.jpg
          cp projects/one-more-scroll-h2/build/sheets/sheet_*.jpg /tmp/h2-review-v3/payload/

      - name: Validate packaged music and sound-effect assets
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/h2-review-v3/h2-audio-generation.log
          import json
          from pathlib import Path
          project=Path("projects/one-more-scroll-h2")
          story=json.loads((project/"story/shots.json").read_text())
          music_dir=Path("audio/music")
          sfx_dir=Path("audio/sfx")
          music={p.stem.split("_")[1]:p for p in music_dir.glob("bed_*.wav")}
          sfx={p.stem for p in sfx_dir.glob("*.wav")}
          required_beds={x.get("bed") for x in story.get("music",[]) if x.get("bed") not in (None,"none","drop")}
          missing_beds=sorted(required_beds-set(music))
          cues=[]
          for shot in story.get("shots",[]):
              cues.extend((shot.get("id"),x.get("name")) for x in shot.get("sfx",[]))
          cues.extend(("story",x.get("name")) for x in story.get("sfx",[]))
          def has_sfx(name):
              return name in sfx or any(x.startswith(str(name)+"_") for x in sfx)
          missing_sfx=sorted({name for _,name in cues if not has_sfx(name)})
          if missing_beds: raise SystemExit("Missing pre-rendered music beds: "+", ".join(missing_beds))
          if missing_sfx: raise SystemExit("Missing SFX for story cues: "+", ".join(missing_sfx))
          if len(list(music_dir.glob("*.wav")))<5: raise SystemExit("Expected the five pre-rendered music beds.")
          if len(list(sfx_dir.glob("*.wav")))<20: raise SystemExit("Expected the pre-rendered H2 sound-effect library.")
          print(f"Pre-rendered audio validated: {len(required_beds)} referenced music beds, {len(cues)} story SFX cues, {len(sfx)} SFX WAVs. Source ZIP contains rendered WAV assets; packs/dem/audio.py depends on a synth module that is not included in the archive, so do not invoke it as a standalone generator.")
          PY

      - name: Render source-v3 full-length silent master
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          node render.mjs --project projects/one-more-scroll-h2 --workers 4 --crf 18 --gl swiftshader 2>&1 | tee /tmp/h2-review-v3/h2-full-render.log
          test -s projects/one-more-scroll-h2/build/video_silent.mp4

      - name: Mix music and SFX and verify source-v3 candidate metadata
        working-directory: /tmp/h2-source-v3
        run: |
          set -euo pipefail
          python tools/mix.py --project projects/one-more-scroll-h2 2>&1 | tee /tmp/h2-review-v3/h2-audio-mix.log
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          out=Path("projects/one-more-scroll-h2/out")
          videos=sorted(p for p in out.glob("*.mp4") if p.is_file() and p.stat().st_size>1_000_000)
          if not videos:
              raise SystemExit("H2 mix step produced no final MP4 in the project out directory.")
          video=max(videos,key=lambda p:p.stat().st_mtime)
          probe=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_entries",
              "format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels",
              "-of","json",str(video)
          ],text=True))
          streams=probe.get("streams",[])
          v=next((x for x in streams if x.get("codec_type")=="video"),None)
          a=next((x for x in streams if x.get("codec_type")=="audio"),None)
          duration=float(probe.get("format",{}).get("duration",0))
          if not v or not a: raise SystemExit("Candidate must have both video and audio.")
          if (v.get("codec_name"),v.get("width"),v.get("height"),v.get("r_frame_rate"))!=("h264",1920,1080,"24/1"):
              raise SystemExit(f"Unexpected candidate video metadata: {v}")
          if (a.get("codec_name"),a.get("sample_rate"),a.get("channels"))!=("aac","48000",2):
              raise SystemExit(f"Unexpected candidate audio metadata: {a}")
          if abs(duration-155.0)>0.5:
              raise SystemExit(f"Unexpected candidate duration: {duration}")
          target=Path("/tmp/h2-review-v3/payload/one-more-scroll-h2-source-v3-shoelace-fix-candidate.mp4")
          shutil.copy2(video,target)
          h=hashlib.sha256()
          with target.open("rb") as f:
              for block in iter(lambda:f.read(4*1024*1024),b""): h.update(block)
          report={
              "project_id":"one-more-scroll",
              "status":"technical_render_and_stream_validation_passed",
              "source_revision":"source-v2 archive plus deterministic source-v3 shoelace pose patch",
              "source_archive":"one-more-scroll-h2-source-v2-scene-fixes.zip",
              "source_patch":"tools/video/patch_h2_shoelace_scene.py",
              "source_patch_sha256":hashlib.sha256((Path(os.environ["GITHUB_WORKSPACE"])/"tools/video/patch_h2_shoelace_scene.py").read_bytes()).hexdigest(),
              "source_archive_sha256":"b8db965db214bf0e37b307d3fe1aa663c55f29ee753fd9103a5972b5fe633014",
              "source_story":"31 shots / 155 seconds",
              "candidate_file":target.name,
              "candidate_size_bytes":target.stat().st_size,
              "candidate_sha256":h.hexdigest(),
              "duration_seconds":duration,
              "video":v,"audio":a,
              "render_command":"node render.mjs --project projects/one-more-scroll-h2 --workers 4 --crf 18 --gl swiftshader",
              "pose_timeline":"kneel 0.0s, knees 0.25s, tying motion 0.55–3.7s alternating tieShoes/tieShoesAlt, kneel 3.7–5.0s",
              "mix_command":"python tools/mix.py --project projects/one-more-scroll-h2",
              "full_render":True,
              "technical_validation":True,
              "artistic_signoff":"pending human review of full motion, shoe-to-hand contact, close-up pacing, sound sync and emotional arc",
              "is_canonical_master":False,
              "note":"Source-v3 is the immutable source-v2 archive plus tools/video/patch_h2_shoelace_scene.py. The shoe-tying gesture has a forward lean and alternating hand angles; keep the verified canonical master unchanged until visual/motion QA is explicitly approved."
          }
          Path("/tmp/h2-review-v3/payload/h2-source-v3-render-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Measure final candidate audio with EBU R128
        run: |
          set -euo pipefail
          CANDIDATE="/tmp/h2-review-v3/payload/one-more-scroll-h2-source-v3-shoelace-fix-candidate.mp4"
          ffmpeg -hide_banner -nostats -i "$CANDIDATE" -filter_complex ebur128=peak=true -f null - 2>&1 | tee /tmp/h2-review-v3/h2-audio-ebur128.log
          python - <<'PY'
          import json, re
          from pathlib import Path
          log=Path("/tmp/h2-review-v3/h2-audio-ebur128.log").read_text(errors="replace")
          summary=log.rsplit("Summary:",1)[-1]
          def capture(pattern, label):
              match=re.search(pattern,summary,re.S)
              if not match: raise SystemExit("Could not parse EBU R128 "+label+" from FFmpeg output")
              return float(match.group(1))
          stats={
              "method":"FFmpeg ebur128=peak=true run on the exact source-v3 candidate MP4",
              "integrated_loudness_lufs":capture(r"Integrated loudness:\s*I:\s*(-?\d+(?:\.\d+)?)\s+LUFS","integrated loudness"),
              "loudness_range_lu":capture(r"LRA:\s*(-?\d+(?:\.\d+)?)\s+LU","loudness range"),
              "true_peak_dbfs":capture(r"True peak:\s*Peak:\s*(-?\d+(?:\.\d+)?)\s+dBFS","true peak")
          }
          report_path=Path("/tmp/h2-review-v3/payload/h2-source-v3-render-report.json")
          report=json.loads(report_path.read_text())
          report["audio_measurement"]=stats
          report_path.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(stats,indent=2))
          PY

      - name: Create review bundle and publish the candidate as a separate Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/h2-review-v3
          cp h2-browser-check.log h2-contact-sheet.log h2-audio-generation.log h2-full-render.log h2-audio-mix.log h2-audio-ebur128.log payload/
          (cd payload && sha256sum *.jpg *.mp4 *.json patch_h2_shoelace_scene.py > SHA256SUMS.txt)
          zip -qr h2-source-v3-shoelace-fix-review.zip payload
          zip -T h2-source-v3-shoelace-fix-review.zip
          gh release upload h2-production-assets-v1 \
            /tmp/h2-review-v3/payload/one-more-scroll-h2-source-v3-shoelace-fix-candidate.mp4 \
            /tmp/h2-review-v3/h2-source-v3-shoelace-fix-review.zip \
            --repo Nolane-x/video --clobber
          gh api "repos/Nolane-x/video/releases/tags/h2-production-assets-v1" > /tmp/h2-review-v3/release-api.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/h2-review-v3/release-api.json").read_text())
          assets={x["name"]:x for x in data["assets"]}
          required=["one-more-scroll-h2-source-v3-shoelace-fix-candidate.mp4","h2-source-v3-shoelace-fix-review.zip"]
          missing=[n for n in required if n not in assets]
          if missing: raise SystemExit(f"Candidate release assets missing: {missing}")
          print("Candidate and review ZIP published to " + data["html_url"])
          for n in required: print(assets[n]["browser_download_url"])
          PY

      - name: Upload short-retention convenience artifact
        uses: actions/upload-artifact@v5
        with:
          name: h2-source-v3-shoelace-fix-review
          path: /tmp/h2-review-v3/
          if-no-files-found: error
          retention-days: 30
