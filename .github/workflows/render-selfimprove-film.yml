name: Render H2 SelfImprove — The First Hour

on:
  push:
    branches: [main]
    paths:
      - "video-projects/h2-selfimprove/the-first-hour/**"
      - "video-projects/h2-selfimprove/01-PHIM-the-first-hour.txt"
      - ".github/workflows/render-selfimprove-film.yml"
      - "integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h2-selfimprove-the-first-hour-v2
  cancel-in-progress: false

jobs:
  render-film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout H2 source and project
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify system render dependencies
        run: |
          set -euo pipefail
          missing=0
          for bin in ffmpeg zip unzip; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing system dependency: $bin"
              missing=1
            else
              "$bin" -version 2>/dev/null | head -n 1 || true
            fi
          done
          if [ "$missing" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg zip unzip
          fi
      - name: Set up Node and Python
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native H2 kit dependencies
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install chromium
          python -m pip install numpy scipy soundfile
          python audio/build_audio.py
      - name: Generate H2 story from approved 01-PHIM script
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          python tools/phim.py --project projects/the-first-hour --phim ../../../../../video-projects/h2-selfimprove/01-PHIM-the-first-hour.txt --force
          cp ../../../../../video-projects/h2-selfimprove/the-first-hour/config.json projects/the-first-hour/config.json
          cp ../../../../../video-projects/h2-selfimprove/the-first-hour/story/bible.md projects/the-first-hour/story/bible.md
          python ../../../../../video-projects/h2-selfimprove/the-first-hour/tune_story.py projects/the-first-hour/story/shots.json
          python - <<'PY'
          import json
          from pathlib import Path
          project = Path("projects/the-first-hour")
          story_path = project / "story/shots.json"
          story = json.loads(story_path.read_text(encoding="utf-8"))
          patch_path = Path("../../../../../video-projects/h2-selfimprove/the-first-hour/shot-overrides.json")
          patch = json.loads(patch_path.read_text(encoding="utf-8"))
          shots = {s["id"]: s for s in story["shots"]}
          expected = {f"b{i:02d}" for i in range(1, 30)}
          assert set(shots) == expected, "The 29 source shot IDs drifted"
          assert set(patch["shots"]) == expected, "Shot override coverage must be exact"
          assert len(shots) == 29
          for shot_id, override in patch["shots"].items():
              shot = shots[shot_id]
              shot["tpl"] = override["tpl"]
              shot["args"] = override["args"]
              if "in" in override:
                  shot["in"] = override["in"]
          duration = float(patch["duration"])
          assert duration == 172.0
          assert abs(float(story["shots"][-1]["start"]) - (duration - 6.0)) < 0.01
          story["shots"][-1]["end"] = duration
          story["duration"] = duration
          # Preserve the approved script text while ensuring every overlay fits its shot.
          for shot in story["shots"]:
              shot_duration = float(shot["end"]) - float(shot["start"])
              for tx in shot.get("args", {}).get("texts", []):
                  at = float(tx.get("at", 0.3))
                  dur = float(tx.get("dur", shot_duration - at - 0.1))
                  assert at >= 0 and dur > 0 and at + dur <= shot_duration + 0.02, (
                      f"{shot['id']} caption outside shot: {tx.get('t')!r}, at={at}, dur={dur}, shot={shot_duration}"
                  )
          # Production regression checks: the errors found in the first render must not return.
          by_id = {s["id"]: s for s in story["shots"]}
          assert by_id["b11"]["args"].get("messages", [{}])[0].get("text") == "still coming tonight?"
          assert by_id["b17"]["args"].get("messages", [{}])[0].get("text") == "miss you, man. coffee today?"
          assert by_id["b20"]["tpl"] == "note" and "ONE TASK." in by_id["b20"]["args"].get("text", "") and "TEN MINUTES." in by_id["b20"]["args"].get("text", "")
          assert shots["b03"]["tpl"] == "clock" and shots["b03"]["args"].get("reach") is True, "Alarm-hand hesitation insert is missing"
          assert shots["b06"]["args"].get("actors", [{}])[0].get("x") == "desk.seat", "Hero is not staged at the desk in B06"
          assert shots["b12"]["tpl"] == "laptop", "Rejection email must be shown on a laptop, not a phone"
          assert shots["b21"]["args"].get("actors", [{}])[0].get("pose") == "type", "Typing action is missing"
          assert shots["b22"]["tpl"] == "scene" and shots["b22"]["args"].get("setArgs", {}).get("phoneOnDesk"), "Desk phone interaction is missing"
          assert shots["b23"]["args"].get("setArgs", {}).get("phoneOnDesk", {}).get("slide"), "Phone-slide-away action is missing"
          assert any(p[1] == "punch" for p in shots["b25"]["args"].get("actors", [{}])[0].get("poseAt", [])), "Punch action is missing"
          assert shots["b25"]["args"].get("setArgs", {}).get("impacts") == [1.05, 2.7], "Punch impact timing is missing"
          assert shots["b25"]["args"].get("setArgs", {}).get("impactSwing", 0) >= 0.25, "Punch-bag recoil is too subtle"
          pulses = [f for f in shots["b25"]["args"].get("fx", []) if f.get("kind") == "speed" and f.get("dur", 99) < 0.5]
          assert len(pulses) == 2, "Punch speed accents must be short and impact-timed"
          assert shots["b26"]["args"].get("setArgs", {}).get("tableW") == 0.26, "Cafe staging is missing"
          assert shots["b15"]["args"].get("hud", {}).get("rows", [{}])[0].get("reset", {}).get("to") == 0, "DAY reset is missing"
          assert by_id["b26"]["args"].get("set") == "cafe" and len(by_id["b26"]["args"].get("actors", [])) >= 2
          assert any(p[1] == "punch" for p in by_id["b25"]["args"].get("actors", [{}])[0].get("poseAt", [])), "Workout action is missing"
          assert by_id["b21"]["args"].get("setArgs", {}).get("laptop") is True, "Work prop is missing"
          assert by_id["b29"]["tpl"] == "scene", "End card must not use a simulated platform UI"
          assert "voice" not in [a.get("who") for a in by_id["b16"]["args"].get("actors", [])], "Shadow must be absent at the turning point"
          t1, t2 = by_id["b15"]["args"]["texts"]
          assert t1["at"] + t1["dur"] <= t2["at"], "B15 title text overlaps"
          previous_end = 0.0
          for shot in story["shots"]:
              assert abs(float(shot["start"]) - previous_end) < 0.01, f"Timeline gap/overlap before {shot['id']}"
              assert float(shot["end"]) > float(shot["start"]), f"Invalid duration for {shot['id']}"
              previous_end = float(shot["end"])
          assert abs(previous_end - duration) < 0.01
          story_path.write_text(json.dumps(story, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          config_path = project / "config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["duration"] = duration
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"ART-DIRECTION QA PASS: 29 curated shots; {duration:.1f}s; message/contact, workout, café, turning-point, ending, caption and timeline guards passed")
          PY
      - name: Validate full timeline and render contact sheets
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          node render.mjs --project projects/the-first-hour --check --scale 0.25
          node render.mjs --project projects/the-first-hour --sheet --scale 0.5 --at 0.75
      - name: Build music and SFX mix, then render 30-second audio preview
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          python tools/mix.py --project projects/the-first-hour --no-video
          node render.mjs --project projects/the-first-hour --from 0 --to 30 --scale 0.5
      - name: Full H2 silent render
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          node render.mjs --project projects/the-first-hour --workers 4 --crf 18
      - name: Mix mastered audio into final MP4
        working-directory: integrations/h2-selfimprove-studio/skills/lam-video-selfimprove/kit
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/the-first-hour"
          python tools/mix.py --project projects/the-first-hour
          cp projects/the-first-hour/out/*.mp4 "$GITHUB_WORKSPACE/dist/the-first-hour/the-first-hour-h2-selfimprove.mp4"
          cp projects/the-first-hour/build/preview.mp4 "$GITHUB_WORKSPACE/dist/the-first-hour/preview-30s.mp4"
          cp projects/the-first-hour/story/shots.json "$GITHUB_WORKSPACE/dist/the-first-hour/shots.json"
          cp ../../../../../video-projects/h2-selfimprove/the-first-hour/shot-overrides.json "$GITHUB_WORKSPACE/dist/the-first-hour/shot-overrides.json"
          cp projects/the-first-hour/story/bible.md "$GITHUB_WORKSPACE/dist/the-first-hour/bible.md"
          cp projects/the-first-hour/config.json "$GITHUB_WORKSPACE/dist/the-first-hour/config.json"
          cp ../../../../../video-projects/h2-selfimprove/01-PHIM-the-first-hour.txt "$GITHUB_WORKSPACE/dist/the-first-hour/01-PHIM-the-first-hour.txt"
          cp projects/the-first-hour/build/sheets/*.jpg "$GITHUB_WORKSPACE/dist/the-first-hour/"
          ffprobe -v error -show_streams -show_format -of json "$GITHUB_WORKSPACE/dist/the-first-hour/the-first-hour-h2-selfimprove.mp4" > "$GITHUB_WORKSPACE/dist/the-first-hour/ffprobe.json"
          ffmpeg -hide_banner -nostats -i "$GITHUB_WORKSPACE/dist/the-first-hour/the-first-hour-h2-selfimprove.mp4" -af ebur128=peak=true -f null - 2> "$GITHUB_WORKSPACE/dist/the-first-hour/ebur128.log"
          mkdir -p "$GITHUB_WORKSPACE/dist/the-first-hour/proofs"
          VIDEO="$GITHUB_WORKSPACE/dist/the-first-hour/the-first-hour-h2-selfimprove.mp4"
          PROOFS="$GITHUB_WORKSPACE/dist/the-first-hour/proofs"
          for spec in \
            "b03-alarm-hesitation:10" \
            "b06-desk-temptation:28" \
            "b12-laptop-rejection:64" \
            "b16-morning-turn:88" \
            "b19-walk-to-desk:106" \
            "b21-typing:118" \
            "b22-vibrating-phone:124" \
            "b23-phone-pushed-away:130" \
            "b25-punch-bag-impact:142" \
            "b26-cafe-reunion:148" \
            "b27-shadow-recedes:154"; do
            name="\${spec%%:*}"
            start="\${spec##*:}"
            ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$VIDEO" -t 6 \
              -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart "$PROOFS/$name.mp4"
          done
          cat > "$GITHUB_WORKSPACE/dist/the-first-hour/MOTION-PROOFS.md" <<'EOF'
          # The First Hour — motion proof index

          These six-second samples are cut from the actual mastered H2 render, including its sound:

          | Proof | Timeline position | What to inspect |
          |---|---:|---|
          | b03-alarm-hesitation | 00:10 | Hand approaches and hesitates at the alarm |
          | b06-desk-temptation | 00:28 | Character is staged at the laptop while temptation appears |
          | b12-laptop-rejection | 01:04 | Rejection is legible on the laptop insert |
          | b16-morning-turn | 01:28 | Morning reset and warm window light |
          | b19-walk-to-desk | 01:46 | Actor walks from bed to the work area |
          | b21-typing | 01:58 | Repeated hand movement reads as typing |
          | b22-vibrating-phone | 02:04 | Desk phone vibrates while the character keeps working |
          | b23-phone-pushed-away | 02:10 | Phone slides away and the actor returns to work |
          | b25-punch-bag-impact | 02:22 | Punch timing, bag reaction and recovery pose |
          | b26-cafe-reunion | 02:28 | Two characters face each other in a staged café |
          | b27-shadow-recedes | 02:34 | The temptation becomes smaller and recedes |

          Technical source: H2 SelfImprove Studio Canvas/Chromium render, then FFmpeg audio master.
          These clips support motion review; their presence is not an artistic sign-off by itself.
          EOF
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path("dist/the-first-hour/proofs")
          proofs = sorted(root.glob("*.mp4"))
          assert len(proofs) == 11, f"Expected 11 motion proofs, got {len(proofs)}"
          for clip in proofs:
              meta = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(clip)
              ], text=True))
              video = [s for s in meta["streams"] if s.get("codec_type") == "video"]
              audio = [s for s in meta["streams"] if s.get("codec_type") == "audio"]
              duration = float(meta["format"]["duration"])
              assert video and audio, f"Motion proof has no audio/video stream: {clip.name}"
              assert 5.75 <= duration <= 6.20, f"Unexpected proof duration {duration}: {clip.name}"
          print(f"MOTION PROOFS PASS: {len(proofs)} audio/video clips, each approximately 6 seconds")
          PY
          (cd "$GITHUB_WORKSPACE/dist/the-first-hour" && sha256sum *.mp4 *.json *.txt *.md *.jpg *.log proofs/*.mp4 > SHA256SUMS.txt)
          cd "$GITHUB_WORKSPACE"
          zip -qr dist/the-first-hour-review.zip dist/the-first-hour
      - name: Validate exported MP4 and report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dist/the-first-hour/ffprobe.json")
          d=json.loads(p.read_text())
          v=[s for s in d["streams"] if s.get("codec_type")=="video"]
          a=[s for s in d["streams"] if s.get("codec_type")=="audio"]
          assert v and a, "Final MP4 must contain both video and audio streams"
          assert int(v[0]["width"])==1920 and int(v[0]["height"])==1080, f"Unexpected resolution: {v[0].get('width')}x{v[0].get('height')}"
          assert abs(float(d["format"]["duration"])-172.0)<0.15, f"Unexpected runtime: {d['format']['duration']}"
          assert v[0].get("r_frame_rate") == "24/1", f"Unexpected frame rate: {v[0].get('r_frame_rate')}"
          assert a[0].get("sample_rate") == "48000" and int(a[0].get("channels", 0)) == 2, "Audio must be 48 kHz stereo"
          log=Path("dist/the-first-hour/ebur128.log").read_text(errors="replace")
          import re
          m_i=re.search(r"^\s*I:\s*(-?[0-9]+\.[0-9]+)\s*LUFS\s*$", log, re.M)
          m_p=re.search(r"^\s*Peak:\s*(-?[0-9]+\.[0-9]+)\s*dBFS\s*$", log, re.M)
          assert m_i and m_p, "EBU R128 summary is missing integrated loudness or peak"
          integrated=float(m_i.group(1)); peak=float(m_p.group(1))
          assert -15.0 <= integrated <= -13.0, f"Integrated loudness outside -14 LUFS ±1: {integrated}"
          assert peak <= -1.0, f"True peak ceiling exceeded (-1.0 dBFS): {peak}"
          print(f"PASS: {float(d['format']['duration']):.3f}s; {v[0]['codec_name']} {v[0]['width']}x{v[0]['height']} @ {v[0].get('r_frame_rate')}; audio={a[0]['codec_name']} {a[0].get('sample_rate')}Hz stereo; I={integrated:.1f} LUFS; peak={peak:.1f} dBFS")
          PY
      - name: Upload video, preview and QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: the-first-hour-h2-selfimprove-${{ github.run_number }}
          path: |
            dist/the-first-hour/the-first-hour-h2-selfimprove.mp4
            dist/the-first-hour-review.zip
            dist/the-first-hour/
          if-no-files-found: error
          retention-days: 30
