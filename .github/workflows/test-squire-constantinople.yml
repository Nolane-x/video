name: Test Squire Constantinople production helpers

on:
  push:
    branches:
      - squire/constantinople-1453-240fps
      - squire/constantinople-1453-musicfix
      - squire/constantinople-1453-redesign
      - fix/squire-master-blender-3d-insert
    paths:
      - '.github/workflows/test-squire-constantinople.yml'
      - '.github/workflows/squire-constantinople-1453.yml'
      - '.github/workflows/squire-constantinople-segmented-master.yml'
      - '.github/workflows/audit-squire-opening-review.yml'
      - '.github/workflows/squire-constantinople-redesign-proof.yml'
      - 'video-projects/squire/constantinople-1453/reuse-voice-run.json'
      - 'tools/video/import_squire_constantinople_foley.py'
      - 'tools/video/author_squire_constantinople.py'
      - 'tools/video/splice_constantinople_hybrid_insert.py'
      - 'tests/test_squire_constantinople.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-squire-constantinople-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate production workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color .github/workflows/squire-constantinople-1453.yml .github/workflows/squire-constantinople-segmented-master.yml .github/workflows/audit-squire-opening-review.yml .github/workflows/squire-constantinople-redesign-proof.yml .github/workflows/test-squire-constantinople.yml
      - name: Compile and run Squire production regression tests
        run: |
          set -euo pipefail
          python -m py_compile tools/video/author_squire_constantinople.py tools/video/import_squire_constantinople_foley.py tools/video/splice_constantinople_hybrid_insert.py tests/test_squire_constantinople.py
          python tests/test_squire_constantinople.py
