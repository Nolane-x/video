name: Time Stop 10s — motion-interpolated 60fps master

on:
  push:
    branches:
      - film/time-stop-10s-3d-cinema
    paths:
      - ".github/workflows/enable-time-stop-60fps.txt"
      - ".github/workflows/render-time-stop-60fps.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: time-stop-10s-60fps-pinned-ffmpeg-v3
  cancel-in-progress: false

jobs:
  interpolate:
    name: Create and verify 1080p 60fps master
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Download the QA-passed 30fps master from the film render
        uses: actions/download-artifact@v4
        with:
          name: time-stop-10s-h2-18
          repository: ${{ github.repository }}
          run-id: 44511459706
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate

      - name: Install checksum-pinned FFmpeg and ffprobe without APT
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz"
          ARCHIVE_SHA256="68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269"
          FFMPEG_SHA256="0d709a0bed1a43f24cd2c420878c63afea4580671b6949ad19ed124572f3bc3d"
          ARCHIVE="$RUNNER_TEMP/ffmpeg-linux64-gpl.tar.xz"
          EXTRACT_DIR="$RUNNER_TEMP/time-stop-ffmpeg"
          mkdir -p "$EXTRACT_DIR"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 "$URL" -o "$ARCHIVE"
          echo "$ARCHIVE_SHA256  $ARCHIVE" | sha256sum --check -
          echo "Archive members:"
          tar -tJf "$ARCHIVE" | grep -E '(^|/)bin/(ffmpeg|ffprobe)$' | head -n 8
          tar -xJf "$ARCHIVE" -C "$EXTRACT_DIR"
          FFMPEG_BIN="$(find "$EXTRACT_DIR" -type f -name ffmpeg -print -quit)"
          FFPROBE_BIN="$(find "$EXTRACT_DIR" -type f -name ffprobe -print -quit)"
          test -n "$FFMPEG_BIN"
          test -n "$FFPROBE_BIN"
          chmod +x "$FFMPEG_BIN" "$FFPROBE_BIN"
          echo "$FFMPEG_SHA256  $FFMPEG_BIN" | sha256sum --check -
          "$FFMPEG_BIN" -hide_banner -version | head -n 1
          "$FFPROBE_BIN" -hide_banner -version | head -n 1
          "$FFMPEG_BIN" -hide_banner -filters 2>/dev/null | grep -w minterpolate
          "$FFMPEG_BIN" -hide_banner -encoders 2>/dev/null | grep -w libx264
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> "$GITHUB_ENV"

      - name: Motion-compensated 30-to-60fps interpolation
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          INPUT="$(find candidate -type f -name 'time-stop-10s-master.mp4' -print -quit)"
          test -n "$INPUT"
          test -s "$INPUT"
          mkdir -p dist/time-stop-10s-60fps
          OUTPUT="dist/time-stop-10s-60fps/time-stop-10s-master-60fps.mp4"
          sha256sum "$INPUT" > dist/time-stop-10s-60fps/source-master.sha256
          "$FFMPEG_BIN" -hide_banner -y -i "$INPUT" \
            -map 0:v:0 -map 0:a:0? \
            -vf "minterpolate=fps=60:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1:scd=fdiff:scd_threshold=10" \
            -fps_mode cfr -c:v libx264 -preset fast -crf 18 \
            -maxrate 18M -bufsize 36M -pix_fmt yuv420p \
            -c:a copy -movflags +faststart "$OUTPUT"
          test -s "$OUTPUT"
          "$FFMPEG_BIN" -hide_banner -v error -i "$OUTPUT" -map 0:v:0 -f null - \
            2> dist/time-stop-10s-60fps/decode-check.log
          "$FFPROBE_BIN" -v error -count_frames -show_streams -show_format -of json \
            "$OUTPUT" > dist/time-stop-10s-60fps/ffprobe.json
          "$FFMPEG_BIN" -hide_banner -loglevel error -y -i "$OUTPUT" -t 30 \
            -c:v libx264 -preset veryfast -crf 21 -c:a aac -b:a 160k \
            -movflags +faststart dist/time-stop-10s-60fps/preview-60fps-30s.mp4
          "$FFMPEG_BIN" -hide_banner -loglevel error -y -i "$OUTPUT" \
            -vf "fps=1/5,scale=480:-1,tile=4x5" -frames:v 1 \
            dist/time-stop-10s-60fps/contact-sheet-60fps.jpg

      - name: Verify duration, resolution, frame rate, exact frame count and audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dist/time-stop-10s-60fps/ffprobe.json")
          data = json.loads(p.read_text())
          streams = data["streams"]
          v = next(s for s in streams if s.get("codec_type") == "video")
          a = next(s for s in streams if s.get("codec_type") == "audio")
          duration = float(data["format"]["duration"])
          assert (int(v["width"]), int(v["height"])) == (1920, 1080)
          assert v.get("r_frame_rate") == "60/1", v.get("r_frame_rate")
          assert v.get("avg_frame_rate") == "60/1", v.get("avg_frame_rate")
          assert abs(duration - 378.0) < 0.25, duration
          assert a.get("codec_name") == "aac"
          assert a.get("sample_rate") == "48000"
          assert int(a.get("channels", 0)) == 2
          frames = int(v.get("nb_read_frames", v.get("nb_frames", 0)))
          assert frames == 22680, frames
          report = {
              "status": "technical-pass",
              "source_fps": "30/1",
              "output_fps": "60/1",
              "motion_interpolation": "minterpolate-mci-aobmc-bidir-scd-fdiff",
              "duration_seconds": duration,
              "frames": frames,
              "resolution": [1920, 1080],
              "audio": "AAC 48kHz stereo (copied unchanged in master)",
              "scene_cut_detection": "enabled; reduces motion-vector blending across hard cuts",
              "decode_check": "full video stream decoded without FFmpeg errors",
              "note": "Motion-compensated 60fps interpolation, not a native 60fps scene render. Optical-flow artifacts still require visual review."
          }
          Path("dist/time-stop-10s-60fps/qa-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
          cd dist/time-stop-10s-60fps
          sha256sum *.mp4 *.json *.log > SHA256SUMS.txt

      - name: Upload motion-interpolated 60fps edition and visual review data
        uses: actions/upload-artifact@v4
        with:
          name: time-stop-10s-60fps-motion-interpolated
          path: dist/time-stop-10s-60fps/
          if-no-files-found: error
          retention-days: 30
