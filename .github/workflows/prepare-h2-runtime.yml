name: Prepare H2 Studio runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install exact H2 Studio browser/runtime dependencies
        run: |
          mkdir h2-runtime
          cd h2-runtime
          cat > package.json <<'JSON'
          {
            "name": "h2-2d-studio-runtime",
            "version": "0.2.0",
            "private": true,
            "type": "module",
            "dependencies": {
              "@fontsource/baloo-2": "5.1.0",
              "@fontsource/be-vietnam-pro": "5.1.0",
              "@fontsource/caveat": "5.2.5",
              "@fontsource/comic-neue": "5.2.5",
              "@fontsource/lora": "5.1.0",
              "@fontsource/luckiest-guy": "5.2.5",
              "@fontsource/patrick-hand": "5.2.8",
              "playwright": "1.56.0",
              "three": "0.169.0",
              "topojson-client": "3.1.0",
              "world-atlas": "2.0.2"
            }
          }
          JSON
          npm install --no-audit --no-fund
          cd ..
          zip -qr h2-node-modules.zip h2-runtime/node_modules
          sha256sum h2-node-modules.zip | tee h2-node-modules.sha256

      - name: Upload H2 runtime for offline rendering workspace
        uses: actions/upload-artifact@v4
        with:
          name: h2-studio-node-runtime
          path: |
            h2-node-modules.zip
            h2-node-modules.sha256
          if-no-files-found: error
          retention-days: 7
