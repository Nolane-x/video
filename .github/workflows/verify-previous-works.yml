name: Verify previous AI video assets

on:
  push:
    branches: [main]
    paths:
      - "video-library/previous-works/**"
      - "video-library/previous-works-catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-previous-video-assets
  cancel-in-progress: false

jobs:
  verify-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify binaries and finalize catalog
        env:
          VERIFY_RUN_ID: ${{ github.run_id }}
          VERIFY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, os, subprocess
          from pathlib import Path

          catalog_path = Path("video-library/previous-works-catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          verified = []
          for asset in catalog.get("assets", []):
              if not asset.get("archive_enabled") or not asset.get("repository_path"):
                  continue
              if str(asset.get("storage_status", "")).startswith("archived in GitHub and verified"):
                  continue
              video = Path(asset["repository_path"])
              if not video.is_file():
                  raise SystemExit(f"Catalog points to missing video: {video}")
              h = hashlib.sha256()
              with video.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(block)
              sha = h.hexdigest()
              expected = asset.get("sha256")
              size = video.stat().st_size
              if sha != expected:
                  raise SystemExit(f"{video}: SHA-256 mismatch: {sha} != {expected}")
              if size != int(asset["size_bytes"]):
                  raise SystemExit(f"{video}: size mismatch: {size} != {asset['size_bytes']}")

              probe = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels",
                  "-of", "json", str(video)
              ], text=True))
              streams = probe.get("streams", [])
              v = next((s for s in streams if s.get("codec_type") == "video"), None)
              a = next((s for s in streams if s.get("codec_type") == "audio"), None)
              duration = float(probe.get("format", {}).get("duration", 0))
              if not v or not a:
                  raise SystemExit(f"{video}: missing video/audio stream")
              if (v.get("width"), v.get("height"), v.get("r_frame_rate")) != (1280, 720, "24/1"):
                  raise SystemExit(f"{video}: unexpected video stream {v}")
              if (a.get("codec_name"), a.get("sample_rate"), a.get("channels")) != ("aac", "48000", 2):
                  raise SystemExit(f"{video}: unexpected audio stream {a}")
              if abs(duration - float(asset["duration_seconds"])) > 0.25:
                  raise SystemExit(f"{video}: duration mismatch {duration}")

              directory = video.parent
              interval = max(1, math.ceil(duration / 32))
              contact = directory / "contact-sheet.jpg"
              overview = directory / "overview-sheet.jpg"
              metadata = directory / "metadata.json"
              sidecar = directory / (video.name + ".sha256")
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(video),
                  "-vf", f"fps=1/{interval},scale=320:-1,tile=4x8", "-frames:v", "1", str(contact)
              ], check=True)
              overview_interval = max(1, round(duration / 16))
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(video),
                  "-vf", f"fps=1/{overview_interval},scale=320:-1,tile=4x4", "-frames:v", "1", str(overview)
              ], check=True)
              sidecar.write_text(f"{sha}  {video.name}\n", encoding="utf-8")
              details = {
                  "asset_id": asset["id"], "filename": video.name,
                  "sha256": sha, "size_bytes": size, "duration_seconds": duration,
                  "video": v, "audio": a,
                  "verified_by_workflow_run_id": os.environ["VERIFY_RUN_ID"],
                  "verification_run_url": os.environ["VERIFY_RUN_URL"]
              }
              metadata.write_text(json.dumps(details, indent=2) + "\n", encoding="utf-8")
              asset.update({
                  "storage_status": "archived in GitHub and verified by workflow run " + os.environ["VERIFY_RUN_ID"],
                  "archive_status": "archived_in_github_verified",
                  "verified_by_workflow_run_id": os.environ["VERIFY_RUN_ID"],
                  "verification_run_url": os.environ["VERIFY_RUN_URL"],
                  "metadata_path": str(metadata).replace("\\", "/"),
                  "contact_sheet_path": str(contact).replace("\\", "/"),
                  "overview_sheet_path": str(overview).replace("\\", "/"),
                  "fresh_probe": {
                      "duration_seconds": duration, "width": v["width"], "height": v["height"],
                      "fps": v["r_frame_rate"], "video_codec": v["codec_name"],
                      "audio_codec": a["codec_name"], "audio_sample_rate_hz": int(a["sample_rate"]),
                      "audio_channels": a["channels"]
                  }
              })
              verified.append((video, sidecar, contact, overview, metadata))
              print(f"Verified {asset['id']}: {duration:.2f}s, {size:,} bytes, sha256={sha}")

          if not verified:
              raise SystemExit("No staged previous-work assets found in the catalog. Run archive_previous_works.py and push its staged files first.")
          catalog["last_verification"] = {
              "workflow_run_id": os.environ["VERIFY_RUN_ID"],
              "workflow_run_url": os.environ["VERIFY_RUN_URL"],
              "verified_asset_ids": [asset["id"] for asset in catalog["assets"] if asset.get("verified_by_workflow_run_id") == os.environ["VERIFY_RUN_ID"]]
          }
          catalog_path.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit verification evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f video-library/previous-works
          git add video-library/previous-works-catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already verified."
            exit 0
          fi
          git commit -m "build: verify previous AI video assets and contact sheets"
          git push origin HEAD:main
