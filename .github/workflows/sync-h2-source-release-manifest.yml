name: Sync H2 source release manifest

on:
  push:
    branches: [main]
    paths:
      - "video-library/one-more-scroll/h2-source-release.json"

permissions:
  contents: write

concurrency:
  group: sync-h2-source-release-manifest
  cancel-in-progress: false

jobs:
  sync-release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate source-release manifest and upload updated Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("video-library/one-more-scroll/h2-source-release.json").read_text())
          assert data.get("release_tag")=="h2-production-assets-v1"
          assert data.get("status")=="uploaded_to_github_release_and_checksum_verified"
          names={x.get("filename") for x in data.get("assets",[])}
          required={
            "one-more-scroll-h2-final.mp4",
            "one-more-scroll-h2-source.zip",
            "one-more-scroll-h2-source-v2-scene-fixes.zip",
            "one-more-scroll-h2-source-v2-render-candidate.mp4",
            "h2-source-v2-render-review.zip",
            "one-more-scroll-h2-source-v3-shoelace-fix-candidate.mp4",
            "h2-source-v3-shoelace-fix-review.zip"
          }
          missing=required-names
          if missing: raise SystemExit("Source-release manifest is missing assets: "+", ".join(sorted(missing)))
          candidate=data["source_v2_render_candidate"]
          assert candidate.get("status")=="technical_render_and_stream_validation_passed"
          assert candidate.get("is_canonical_master") is False
          candidate3=data.get("source_v3_render_candidate", {})
          assert candidate3.get("status")=="technical_render_and_stream_validation_passed"
          assert candidate3.get("is_canonical_master") is False
          assert candidate3.get("candidate_filename")=="one-more-scroll-h2-source-v3-shoelace-fix-candidate.mp4"
          assert candidate3.get("review_bundle_filename")=="h2-source-v3-shoelace-fix-review.zip"
          assert candidate3.get("patch_commit")=="05a2027cebdc83cedc1002992198d9404f253647"
          print("Source-release manifest is valid; source-v2 and source-v3 candidates remain separate from the canonical master.")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("video-library/one-more-scroll/h2-source-release.json").read_text())
          lines=[]
          for item in sorted(data.get("assets",[]), key=lambda x:x.get("filename","")):
              sha=item.get("sha256")
              name=item.get("filename")
              if sha and name: lines.append(f"{sha}  {name}")
          if not lines: raise SystemExit("No checksum-verified release assets found in the source manifest.")
          Path("SHA256SUMS.txt").write_text("\\n".join(lines)+"\\n")
          print(f"Generated Release SHA256SUMS.txt for {len(lines)} manifest assets.")
          PY
          gh release upload h2-production-assets-v1 \
            video-library/one-more-scroll/h2-source-release.json SHA256SUMS.txt \
            --repo Nolane-x/video --clobber
          gh api repos/Nolane-x/video/releases/tags/h2-production-assets-v1 > /tmp/h2-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          local=Path("video-library/one-more-scroll/h2-source-release.json")
          remote=json.loads(Path("/tmp/h2-release.json").read_text())
          assets={a["name"]:a for a in remote["assets"]}
          if "h2-source-release.json" not in assets:
              raise SystemExit("Updated source-release manifest is missing from GitHub Release.")
          if assets["h2-source-release.json"]["size"] != local.stat().st_size:
              raise SystemExit("Uploaded source-release manifest size does not match the local authoritative file.")
          data=json.loads(local.read_text())
          for item in data.get("assets",[]):
              expected=item.get("sha256")
              remote=assets.get(item.get("filename",""),{}).get("digest")
              if expected and remote and remote.removeprefix("sha256:") != expected:
                  raise SystemExit(f"Release SHA-256 differs from manifest for {item['filename']}: {remote} != {expected}")
          if "SHA256SUMS.txt" not in assets: raise SystemExit("Updated Release checksum list is missing.")
          print("Uploaded source manifest and checksum list; release digests match the manifest.")
          print("Updated Release manifest URL:",assets["h2-source-release.json"]["browser_download_url"])
          PY
