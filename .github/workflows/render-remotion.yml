name: Render Remotion video

on:
  push:
    branches: [main]
    paths:
      - "video-projects/remotion/**"
      - ".github/workflows/render-remotion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: video-projects/remotion
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python for H2 audio
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Remotion dependencies
        run: npm install --no-audit --no-fund

      - name: Install procedural audio dependencies
        run: python -m pip install -r h2-audio/requirements.txt

      - name: Generate H2 music and SFX
        run: python h2-audio/packs/dem/audio.py

      - name: Stage generated audio for Remotion
        run: |
          mkdir -p public/audio
          cp h2-audio/audio/music/bed_sad_Am_64bpm.wav public/audio/
          cp h2-audio/audio/music/bed_dark_E_drone.wav public/audio/
          cp h2-audio/audio/music/bed_rise_Am_96bpm.wav public/audio/
          cp h2-audio/audio/music/bed_resolve_C_70bpm.wav public/audio/
          cp h2-audio/audio/music/bed_hope_F_76bpm.wav public/audio/
          cp h2-audio/audio/sfx/notif_msg.wav public/audio/
          cp h2-audio/audio/sfx/clock_tick.wav public/audio/
          cp h2-audio/audio/sfx/tempt_whisper.wav public/audio/
          cp h2-audio/audio/sfx/tempt_swell.wav public/audio/
          cp h2-audio/audio/sfx/rain_loop.wav public/audio/
          cp h2-audio/audio/sfx/punch_bag.wav public/audio/
          cp h2-audio/audio/sfx/page_flip.wav public/audio/
          cp h2-audio/audio/sfx/footsteps.wav public/audio/
          cp h2-audio/audio/sfx/door_open.wav public/audio/
          cp h2-audio/audio/sfx/glass_shatter.wav public/audio/
          cp h2-audio/audio/sfx/breath_in.wav public/audio/
          cp h2-audio/audio/sfx/sting_low.wav public/audio/

      - name: Validate storyboard schema and timing
        run: python ../../tools/video/validate_story.py public/story/shots.json

      - name: Typecheck
        run: npm run typecheck

      - name: Render MP4
        run: npm run render

      - name: Install FFmpeg for output mastering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Normalize final audio
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/one-more-scroll.mp4 \
            -af "loudnorm=I=-14:TP=-1.5:LRA=11" -c:v copy -c:a aac -b:a 192k \
            -movflags +faststart out/master.mp4
          mv out/master.mp4 out/one-more-scroll.mp4

      - name: Validate MP4 and generate contact sheet
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type,width,height,r_frame_rate -of json out/one-more-scroll.mp4 | tee out/metadata.json
          python - <<'PY'
          import json
          with open("out/metadata.json", encoding="utf-8") as f:
              meta = json.load(f)
          video = next((s for s in meta["streams"] if s.get("codec_type") == "video"), None)
          audio = next((s for s in meta["streams"] if s.get("codec_type") == "audio"), None)
          duration = float(meta["format"]["duration"])
          assert video is not None, "missing video stream"
          assert audio is not None, "missing audio stream"
          assert video.get("width") == 1280 and video.get("height") == 720, "unexpected resolution"
          assert video.get("r_frame_rate") == "24/1", "unexpected frame rate"
          assert abs(duration - 155.0) < 0.2, f"unexpected duration: {duration}"
          print(f"Validated: {duration:.3f}s, 1280x720, 24fps, audio={audio.get('codec_name')}")
          PY
          ffmpeg -hide_banner -loglevel error -y -i out/one-more-scroll.mp4 -vf "fps=1/5,scale=320:-1,tile=4x8" -frames:v 1 out/contact-sheet-shots.jpg
          ffmpeg -hide_banner -loglevel error -y -i out/one-more-scroll.mp4 -vf "fps=1/10,scale=320:-1,tile=4x4" -frames:v 1 out/contact-sheet-overview.jpg
          ffmpeg -hide_banner -loglevel info -i out/one-more-scroll.mp4 -af ebur128=peak=true -f null - 2> out/audio-loudness.txt

      - name: Upload render and QA outputs
        uses: actions/upload-artifact@v4
        with:
          name: one-more-scroll-remotion-mp4
          path: |
            video-projects/remotion/out/one-more-scroll.mp4
            video-projects/remotion/out/contact-sheet-shots.jpg
            video-projects/remotion/out/contact-sheet-overview.jpg
            video-projects/remotion/out/metadata.json
            video-projects/remotion/out/audio-loudness.txt
          if-no-files-found: error
          retention-days: 90
