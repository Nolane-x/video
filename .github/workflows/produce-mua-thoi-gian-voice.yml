name: Produce narration — Mua thời gian

on:
  push:
    branches:
      - render/mua-thoi-gian-voice-2026-11-16
    paths:
      - video-projects/mua-thoi-gian/voice-job.json
      - .github/workflows/produce-mua-thoi-gian-voice.yml

permissions:
  contents: read

concurrency:
  group: mua-thoi-gian-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-voice:
    name: Generate Vietnamese narration with VoiceStudio
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HF_HOME: /tmp/mua-thoi-gian-hf
      HF_HUB_CACHE: /tmp/mua-thoi-gian-hf/hub
      AUDIOSEAL_CACHE_DIR: /tmp/mua-thoi-gian-audioseal
      TORCH_HOME: /tmp/mua-thoi-gian-torch
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out production manifest and job
        uses: actions/checkout@v7

      - name: Check out pinned VoiceStudio renderer
        uses: actions/checkout@v7
        with:
          repository: Nolane-x/VoiceStudio
          ref: 35c8f14e2f4606632827a9868e5fb38363a17ccb
          path: voice-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg and audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng

      - name: Install pinned CPU voice and watermark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install --disable-pip-version-check \
            "piper-tts==1.8.0" \
            "vieneu==3.8.3" \
            "kokoro==0.9.4" \
            "misaki[en]==0.9.4" \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "huggingface_hub>=0.28" \
            "jsonschema>=4.25,<5"

      - name: Validate job and render Vietnamese master
        working-directory: voice-source
        run: |
          export VOICE_JOB_JSON="$(cat ../video-projects/mua-thoi-gian/voice-job.json)"
          python scripts/render_video_voice.py --check
          python scripts/render_video_voice.py --output dist/video-voice

      - name: Verify master and stage narration files
        run: |
          set -euo pipefail
          mkdir -p voiceover-assets
          cp -a voice-source/dist/video-voice/. voiceover-assets/
          test -s voiceover-assets/narration.wav
          test -s voiceover-assets/captions.srt
          test -s voiceover-assets/captions.vtt
          test -s voiceover-assets/transcript.txt
          test -s voiceover-assets/manifest.json
          ffprobe -v error -show_entries stream=codec_name,codec_type,sample_rate,channels,bits_per_sample,bits_per_raw_sample,sample_fmt -show_entries format=duration -of json voiceover-assets/narration.wav > voiceover-assets/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("voiceover-assets")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          probe = json.loads((root / "ffprobe.json").read_text(encoding="utf-8"))
          audio = manifest["audio"]
          stream = next(s for s in probe["streams"] if s.get("codec_type") == "audio")
          assert stream["codec_name"] == "pcm_s24le", stream
          assert stream["sample_rate"] == "48000", stream
          assert stream["channels"] == 1, stream
          assert audio["sample_rate"] == 48000 and audio["channels"] == 1 and audio["subtype"] == "PCM_24", audio
          assert audio["watermark"]["status"] == "verified", audio
          assert audio["checks"] == "passed", audio
          assert manifest["segment_count"] == len(manifest["segments"]) > 0
          print(f"VOICE_OK: {manifest['job_id']} | {audio['duration_seconds']:.2f}s | 48kHz PCM-24 | {manifest['segment_count']} segments")
          PY

      - name: Install CPU word aligner
        run: python -m pip install --disable-pip-version-check "faster-whisper==1.2.1"

      - name: Build H2-compatible timing package
        run: |
          python -m py_compile tools/video/align_voicestudio_voiceover.py
          python tests/test_voicestudio_voiceover_alignment.py
          python tools/video/align_voicestudio_voiceover.py --artifact-dir voiceover-assets --model small
          test -s voiceover-assets/h2-timeline.zip
          test -s voiceover-assets/h2-timeline/timeline/voice.wav
          test -s voiceover-assets/h2-timeline/timeline/blocks.json
          test -s voiceover-assets/h2-timeline/timeline/lines.json
          test -s voiceover-assets/h2-timeline/timeline/words.json
          test -s voiceover-assets/h2-timeline/alignment-report.json

      - name: Upload verified narration and H2 timeline
        uses: actions/upload-artifact@v4
        with:
          name: mua-thoi-gian-voice-ready-${{ github.run_id }}
          path: voiceover-assets/
          if-no-files-found: error
          retention-days: 30
