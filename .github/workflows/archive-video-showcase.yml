name: Archive video and production skill

on:
  workflow_run:
    workflows: ["Render Remotion video"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[archive-video]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact render commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download render and QA outputs from the successful run
        uses: actions/download-artifact@v7
        with:
          name: one-more-scroll-remotion-mp4
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Prepare release contents
        id: prep
        run: |
          set -euo pipefail
          mkdir -p release
          VIDEO="$(find downloaded -type f -name 'one-more-scroll.mp4' -print -quit)"
          SHEETS="$(find downloaded -type f -name 'contact-sheet-shots.jpg' -print -quit)"
          OVERVIEW="$(find downloaded -type f -name 'contact-sheet-overview.jpg' -print -quit)"
          META="$(find downloaded -type f -name 'metadata.json' -print -quit)"
          LOUDNESS="$(find downloaded -type f -name 'audio-loudness.txt' -print -quit)"
          test -n "$VIDEO" && test -s "$VIDEO"
          test -n "$SHEETS" && test -s "$SHEETS"
          test -n "$META" && test -s "$META"
          cp "$VIDEO" release/one-more-scroll-remotion-master.mp4
          cp "$SHEETS" release/contact-sheet-shots.jpg
          [ -z "$OVERVIEW" ] || cp "$OVERVIEW" release/contact-sheet-overview.jpg
          cp "$META" release/metadata.json
          [ -z "$LOUDNESS" ] || cp "$LOUDNESS" release/audio-loudness.txt
          zip -qr release/video-production-master-skill.zip \
            AGENTS.md .agents/skills/video-production-master docs/STATE.md docs/AI_HANDOFF.md \
            docs/ART_DIRECTION_IFVERSE_DAYONE.md video-library
          sha256sum release/one-more-scroll-remotion-master.mp4 \
            release/contact-sheet-shots.jpg release/video-production-master-skill.zip \
            | tee release/SHA256SUMS.txt
          echo "tag=showcase-remotion-${{ github.event.workflow_run.run_number }}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Create a source-pinned Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag "${{ steps.prep.outputs.tag }}" "${{ steps.prep.outputs.source_sha }}"
          git push origin "${{ steps.prep.outputs.tag }}"

      - name: Publish permanent release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.prep.outputs.tag }}" \
            release/one-more-scroll-remotion-master.mp4#one-more-scroll-remotion-master.mp4 \
            release/contact-sheet-shots.jpg#contact-sheet-shots.jpg \
            release/contact-sheet-overview.jpg#contact-sheet-overview.jpg \
            release/metadata.json#metadata.json \
            release/audio-loudness.txt#audio-loudness.txt \
            release/video-production-master-skill.zip#video-production-master-skill.zip \
            release/SHA256SUMS.txt#SHA256SUMS.txt \
            --title "ONE MORE SCROLL — Remotion render + production skill" \
            --notes "Reproducible Remotion output and production skill pinned to source commit ${{ github.event.workflow_run.head_sha }}. This is the repository's Remotion render, not the separately delivered H2 Canvas/Chromium master."

      - name: Index the durable release in the video folder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.prep.outputs.tag }}
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/one-more-scroll-remotion-master.mp4
          SOURCE_SHA: ${{ steps.prep.outputs.source_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.prep.outputs.tag }}
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/one-more-scroll-remotion-master.mp4
          SOURCE_SHA: ${{ steps.prep.outputs.source_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag }}"
          SOURCE_SHA="${{ steps.prep.outputs.source_sha }}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/one-more-scroll-remotion-master.mp4"
          git fetch origin main
          git checkout -B archive-index origin/main
          python - <<'PY'
          import json, os
          payload = {
            "project_id": "one-more-scroll",
            "artifact_kind": "remotion-reproducible-render",
            "renderer": "Remotion CLI + procedural audio + FFmpeg mastering",
            "release_url": os.environ["RELEASE_URL"],
            "video_asset_url": os.environ["ASSET_URL"],
            "source_commit": os.environ["SOURCE_SHA"],
            "workflow_run_id": os.environ["RUN_ID"],
            "note": "This is the repository's Remotion build, not the separately delivered H2 Canvas/Chromium master."
          }
          with open("video-library/one-more-scroll/latest-remotion-release.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, indent=2)
            f.write("\\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-library/one-more-scroll/latest-remotion-release.json
          git commit -m "docs: index archived Remotion showcase release"
          git push origin HEAD:main
