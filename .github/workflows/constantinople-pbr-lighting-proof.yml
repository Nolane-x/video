name: Constantinople · brighter PBR lighting proof

on:
  push:
    branches:
      - 'cinematic/constantinople-pbr-lighting-proof'
    paths:
      - 'tools/blender/run-lighting-proof.trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: constantinople-pbr-lighting-proof
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libgl1 libxkbcommon0 libsm6
      - uses: actions/download-artifact@v4
        with:
          name: constantinople-pbr-source-assets-42578951674
          path: historical-assets/models
          repository: Nolane-x/video
          run-id: '42578951674'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Render one 1080p frame with revised key/fill/rim lighting
        env:
          HISTORICAL_ASSETS: historical-assets
          BLENDER_FRAME_START: '1'
          BLENDER_FRAME_END: '1'
          BLENDER_SMOKE_ONLY: '1'
          SMOKE_OUTPUT: out/pbr-lighting-proof.png
          BLENDER_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p out
          blender --background --threads 2 --python tools/blender/render_constantinople_lighting_proof.py
          test -s out/pbr-lighting-proof.png
          python - <<'PY'
          from PIL import Image
          p=Image.open('out/pbr-lighting-proof.png')
          assert p.size==(1920,1080),p.size
          print('LIGHTING STILL PASS',p.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: constantinople-pbr-lighting-proof-${{ github.run_id }}
          path: out/pbr-lighting-proof.png
          if-no-files-found: error
          retention-days: 30