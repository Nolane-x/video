name: Inspect historical assets for Constantinople documentary

on:
  push:
    branches:
      - 'inspect/constantinople-asset-candidates'
    paths:
      - '.github/workflows/inspect-constantinople-assets.yml'

permissions:
  contents: read

concurrency:
  group: inspect-constantinople-asset-candidates
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download existing indexed historical and 3D asset manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-shards models
          BASE="https://github.com/Nolane-x/video/releases/download/video-asset-library-build-41184526545"
          for f in asset-shard--wikimedia.json asset-shard--met.json asset-shard--rijksmuseum.json asset-shard--loc.json asset-shard--polyhaven.json asset-shard--ambientcg.json asset-shard--kenney.json; do
            curl -fL --retry 3 "$BASE/$f" -o "source-shards/$f"
          done
          curl -fL --retry 3 "$BASE/video-assets-polyhaven-3d-models-001.zip" -o models/polyhaven-models.zip
          curl -fL --retry 3 "$BASE/video-assets-ambientcg-3d-models-001.zip" -o models/ambientcg-models.zip
          curl -fL --retry 3 "$BASE/video-assets-kenney-3d-models-001.zip" -o models/kenney-models.zip
          curl -fL --retry 3 "https://github.com/Nolane-x/video/releases/download/nolane-illustrated-history-foley-v0.4.0/download-manifest.json" -o source-shards/history-foley-manifest.json
          sha256sum source-shards/* models/* > models/SHA256SUMS.txt

      - name: Build source-backed candidate report and inspect model archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          terms=[
            "constantinople","byzantine","ottoman","1453","istanbul",
            "theodosian","hagia sophia","golden horn","mehmed","orban",
            "rumeli hisari","byzantine empire","siege of constantinople"
          ]
          def walk(x, source, out):
              if isinstance(x,dict):
                  strings=[]
                  for k,v in x.items():
                      if isinstance(v,(str,int,float)): strings.append(f"{k}: {v}")
                  blob=" | ".join(strings).lower()
                  hit=[t for t in terms if t in blob]
                  if hit and any(k.lower() in x for k in ("title","name","filename","label","original","url","source_url","image_url","file_url")):
                      keep={}
                      for k,v in x.items():
                          kl=k.lower()
                          if any(w in kl for w in ("title","name","file","url","license","right","creator","author","credit","date","description","category","source","id","sha256","type","mime")):
                              if isinstance(v,(str,int,float,bool)) or v is None: keep[k]=v
                              elif isinstance(v,dict):
                                  keep[k]={kk:vv for kk,vv in v.items() if isinstance(vv,(str,int,float,bool)) or vv is None}
                      out.append({"source_shard":source,"matched_terms":hit,"record":keep})
                  for v in x.values(): walk(v,source,out)
              elif isinstance(x,list):
                  for v in x: walk(v,source,out)
          result={"query_terms":terms,"records":[]}
          for p in Path("source-shards").glob("asset-shard--*.json"):
              if "history-foley" in p.name: continue
              try: data=json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  result.setdefault("parse_errors",[]).append({"file":p.name,"error":str(e)});continue
              walk(data,p.name,result["records"])
          # Deduplicate repeated nested records while preserving the source.
          seen=set(); unique=[]
          for row in result["records"]:
              key=json.dumps(row,sort_keys=True,ensure_ascii=False)
              if key not in seen: seen.add(key);unique.append(row)
          result["records"]=unique
          manifest=json.loads(Path("source-shards/history-foley-manifest.json").read_text())
          manifest_rows=(manifest.get("assets",[]) if isinstance(manifest,dict) else manifest if isinstance(manifest,list) else [])
          result["history_foley_manifest_summary"]={
            "json_type":type(manifest).__name__,
            "keys":list(manifest)[:25] if isinstance(manifest,dict) else [],
            "asset_count":len(manifest_rows),
            "manifest_excerpt":manifest if len(json.dumps(manifest))<6000 else manifest_rows[:30]
          }
          Path("report").mkdir(exist_ok=True)
          Path("report/historical-asset-candidates.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          lines=["# Existing asset-library candidates for the Constantinople 1453 film","",
            "This report searches the repository's pinned asset-library release manifests. A match is only a candidate; the asset's license and provenance must still be respected.","",
            f"- Manifest candidates matched: {len(unique)}"]
          for row in unique[:100]:
              rec=row["record"]
              title=rec.get("title") or rec.get("name") or rec.get("filename") or rec.get("label") or "(untitled)"
              lines += [f"## {title}",f"- Source shard: {row['source_shard']}",f"- Matched terms: {', '.join(row['matched_terms'])}"]
              for k in ("url","source_url","image_url","file_url","license","rights","creator","artist","date","description","category","mime_type","sha256","id"):
                  if k in rec: lines.append(f"- {k}: {str(rec[k])[:500]}")
              lines.append("")
          Path("report/historical-asset-candidates.md").write_text("\n".join(lines)+"\n")
          print(f"Historical candidates: {len(unique)}")
          PY
          for z in models/*.zip; do
            n=$(basename "$z" .zip)
            unzip -Z -1 "$z" > "report/$n-files.txt"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for p in Path("report").glob("*-files.txt"):
              entries=p.read_text(errors="replace").splitlines()
              exts={}
              for e in entries:
                  ext=Path(e).suffix.lower() or "[no extension]"
                  exts[ext]=exts.get(ext,0)+1
              rows.append({"archive":p.stem,"file_count":len(entries),"extensions":exts,
                "sample_entries":entries[:160]})
          Path("report/3d-model-archive-index.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
          cp models/SHA256SUMS.txt report/

      - name: Install Blender and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxkbcommon0 libsm6 python3-pil

      - name: Resolve and download Poly Haven models from the official API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/downloaded
          python - <<'PY'
          import json, os, hashlib, urllib.request
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlparse
          assets = ["cannon_01", "modular_fort_01", "ship_pinnace"]
          root = Path("models/downloaded")
          manifest = {"provider":"Poly Haven","license":"CC0-1.0","assets":[]}
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Nolane-x-video/asset-audit"})
              with urllib.request.urlopen(req,timeout=90) as response: return response.read()
          def collect_includes(node, path=""):
              found=[]
              if isinstance(node,dict):
                  if isinstance(node.get("url"),str):
                      found.append((path or urlparse(node["url"]).path.rsplit("/",1)[-1],node))
                  else:
                      for key,value in node.items():
                          if key in {"url","md5","size"}: continue
                          found.extend(collect_includes(value,str(key) if not path else f"{path}/{key}"))
              elif isinstance(node,list):
                  for i,value in enumerate(node): found.extend(collect_includes(value,f"{path}/{i}"))
              return found
          for asset in assets:
              data=json.loads(fetch(f"https://api.polyhaven.com/files/{asset}"))
              branch=data.get("blend")
              if not isinstance(branch,dict) or not branch:
                  raise RuntimeError(f"{asset}: no Blender file branch in API response")
              choices=[]
              for resolution,formats in branch.items():
                  if isinstance(formats,dict) and isinstance(formats.get("blend"),dict) and formats["blend"].get("url"):
                      info=formats["blend"]; size=int(info.get("size",0))
                      choices.append((resolution,size,info))
              if not choices: raise RuntimeError(f"{asset}: no downloadable .blend variant")
              resolution,size,main=sorted(choices,key=lambda x:(0 if x[0]=="1k" else 1,x[1]))[0]
              asset_dir=root/asset;asset_dir.mkdir(parents=True,exist_ok=True)
              filename=PurePosixPath(urlparse(main["url"]).path).name
              if not filename.lower().endswith(".blend"): raise RuntimeError(f"{asset}: unexpected model URL {main['url']}")
              target=asset_dir/filename
              blob=fetch(main["url"]);target.write_bytes(blob)
              if size and len(blob)!=size: raise RuntimeError(f"{asset}: size mismatch {len(blob)} != {size}")
              md5=main.get("md5")
              if md5 and hashlib.md5(blob).hexdigest()!=md5: raise RuntimeError(f"{asset}: MD5 mismatch")
              includes=[]
              for rel,meta in collect_includes(main.get("include",{})):
                  relpath=PurePosixPath(rel)
                  if relpath.is_absolute() or ".." in relpath.parts: raise RuntimeError(f"Unsafe include path: {rel}")
                  if not isinstance(meta,dict) or not meta.get("url"): continue
                  dest=asset_dir.joinpath(*relpath.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  raw=fetch(meta["url"]);dest.write_bytes(raw)
                  expected=meta.get("size")
                  if expected and len(raw)!=int(expected): raise RuntimeError(f"{asset}: include size mismatch {rel}")
                  if meta.get("md5") and hashlib.md5(raw).hexdigest()!=meta["md5"]: raise RuntimeError(f"{asset}: include MD5 mismatch {rel}")
                  includes.append({"path":rel,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
              manifest["assets"].append({"id":asset,"resolution":resolution,"file":str(target),"bytes":len(blob),
                  "sha256":hashlib.sha256(blob).hexdigest(),"includes":includes})
              print(f"POLYHAVEN_MODEL_READY {asset} {resolution} {len(blob)} bytes {len(includes)} dependencies",flush=True)
          Path("models/downloaded/manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY

      - name: Render source-library model previews under studio lighting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report/model-previews
          cat > models/render_model_preview.py <<'PY'
          import bpy, json, math, os, sys
          from mathutils import Vector
          args=sys.argv[sys.argv.index("--")+1:]
          name,out=args[0],os.path.abspath(args[1])
          scene=bpy.context.scene
          scene.frame_set(1)
          for obj in list(bpy.data.objects):
              if obj.type in {"CAMERA","LIGHT"}: bpy.data.objects.remove(obj,do_unlink=True)
          meshes=[o for o in scene.objects if o.type=="MESH" and not o.hide_render]
          if not meshes: raise RuntimeError(f"{name}: no visible mesh objects")
          pts=[o.matrix_world @ Vector(corner) for o in meshes for corner in o.bound_box]
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5
          span=max((mx-mn).x,(mx-mn).y,(mx-mn).z,0.1)
          floor=bpy.data.objects.new("Preview floor",bpy.data.meshes.new("Preview floor mesh"))
          scene.collection.objects.link(floor)
          floor.location=(center.x,center.y,mn.z-span*0.035)
          bpy.context.view_layer.objects.active=floor;floor.select_set(True);floor.select_set(False)
          bpy.ops.mesh.primitive_plane_add(size=span*7, location=floor.location)
          plane=bpy.context.object;plane.name="Neutral studio ground"
          mat=bpy.data.materials.new("Neutral studio ground");mat.diffuse_color=(.075,.085,.10,1);mat.use_nodes=True
          mat.node_tree.nodes["Principled BSDF"].inputs["Base Color"].default_value=(.075,.085,.10,1)
          mat.node_tree.nodes["Principled BSDF"].inputs["Roughness"].default_value=.85
          plane.data.materials.append(mat)
          def aim(obj,target):
              obj.rotation_euler=(Vector(target)-obj.location).to_track_quat("-Z","Y").to_euler()
          cam_data=bpy.data.cameras.new("Asset review camera")
          cam=bpy.data.objects.new("Asset review camera",cam_data);scene.collection.objects.link(cam)
          cam.location=center+Vector((span*2.0,-span*2.5,span*1.55));cam_data.lens=52;aim(cam,center);scene.camera=cam
          def area(n,offset,power,size):
              d=bpy.data.lights.new(n,"AREA");d.energy=power;d.shape="DISK";d.size=size
              o=bpy.data.objects.new(n,d);scene.collection.objects.link(o);o.location=center+Vector(offset);aim(o,center)
          area("Large warm key",(-span*2,-span*1.8,span*2.6),span*span*360,span*1.7)
          area("Cool fill",(span*2,-span,span*1.2),span*span*160,span*2.2)
          area("Warm rim",(span*.5,span*2,span*2.3),span*span*290,span*1.4)
          world=bpy.data.worlds.new("Studio world") if not bpy.data.worlds else bpy.data.worlds[0]
          scene.world=world;world.use_nodes=True
          world.node_tree.nodes["Background"].inputs["Color"].default_value=(.13,.16,.21,1)
          world.node_tree.nodes["Background"].inputs["Strength"].default_value=.34
          scene.render.engine="BLENDER_EEVEE"
          scene.eevee.taa_render_samples=16
          scene.render.resolution_x=960;scene.render.resolution_y=540;scene.render.resolution_percentage=100
          scene.render.image_settings.file_format="PNG";scene.render.filepath=out
          scene.view_settings.view_transform="AgX"
          scene.render.film_transparent=False
          bpy.ops.render.render(write_still=True)
          linked_images=sum(1 for im in bpy.data.images if im.source=="FILE" and im.has_data)
          report={"model":name,"mesh_objects":len(meshes),"materials":len(bpy.data.materials),"image_textures_loaded":linked_images,
                  "bounds_dimensions":[round(v,4) for v in (mx-mn)],"preview":out}
          print("MODEL_PREVIEW_REPORT="+json.dumps(report),flush=True)
          PY
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=json.loads(Path("models/downloaded/manifest.json").read_text())
          for asset in manifest["assets"]:
              model=asset["file"]
              subprocess.run(["blender","--background",model,"--python","models/render_model_preview.py","--",asset["id"],f"report/model-previews/{asset['id']}.png"],check=True)
          PY
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          ps=sorted(Path("report/model-previews").glob("*.png"))
          assert len(ps)==3, f"Expected 3 verified Poly Haven model previews, got {len(ps)}"
          cells=[]
          for p in ps:
              im=Image.open(p).convert("RGB"); im.thumbnail((640,360))
              cell=Image.new("RGB",(660,400),(20,24,30))
              cell.paste(im,((660-im.width)//2,26))
              ImageDraw.Draw(cell).text((14,8),p.stem,fill="white")
              cells.append(cell)
          cols=2;rows=(len(cells)+cols-1)//cols
          out=Image.new("RGB",(cols*660,rows*400),(10,12,16))
          for i,im in enumerate(cells): out.paste(im,((i%cols)*660,(i//cols)*400))
          out.save("report/polyhaven-model-previews.jpg",quality=92)
          PY

      - name: Upload compact research result
        uses: actions/upload-artifact@v4
        with:
          name: constantinople-historical-asset-candidates-${{ github.run_id }}
          path: report/
          if-no-files-found: error
          retention-days: 30
