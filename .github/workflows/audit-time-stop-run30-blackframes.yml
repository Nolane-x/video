name: Audit — Run 30 sustained-black interval scan

on:
  push:
    branches:
      - review/time-stop-10s-3d-fixes
    paths:
      - ".github/workflows/enable-audit-time-stop-run30-blackframes.txt"

permissions:
  actions: read
  contents: read

concurrency:
  group: time-stop-run30-blackframe-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Scan the corrected 6m18s master for sustained black intervals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit trigger
        uses: actions/checkout@v4
        with:
          ref: review/time-stop-10s-3d-fixes

      - name: Install FFmpeg if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download the immutable Run-30 render artifact
        uses: actions/download-artifact@v4
        with:
          name: time-stop-10s-h2-30
          repository: ${{ github.repository }}
          run-id: 44873063135
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact

      - name: Scan low-resolution temporal samples for sustained black
        shell: bash
        run: |
          set -euo pipefail
          MASTER="$(find source-artifact -type f -name 'time-stop-10s-master.mp4' -print -quit)"
          test -n "$MASTER"
          mkdir -p audit
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json "$MASTER" > audit/master-metadata.json
          # Decode the entire video, but run the detector on only 4 downscaled
          # grayscale samples per second. The 0.5s minimum duration suppresses
          # single-frame flashes while retaining fade/blackout events for review.
          ffmpeg -hide_banner -nostats -loglevel info -i "$MASTER" \
            -vf "fps=4,scale=160:90:flags=area,format=gray,blackdetect=d=0.5:pix_th=0.06:pic_th=0.985" \
            -an -f null - 2> audit/black-scan.log
          python - <<'PY'
          import json, re
          from pathlib import Path

          meta = json.loads(Path("audit/master-metadata.json").read_text())
          duration = float(meta["format"]["duration"])
          fps = next(s["r_frame_rate"] for s in meta["streams"] if s.get("codec_type") == "video")
          log = Path("audit/black-scan.log").read_text(errors="replace")
          pattern = re.compile(
              r"black_start:(?P<start>[-+0-9.eE]+)\s+"
              r"black_end:(?P<end>[-+0-9.eE]+)\s+"
              r"black_duration:(?P<duration>[-+0-9.eE]+)"
          )
          intervals = []
          for match in pattern.finditer(log):
              start, end, length = (float(match.group(k)) for k in ("start", "end", "duration"))
              midpoint = (start + end) / 2
              known = [54.0, 162.0, 270.0]
              nearest = min(known, key=lambda x: abs(x - midpoint)) if known else None
              near_transition = nearest is not None and abs(nearest - midpoint) <= 2.5
              # The last shot is deliberately a charcoal end card beginning at 373.5s.
              near_end_card = start < 378.0 and end > 373.5
              classification = (
                  "designed-dark-end-card" if near_end_card else
                  "near-known-transition" if near_transition else
                  "other-black-interval"
              )
              intervals.append({
                  "start_seconds": round(start, 3),
                  "end_seconds": round(end, 3),
                  "duration_seconds": round(length, 3),
                  "nearest_known_transition_seconds": nearest if near_transition else None,
                  "classification": classification
              })
          unexpected = [
              x for x in intervals
              if x["duration_seconds"] >= 1.5
              and x["classification"] not in ("near-known-transition", "designed-dark-end-card")
          ]
          report = {
              "status": "scan-complete",
              "source": "immutable Run-30 master artifact 44873063135",
              "master_duration_seconds": duration,
              "master_fps": fps,
              "sampling": {
                  "rate_fps": 4,
                  "analysis_resolution": [160, 90],
                  "filter": "blackdetect=d=0.5:pix_th=0.06:pic_th=0.985",
                  "scope": "full video timeline; decoder reads the complete source"
              },
              "known_transition_centres_seconds": [54.0, 162.0, 270.0],
              "known_designed_dark_ranges_seconds": [{"start": 373.5, "end": 378.0, "purpose": "charcoal final end card"}],
              "detected_intervals": intervals,
              "unexpected_intervals_at_least_1_5s": unexpected,
              "interpretation": (
                  "Sustained-black candidates are listed for visual review. "
                  "Short fades near known scene boundaries are not automatically treated as faults. "
                  "The scan is temporal sampling, not a replacement for continuous human screening."
              )
          }
          Path("audit/black-interval-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n"
          )
          summary = [
              "# Run-30 sustained-black scan",
              "",
              f"- Master duration: {duration:.3f}s",
              f"- Master frame rate: {fps}",
              "- Scan: full timeline, 4 samples/s, 160×90 grayscale",
              f"- Intervals detected (minimum 0.5s): {len(intervals)}",
              f"- Unexpected intervals ≥1.5s: {len(unexpected)}",
              "",
              "| Start | End | Duration | Classification |",
              "|---:|---:|---:|---|"
          ]
          for x in intervals:
              summary.append(
                  f'| {x["start_seconds"]:.3f}s | {x["end_seconds"]:.3f}s | '
                  f'{x["duration_seconds"]:.3f}s | {x["classification"]} |'
              )
          if not intervals:
              summary.append("| — | — | — | No sustained black interval ≥0.5s detected |")
          Path("audit/BLACK-SCAN-SUMMARY.md").write_text("\n".join(summary) + "\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload black-scan report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-stop-10s-run30-black-scan
          path: audit/
          if-no-files-found: warn
          retention-days: 30
