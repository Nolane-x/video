name: Video toolchain Blender CPU proof

on:
  pull_request:
    paths:
      - "tools/blender/**"
      - "toolchain/scripts/install-blender.sh"
      - "toolchain/manifest.json"
      - ".github/workflows/video-toolchain-blender.yml"
      - "toolchain/scripts/install-blender.sh"
      - "toolchain/manifest.json"
      - ".github/workflows/video-toolchain-blender.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-toolchain-blender-proof
  cancel-in-progress: false

jobs:
  blender-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Blender 5.2.3 runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/nolane-video-toolchain/blender-5.2.3-linux-x64
          key: blender-linux-x64-5.2.3-official-sha256

      - name: Install Blender if cache missed
        run: |
          bash toolchain/scripts/install-blender.sh | tee blender-install.txt
          BLENDER_DIR="$HOME/.cache/nolane-video-toolchain/blender-5.2.3-linux-x64"
          test -x "$BLENDER_DIR/blender"
          "$BLENDER_DIR/blender" --background --version
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libgbm1 libxrender1 libxkbcommon0

      - name: Render headless five-second proof
        env:
          BLENDER_OUTPUT: ${{ github.workspace }}/out/blender/h2-style-study.mp4
          BLENDER_RESOLUTION_PERCENTAGE: "50"
        run: |
          mkdir -p out/blender
          LIBGL_ALWAYS_SOFTWARE=1 blender --background --python tools/blender/render_h2_stage.py
          test -s "$BLENDER_OUTPUT"
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type,width,height,r_frame_rate -of json "$BLENDER_OUTPUT" | tee out/blender/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("out/blender/metadata.json").read_text(encoding="utf-8"))
          video = next(stream for stream in metadata["streams"] if stream.get("codec_type") == "video")
          duration = float(metadata["format"]["duration"])
          assert video["codec_name"] == "h264", video
          assert (video["width"], video["height"]) == (640, 360), video
          assert video["r_frame_rate"] == "24/1", video
          assert 4.9 <= duration <= 5.1, f"Expected five-second proof, got {duration:.3f}s"
          print(f"Validated Blender MP4: {duration:.3f}s, 640x360, 24fps, H.264")
          PY

      - name: Upload Blender proof
        uses: actions/upload-artifact@v7
        with:
          name: video-toolchain-blender-proof-${{ github.run_id }}
          path: |
            out/blender/h2-style-study.mp4
            out/blender/metadata.json
            blender-install.txt
          if-no-files-found: error
          retention-days: 14
