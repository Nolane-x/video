name: Editorial interchange and scene-detection proof

on:
  pull_request:
    paths:
      - "toolchain/python/editorial/**"
      - "tools/video/editorial_toolchain_smoke.py"
      - ".github/workflows/video-toolchain-editorial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-toolchain-editorial-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorial-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: toolchain/python/editorial/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install OTIO and PySceneDetect headless
        run: python -m pip install --requirement toolchain/python/editorial/requirements.txt
      - name: Generate synthetic cut and round-trip OTIO timeline
        run: |
          python tools/video/editorial_toolchain_smoke.py --output out/editorial
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type,width,height,r_frame_rate -of json out/editorial/synthetic-two-scene.mp4 | tee out/editorial/ffprobe.json
          python -m pip freeze > out/editorial/resolved-requirements.txt
      - name: Upload editorial evidence
        uses: actions/upload-artifact@v7
        with:
          name: video-editorial-toolchain-\${{ github.run_id }}
          path: out/editorial/
          if-no-files-found: error
          retention-days: 14
