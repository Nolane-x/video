name: Build readable subtitle alternative — Run 30

on:
  push:
    branches:
      - review/time-stop-10s-3d-fixes
    paths:
      - ".github/workflows/enable-build-time-stop-run30-readable-subtitles.txt"
      - "video-projects/time-stop-10s/tools/extend_readable_subtitles.py"
      - "video-projects/time-stop-10s/tests/test_extend_readable_subtitles.py"
      - ".github/workflows/build-time-stop-run30-readable-subtitles.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful immutable Run-30 render workflow run ID"
        required: true
        default: "44873063135"

permissions:
  actions: read
  contents: read

concurrency:
  group: time-stop-run30-readable-subtitles
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild and validate the alternate Vietnamese subtitle track
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '44873063135' }}
    steps:
      - name: Check out the subtitle builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run subtitle-builder unit tests
        run: python -m unittest discover -s video-projects/time-stop-10s/tests -p 'test_*.py' -v

      - name: Download the immutable Run-30 source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: time-stop-10s-h2-30
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.source_run_id || '44873063135' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact

      - name: Generate the alternate SRT/VTT and enforce subtitle invariants
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SRT="$(find source-artifact -type f -path '*/subtitles/time-stop-10s.srt' -print -quit)"
          test -n "$SOURCE_SRT"
          test -s "$SOURCE_SRT"
          mkdir -p output
          python video-projects/time-stop-10s/tools/extend_readable_subtitles.py \
            --input "$SOURCE_SRT" \
            --output output \
            --video-duration 378.0 \
            --gap 0.12 \
            --expected-cues 84
          cp "$SOURCE_SRT" output/time-stop-10s-original-voice-sync.srt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path("output/subtitle-readability-qa.json").read_text(encoding="utf-8"))
          assert report["status"] == "passed", report
          assert report["cue_count"] == 84, report
          assert report["preserves_original_text_and_cue_starts"] is True, report
          assert report["preserves_voiceover_timing"] is True, report
          assert report["source_overlap_count"] == 0, report
          assert report["overlap_count"] == 0, report
          assert report["text_changes"] == 0, report
          assert report["extended"]["min_dwell_seconds"] >= 4.0, report
          assert report["extended"]["max_chars_per_second"] < report["original"]["max_chars_per_second"], report
          assert report["wrapped_variant"]["max_line_characters"] <= 42, report
          assert report["wrapped_variant"]["max_observed_lines_per_cue"] <= 2, report
          assert report["wrapped_variant"]["word_text_changes"] == 0, report

          # Golden SHA-256 values from the already reviewed Run-30 add-on.
          expected = {
              "time-stop-10s-original-voice-sync.srt": "7e0872b4fa958c089f9b44845530fb103a57eb25bd3527aacec16b1c9f1fefd4",
              "time-stop-10s-readable-vi.srt": "53e322292f963249731cea9c6ed1ee67bef4c101a07ffb8a4d2b3ff48b989caa",
              "time-stop-10s-readable-vi.vtt": "e32125cab18293d4f32dca21cb0e6e50b39bc07ab9103233324e1c433eae4deb",
              "time-stop-10s-readable-wrapped-vi.srt": "cd1c0aa3979f97af8d4d530f3489f1ca1bc8333bb1c7811411153a9d8607018d",
              "time-stop-10s-readable-wrapped-vi.vtt": "fe98852fd6519947c12117f6297b228b5a1c1a38c4f08e634a7c9de4a4d629f6",
          }
          for filename, expected_sha in expected.items():
              actual_sha = hashlib.sha256((Path("output") / filename).read_bytes()).hexdigest()
              assert actual_sha == expected_sha, (filename, actual_sha, expected_sha)
          print("All subtitle invariants and golden SHA-256 comparisons passed.")
          PY
          cat > output/README.md <<'EOF'
          # Run-30 readable Vietnamese subtitle alternatives

          This package is reproducibly generated from the immutable Run-30 render artifact.

          - All 84 original Vietnamese cue texts and cue start times are preserved.
          - The extended-dwell alternative keeps each cue visible until 0.12 seconds before the next narration cue; the final cue ends at 378.0 seconds.
          - An additional wrapped alternative limits each line to 42 characters and each cue to at most two lines. It wraps only at word boundaries and preserves the words and punctuation.
          - Both alternatives have zero cue overlap and do not change the voiceover, WAV, story timing or master MP4.
          - The canonical voice-synchronous SRT/VTT remain unchanged.

          Run the source builder with Python 3.12 or newer. It uses only the Python standard library.
          EOF
          (
            cd output
            sha256sum README.md \
              time-stop-10s-original-voice-sync.srt \
              time-stop-10s-readable-vi.srt \
              time-stop-10s-readable-vi.vtt \
              time-stop-10s-readable-wrapped-vi.srt \
              time-stop-10s-readable-wrapped-vi.vtt \
              subtitle-readability-qa.json > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            zip -q -r time-stop-10s-run30-readable-subtitles.zip \
              README.md SHA256SUMS.txt \
              time-stop-10s-original-voice-sync.srt \
              time-stop-10s-readable-vi.srt \
              time-stop-10s-readable-vi.vtt \
              time-stop-10s-readable-wrapped-vi.srt \
              time-stop-10s-readable-wrapped-vi.vtt \
              subtitle-readability-qa.json
            unzip -t time-stop-10s-run30-readable-subtitles.zip
          )

      - name: Publish quantitative QA summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          q = json.loads(Path("output/subtitle-readability-qa.json").read_text(encoding="utf-8"))
          old, new = q["original"], q["extended"]
          print("# Run-30 readable subtitle alternative — passed")
          print()
          print(f"- Source artifact run: {os.environ['SOURCE_RUN_ID']}")
          print(f"- Cue count: {q['cue_count']} (unchanged)")
          print(f"- Cue overlaps: {q['overlap_count']}")
          print(f"- Text changes: {q['text_changes']}")
          print()
          print("| Metric | Original | Extended dwell |")
          print("|---|---:|---:|")
          for label, key in [
              ("Median reading speed (chars/s)", "median_chars_per_second"),
              ("P90 reading speed (chars/s)", "p90_chars_per_second"),
              ("Maximum reading speed (chars/s)", "max_chars_per_second"),
              ("Minimum dwell (s)", "min_dwell_seconds"),
          ]:
              print(f"| {label} | {old[key]:.2f} | {new[key]:.2f} |")
          wrapped = q["wrapped_variant"]
          print()
          print("## Wrapped alternative")
          print(f"- Maximum line length: {wrapped['max_line_characters']} / 42 characters")
          print(f"- Maximum lines per cue: {wrapped['max_observed_lines_per_cue']} / 2")
          print(f"- Word-text changes: {wrapped['word_text_changes']}")
          print()
          print("The canonical voice-synchronous subtitles and the master MP4 were not modified.")
          PY

      - name: Upload reproducible subtitle package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: time-stop-10s-run30-readable-subtitles
          path: output/
          if-no-files-found: error
          retention-days: 90
