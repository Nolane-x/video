name: Package portable video skill with example

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/skills/video-production-master/**"
      - ".agents/skills/video-voice-design-director/**"
      - ".agents/skills/video-character-voice-casting-engineer/**"
      - ".agents/skills/video-voice-quality-auditor/**"
      - ".claude/skills/video-production-master/**"
      - "docs/STATE.md"
      - "docs/AI_HANDOFF.md"
      - "docs/ART_DIRECTION_IFVERSE_DAYONE.md"
      - "docs/VIDEO_PRODUCTION_STATE_SCHEMA.json"
      - "docs/INSTALL_VIDEO_SKILL.md"
      - "docs/CHATGPT_PLUGIN.md"
      - "integrations/h2-selfimprove-studio/**"
      - "integrations/h2-selfimprove-studio-production-overlay/**"
      - "docs/TOOL_INVENTORY.md"
      - "docs/VOICE_STUDIO.md"
      - "integrations/voice-studio/**"
      - "tools/video/build_asset_library.py"
      - "tools/video/generate_sfx_library.py"
      - "tools/video/validate_story.py"
      - "tools/video/archive_h2_master.py"
      - "tools/video/archive_previous_works.py"
      - "tools/video/patch_h2_shoelace_scene.py"
      - "tools/video/publish_h2_source_release.ps1"
      - ".github/workflows/verify-previous-works.yml"
      - ".github/workflows/verify-archive-h2-master.yml"
      - ".github/workflows/verify-h2-source-v2.yml"
      - ".github/workflows/verify-h2-source-v3.yml"
      - ".github/workflows/preview-h2-source-v3-shoelace.yml"
      - ".github/workflows/sync-h2-source-release-manifest.yml"
      - "video-library/assets/**"
      - "video-library/README.md"
      - "video-library/previous-works-catalog.json"
      - "video-library/reference-clips.json"
      - "video-library/one-more-scroll/README.md"
      - "video-library/one-more-scroll/manifest.json"
      - "video-library/one-more-scroll/QA.md"
      - "video-library/one-more-scroll/latest-remotion-release.json"
      - "video-library/one-more-scroll/one-more-scroll-h2-final.mp4.sha256"
      - "video-library/one-more-scroll/original-h2-master-metadata.json"
      - "tools/blender/**"
      - "tools/krita/**"
      - "video-projects/remotion/README.md"
      - "video-projects/remotion/src/**"
      - "video-projects/remotion/public/story/**"
      - "video-library/one-more-scroll/h2-source-release.json"
      - "video-library/one-more-scroll/h2-source-v3-render-request.json"
      - ".github/workflows/build-video-asset-library.yml"
      - ".github/workflows/package-video-skill.yml"
  workflow_run:
    workflows:
      - "Verify archived H2 master"
      - "Verify previous AI video assets"
      - "Archive video and production skill"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-video-skill-v2
  cancel-in-progress: true

jobs:
  bundle:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Package skill, instructions, source map, state and reference video
        run: |
          set -euo pipefail
          mkdir -p bundle/.agents/skills bundle/.claude/skills bundle/docs bundle/tools/video bundle/video-library bundle/.github/workflows
          cp README.md AGENTS.md CLAUDE.md bundle/
          cp .github/workflows/verify-h2-source-v2.yml .github/workflows/preview-h2-source-v3-shoelace.yml .github/workflows/verify-h2-source-v3.yml .github/workflows/sync-h2-source-release-manifest.yml bundle/.github/workflows/
          cp -R .agents/skills/video-production-master bundle/.agents/skills/
          cp -R .agents/skills/video-voice-design-director bundle/.agents/skills/
          cp -R .agents/skills/video-character-voice-casting-engineer bundle/.agents/skills/
          cp -R .agents/skills/video-voice-quality-auditor bundle/.agents/skills/
          cp -R .claude/skills/video-production-master bundle/.claude/skills/
          cp docs/STATE.md docs/AI_HANDOFF.md docs/ART_DIRECTION_IFVERSE_DAYONE.md \
             docs/VIDEO_PRODUCTION_STATE_SCHEMA.json docs/INSTALL_VIDEO_SKILL.md docs/TOOL_INVENTORY.md docs/CHATGPT_PLUGIN.md docs/VOICE_STUDIO.md bundle/docs/
          cp tools/video/build_asset_library.py tools/video/generate_sfx_library.py tools/video/validate_story.py tools/video/archive_h2_master.py tools/video/archive_previous_works.py tools/video/patch_h2_shoelace_scene.py tools/video/publish_h2_source_release.ps1 bundle/tools/video/
          mkdir -p bundle/integrations
          cp -R integrations/h2-selfimprove-studio bundle/integrations/
          cp -R integrations/h2-selfimprove-studio-production-overlay bundle/integrations/
          cp -R integrations/voice-studio bundle/integrations/
          cp video-library/README.md video-library/previous-works-catalog.json video-library/reference-clips.json bundle/video-library/
          cp -R video-library/assets bundle/video-library/assets
          # Carry historical contact sheets/metadata in the portable bundle without duplicating every large MP4.
          if [ -d video-library/previous-works ]; then
            while IFS= read -r -d '' file; do
              mkdir -p "bundle/$(dirname "$file")"
              cp "$file" "bundle/$file"
            done < <(find video-library/previous-works -type f \( -name 'contact-sheet.jpg' -o -name 'overview-sheet.jpg' -o -name 'metadata.json' -o -name '*.sha256' \) -print0)
          fi
          mkdir -p bundle/video-library/one-more-scroll
          cp video-library/one-more-scroll/README.md \
             video-library/one-more-scroll/manifest.json \
             video-library/one-more-scroll/QA.md \
             video-library/one-more-scroll/latest-remotion-release.json \
             video-library/one-more-scroll/h2-source-release.json \
             bundle/video-library/one-more-scroll/
          cp video-library/one-more-scroll/h2-source-v3-render-request.json bundle/video-library/one-more-scroll/
          # The canonical H2 master is now required, not an optional extra.
          H2_PATH="video-library/one-more-scroll/one-more-scroll-h2-final.mp4"
          test -s "$H2_PATH"
          H2_SHA="$(sha256sum "$H2_PATH" | cut -d ' ' -f1)"
          test "$H2_SHA" = "be0608239a374cf10c89b2c9b16e642de962cdd8f1b177de1a173219413a940f"
          cp "$H2_PATH" bundle/video-library/one-more-scroll/
          for f in one-more-scroll-h2-final.mp4.sha256 original-h2-master-metadata.json original-h2-contact-sheet-shots.jpg original-h2-contact-sheet-overview.jpg; do
            test -s "video-library/one-more-scroll/$f"
            cp "video-library/one-more-scroll/$f" bundle/video-library/one-more-scroll/
          done
          VIDEO_PATH="$(python -c 'import json; print(json.load(open("video-library/one-more-scroll/latest-remotion-release.json"))["video_path"])')"
          RENDER_DIR="$(dirname "$VIDEO_PATH")"
          test -s "$VIDEO_PATH"
          DEST="bundle/$RENDER_DIR"
          mkdir -p "$DEST"
          for f in one-more-scroll-remotion-master.mp4 contact-sheet-shots.jpg contact-sheet-overview.jpg metadata.json audio-loudness.txt SHA256SUMS.txt; do
            [ ! -f "$RENDER_DIR/$f" ] || cp "$RENDER_DIR/$f" "$DEST/$f"
          done
          cp video-projects/remotion/README.md bundle/video-library/one-more-scroll/remotion-README.md
          mkdir -p bundle/video-projects
          cp -R video-projects/remotion bundle/video-projects/
          cp -R tools/blender bundle/tools/
          cp -R tools/krita bundle/tools/
          python -m py_compile tools/video/validate_story.py tools/video/archive_h2_master.py tools/video/archive_previous_works.py tools/video/patch_h2_shoelace_scene.py
          python -m json.tool video-library/previous-works-catalog.json > /dev/null
          python -m json.tool video-library/reference-clips.json > /dev/null
          python -m json.tool video-library/one-more-scroll/manifest.json > /dev/null
          python -m json.tool video-library/one-more-scroll/h2-source-release.json > /dev/null
          python -m json.tool video-library/one-more-scroll/h2-source-v3-render-request.json > /dev/null
          cat > bundle/VIDEO_PRODUCTION_BUNDLE_MANIFEST.json <<JSON
          {
            "bundle_name": "Nolane Video Production Master",
            "created_from_commit": "$(git rev-parse HEAD)",
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "canonical_skill": ".agents/skills/video-production-master/SKILL.md",
            "voice_design_skill": ".agents/skills/video-voice-design-director/SKILL.md",
            "voice_casting_skill": ".agents/skills/video-character-voice-casting-engineer/SKILL.md",
            "voice_quality_audit_skill": ".agents/skills/video-voice-quality-auditor/SKILL.md",
            "includes_voice_studio_integration": true,
            "voice_studio_integration": "integrations/voice-studio/README.md",
            "voice_studio_app_repository": "https://github.com/Nolane-x/VoiceStudio",
            "voice_studio_app_commit": "faa5294359f23c911972ffe6d27785c50c67097b",
            "voice_studio_application_license": "AGPL-3.0",
            "voice_studio_model_weights_embedded": false,
            "voice_studio_generated_audio_embedded": false,
            "cross_agent_entrypoints": ["AGENTS.md", "CLAUDE.md", ".claude/skills/video-production-master/SKILL.md"],
            "included_reference_render": "$VIDEO_PATH",
            "included_reference_render_sha256": "$(sha256sum "$VIDEO_PATH" | cut -d ' ' -f1)",
            "includes_original_h2_master": true,
            "canonical_h2_master": "video-library/one-more-scroll/one-more-scroll-h2-final.mp4",
            "canonical_h2_master_sha256": "$H2_SHA",
            "chatgpt_plugin": "https://chatgpt.com/plugins/plugins_6ade1c3ca8d0819188070ae20f2792d0",
            "active_chatgpt_plugin_version": "1.1.0",
            "active_chatgpt_plugin_release_id": "pluginrel_6ade248942988191a57ff1059c818720",
            "active_chatgpt_plugin_release_report": "integrations/h2-selfimprove-studio-production-overlay/RELEASE-RESULT-v1.1.0.md",
            "includes_h2_selfimprove_studio_source_mirror": true,
            "h2_source_mirror": "integrations/h2-selfimprove-studio/",
            "includes_h2_production_overlay": true,
            "h2_production_overlay": "integrations/h2-selfimprove-studio-production-overlay/",
            "prior_work_catalog": "video-library/previous-works-catalog.json",
            "h2_source_release_manifest": "video-library/one-more-scroll/h2-source-release.json",
            "h2_source_release_url": "https://github.com/Nolane-x/video/releases/tag/h2-production-assets-v1",
            "h2_source_zip_binaries_embedded": false,
            "source_v2_candidate_workflow": ".github/workflows/verify-h2-source-v2.yml",
            "source_v3_shoelace_preview_workflow": ".github/workflows/preview-h2-source-v3-shoelace.yml",
            "source_v3_full_render_workflow": ".github/workflows/verify-h2-source-v3.yml",
            "source_v3_render_request": "video-library/one-more-scroll/h2-source-v3-render-request.json",
            "source_v3_shoelace_patch": "tools/video/patch_h2_shoelace_scene.py",
            "h2_source_release_manifest_sync_workflow": ".github/workflows/sync-h2-source-release-manifest.yml",
            "user_reference_clips_manifest": "video-library/reference-clips.json",
            "offline_user_reference_video_files_embedded": false,
            "canonical_h2_qa_report": "video-library/one-more-scroll/QA.md",
            "prior_work_video_masters_embedded": false,
            "prior_work_contact_sheets_embedded": $([ -d video-library/previous-works ] && echo true || echo false),
            "included_tools_and_sources": ["video-projects/remotion", "tools/blender", "tools/krita", "tools/video/validate_story.py", "tools/video/archive_h2_master.py", "tools/video/archive_previous_works.py", "tools/video/patch_h2_shoelace_scene.py"],
            "important": "The included Remotion render is not the original H2 Canvas/Chromium master. The H2 source ZIPs are versioned Release assets, linked from h2_source_release_manifest, and are not duplicated in this ZIP. Source-v3 has a pinned shoe-tying patch, a focused preview workflow and a full-render workflow; the candidate requires human motion review before it can replace the canonical master. The full upstream Remotion, Blender and Krita application source trees are not vendored."
          }
          JSON
          (cd bundle && zip -qr ../video-production-master-skill.zip .)
          test -s video-production-master-skill.zip
          zip -T video-production-master-skill.zip
          python - <<'PY'
          import hashlib, json, sys, zipfile
          path = "video-production-master-skill.zip"
          required = [
              ".agents/skills/video-production-master/SKILL.md",
              ".agents/skills/video-voice-design-director/SKILL.md",
              ".agents/skills/video-character-voice-casting-engineer/SKILL.md",
              ".agents/skills/video-voice-quality-auditor/SKILL.md",
              "docs/VOICE_STUDIO.md",
              "integrations/voice-studio/README.md",
              "integrations/voice-studio/design_voice_library.py",
              "integrations/voice-studio/generate_voiceover.py",
              "integrations/voice-studio/provider_voice_benchmark.py",
              "integrations/voice-studio/analyze_voice_benchmark.py",
              "integrations/voice-studio/actions_voice_lab.py",
              "integrations/voice-studio/examples/actions-benchmark-suite.json",
              "integrations/voice-studio/voice_quality.py",
              "integrations/voice-studio/VOICE_STUDIO_LOCK.json",
              "README.md",
              "AGENTS.md",
              "CLAUDE.md",
              "video-projects/remotion/src/OneMoreScroll.tsx",
              "video-projects/remotion/public/story/shots.json",
              "tools/blender/render_h2_stage.py",
              "tools/krita/README.md",
              "tools/video/archive_h2_master.py",
              "tools/video/archive_previous_works.py",
              "tools/video/patch_h2_shoelace_scene.py",
              "tools/video/publish_h2_source_release.ps1",
              "docs/TOOL_INVENTORY.md",
              "integrations/h2-selfimprove-studio/.codex-plugin/plugin.json",
              "integrations/h2-selfimprove-studio/SOURCE-MANIFEST.json",
              "integrations/h2-selfimprove-studio-production-overlay/SKILL-ADDENDUM.md",
              "integrations/h2-selfimprove-studio-production-overlay/README.md",
              "integrations/h2-selfimprove-studio-production-overlay/references/production-pipeline.md",
              "integrations/h2-selfimprove-studio-production-overlay/references/quality-gates.md",
              "integrations/h2-selfimprove-studio-production-overlay/references/state-handoff.md",
              "integrations/h2-selfimprove-studio-production-overlay/references/one-more-scroll-case-study.md",
              "integrations/h2-selfimprove-studio-production-overlay/RELEASE-RESULT-v1.1.0.md",
              "video-library/previous-works-catalog.json",
              "video-library/reference-clips.json",
              "video-library/one-more-scroll/manifest.json",
              "video-library/one-more-scroll/README.md",
              "video-library/one-more-scroll/QA.md",
              "video-library/one-more-scroll/latest-remotion-release.json",
              "video-library/one-more-scroll/one-more-scroll-h2-final.mp4",
              "video-library/one-more-scroll/one-more-scroll-h2-final.mp4.sha256",
              "video-library/one-more-scroll/original-h2-master-metadata.json",
              "video-library/one-more-scroll/original-h2-contact-sheet-shots.jpg",
              "video-library/one-more-scroll/original-h2-contact-sheet-overview.jpg",
              "video-library/one-more-scroll/h2-source-release.json",
              "video-library/one-more-scroll/h2-source-v3-render-request.json",
              ".github/workflows/verify-h2-source-v2.yml",
              ".github/workflows/preview-h2-source-v3-shoelace.yml",
              ".github/workflows/verify-h2-source-v3.yml",
              ".github/workflows/sync-h2-source-release-manifest.yml",
              "VIDEO_PRODUCTION_BUNDLE_MANIFEST.json",
          ]
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = set(archive.namelist())
              missing = [item for item in required if item not in names]
              if missing:
                  raise SystemExit(f"Missing expected bundle entries: {missing}")
              video_path = json.loads(archive.read("VIDEO_PRODUCTION_BUNDLE_MANIFEST.json"))["included_reference_render"]
              if video_path not in names:
                  raise SystemExit(f"Reference video missing from bundle: {video_path}")
              info = archive.getinfo(video_path)
              if info.file_size < 5_000_000:
                  raise SystemExit(f"Reference video unexpectedly small: {info.file_size}")
              h2 = "video-library/one-more-scroll/one-more-scroll-h2-final.mp4"
              if h2 not in names:
                  raise SystemExit("The canonical H2 master is mandatory in the portable bundle")
              if archive.getinfo(h2).file_size != 31_547_778:
                  raise SystemExit("The H2 master size does not match the expected canonical file")
              actual_h2_sha = hashlib.sha256(archive.read(h2)).hexdigest()
              expected_h2_sha = "be0608239a374cf10c89b2c9b16e642de962cdd8f1b177de1a173219413a940f"
              if actual_h2_sha != expected_h2_sha:
                  raise SystemExit(f"Bundled H2 master SHA-256 mismatch: {actual_h2_sha}")
              reference_map = json.loads(archive.read("video-library/reference-clips.json"))
              reference_ids = {item.get("id") for item in reference_map.get("references", [])}
              if not {"words-you-never-forgot", "what-if-you-were-a-mentalist"}.issubset(reference_ids):
                  raise SystemExit("The user's two reference-video entries are missing from the bundled reference manifest")
              release_manifest = json.loads(archive.read("video-library/one-more-scroll/h2-source-release.json"))
              if release_manifest.get("status") != "uploaded_to_github_release_and_checksum_verified":
                  raise SystemExit("The H2 source-release manifest is not marked as verified/published")
              release_assets = {item.get("filename"): item for item in release_manifest.get("assets", [])}
              if release_assets.get("one-more-scroll-h2-source.zip", {}).get("sha256") != "f6f8bed7179c166800b9ba2c79dbd53e12e24050645cee83b44d3ce27c11c42b":
                  raise SystemExit("Original H2 source release checksum is missing or stale")
              source_v3 = release_manifest.get("source_v3_render_candidate", {})
              if source_v3.get("status") != "technical_render_and_stream_validation_passed":
                  raise SystemExit("H2 source-v3 candidate has not passed full render/stream validation")
              if source_v3.get("is_canonical_master") is not False:
                  raise SystemExit("Source-v3 must remain a separate non-canonical candidate")
              for key, sha_key in [("candidate_filename", "candidate_sha256"), ("review_bundle_filename", "review_bundle_sha256")]:
                  filename = source_v3.get(key)
                  expected = source_v3.get(sha_key)
                  listed = release_assets.get(filename, {}) if filename else {}
                  if not filename or not expected or listed.get("sha256") != expected:
                      raise SystemExit(f"Source-v3 manifest asset/checksum mismatch: {filename}")
              if release_assets.get("one-more-scroll-h2-source-v2-scene-fixes.zip", {}).get("sha256") != "b8db965db214bf0e37b307d3fe1aa663c55f29ee753fd9103a5972b5fe633014":
                  raise SystemExit("H2 source-v2 release checksum is missing or stale")
              bundle_manifest = json.loads(archive.read("VIDEO_PRODUCTION_BUNDLE_MANIFEST.json"))
              if bundle_manifest.get("h2_source_release_url") != "https://github.com/Nolane-x/video/releases/tag/h2-production-assets-v1":
                  raise SystemExit("The verified H2 source-release URL is missing or stale")
              if bundle_manifest.get("h2_source_zip_binaries_embedded") is not False:
                  raise SystemExit("Source ZIPs must remain separate release assets, not duplicated in the portable ZIP")
              if "tools/video/patch_h2_shoelace_scene.py" not in names:
                  raise SystemExit("The deterministic source-v3 shoe-tying patch is missing from the portable package")
              if "video-library/one-more-scroll/h2-source-v3-render-request.json" not in names:
                  raise SystemExit("The source-v3 render request/provenance file is missing from the portable package")
              if ".github/workflows/preview-h2-source-v3-shoelace.yml" not in names:
                  raise SystemExit("The source-v3 shoe-tying preview workflow is missing from the portable package")
              if ".github/workflows/verify-h2-source-v3.yml" not in names:
                  raise SystemExit("The full source-v3 render workflow is missing from the portable package")
              if ".github/workflows/verify-h2-source-v2.yml" not in names:
                  raise SystemExit("The source-v2 candidate render workflow is missing from the portable package")
              if ".github/workflows/sync-h2-source-release-manifest.yml" not in names:
                  raise SystemExit("The H2 source release manifest sync workflow is missing from the portable package")
              if bundle_manifest.get("includes_original_h2_master") is not True:
                  raise SystemExit("Bundle manifest must mark the canonical H2 master as included")
              if bundle_manifest.get("canonical_h2_master_sha256") != expected_h2_sha:
                  raise SystemExit("Bundle manifest H2 checksum is missing or stale")
              if bundle_manifest.get("offline_user_reference_video_files_embedded") is not False:
                  raise SystemExit("Reference media policy must distinguish catalogued links from offline MP4 files")
              if bundle_manifest.get("active_chatgpt_plugin_version") != "1.1.0":
                  raise SystemExit("Active ChatGPT plugin version was not captured in the portable bundle manifest")
              if bundle_manifest.get("active_chatgpt_plugin_release_id") != "pluginrel_6ade248942988191a57ff1059c818720":
                  raise SystemExit("Active ChatGPT plugin release ID is missing or stale")
              if bundle_manifest.get("includes_h2_production_overlay") is not True:
                  raise SystemExit("H2 production overlay is not recorded in the bundle manifest")
              overlay_skill = "integrations/h2-selfimprove-studio-production-overlay/SKILL-ADDENDUM.md"
              if overlay_skill not in names:
                  raise SystemExit("H2 production overlay was not packaged")
              print(f"Verified portable ZIP: {len(names)} entries; Remotion MP4 {info.file_size:,} bytes; H2 production overlay present; active plugin v1.1.0; original H2 master included=True.")
          PY
          ls -lh video-production-master-skill.zip "$DEST/one-more-scroll-remotion-master.mp4"
          sha256sum video-production-master-skill.zip | tee video-production-master-skill.zip.sha256

      - name: Persist bundle to the repository
        run: |
          set -euo pipefail
          cp video-production-master-skill.zip video-library/video-production-master-skill.zip
          cp video-production-master-skill.zip.sha256 video-library/video-production-master-skill.zip.sha256
          VIDEO_PATH="$(python -c 'import json; print(json.load(open("video-library/one-more-scroll/latest-remotion-release.json"))["video_path"])')"
          RENDER_DIR="$(dirname "$VIDEO_PATH")"
          cp video-production-master-skill.zip "$RENDER_DIR/video-production-master-skill.zip"
          cp video-production-master-skill.zip.sha256 "$RENDER_DIR/video-production-master-skill.zip.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-library/video-production-master-skill.zip video-library/video-production-master-skill.zip.sha256 \
            "$RENDER_DIR/video-production-master-skill.zip" "$RENDER_DIR/video-production-master-skill.zip.sha256"
          if git diff --cached --quiet; then
            echo "Bundle is already current."
            exit 0
          fi
          git commit -m "build: package portable video skill with reference footage"
          git push origin main
