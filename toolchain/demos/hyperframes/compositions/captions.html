<template id="captions-template">
<section data-composition-id="captions" data-width="1920" data-height="1080" data-duration="17">
<div class="captions-container"><div id="caption-box" class="caption-box" aria-live="polite"><span id="caption-text" class="caption-text"></span></div></div>
<style>
[data-composition-id="captions"]{position:relative;width:1920px;height:1080px;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
[data-composition-id="captions"] .captions-container{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;padding:0 120px 154px;pointer-events:none}
[data-composition-id="captions"] .caption-box{display:flex;justify-content:center;align-items:center;min-height:82px;max-width:1600px;padding:18px 34px;border-radius:20px;background:#f7f0e3;border:1px solid rgba(32,42,39,.16);box-shadow:0 14px 38px rgba(32,42,39,.15);opacity:0;visibility:hidden}
[data-composition-id="captions"] .caption-text{color:#202a27;font-size:43px;font-weight:760;line-height:1.16;letter-spacing:-.018em;text-align:center;white-space:normal}
</style>
<script>
(function(){
const phrases=[
{text:"A good video starts with a clear idea.",start:.48,end:2.28},
{text:"Shape each beat into a visual story.",start:2.62,end:4.92},
{text:"Let motion guide the viewer's attention.",start:5.18,end:7.58},
{text:"Make every word easy to read.",start:7.9,end:10.38},
{text:"Then render, inspect, and refine.",start:10.76,end:13.08},
{text:"A polished film is built, frame by frame.",start:13.48,end:16.55}
];
const tl=gsap.timeline({paused:true});
const box=document.querySelector('[data-composition-id="captions"] #caption-box');
const text=document.querySelector('[data-composition-id="captions"] #caption-text');
phrases.forEach((phrase)=>{
tl.set(text,{textContent:phrase.text},phrase.start);
tl.set(box,{visibility:"visible"},phrase.start);
tl.fromTo(box,{opacity:0,y:13},{opacity:1,y:0,duration:.16,ease:"power2.out"},phrase.start);
tl.to(box,{opacity:0,y:-7,duration:.16,ease:"power2.in"},phrase.end-.16);
tl.set(box,{visibility:"hidden"},phrase.end+.02);
});
window.__timelines=window.__timelines||{};window.__timelines["captions"]=tl;
})();
</script>
</section>
</template>
